            - heading [level=2] [ref=f3157e104]:
              - strong [ref=f3157e105]: "Job Description:"
            - paragraph [ref=f3157e106]:
              - text: At
              - strong [ref=f3157e107]: Sovos
              - text: ", we deliver enterprise-grade solutions that power global tax compliance for some of the world’s largest organizations. As a"
              - strong [ref=f3157e108]: Software Engineer
              - text: ", you’ll launch your career designing, implementing, and supporting system-to-system integrations between Sovos platforms, client ERPs, and third-party applications."
            - paragraph [ref=f3157e109]:
              - emphasis [ref=f3157e110]: "More specifically, you will:"
            - list [ref=f3157e111]:
              - listitem [ref=f3157e112]:
                - text: Support integration projects under the guidance of senior
                - link "engineers" [ref=f3157e113] [cursor=pointer]:
                  - /url: "#"
                - text: ", contributing to technical design and implementation"
              - listitem [ref=f3157e116]: Assist in gathering and analyzing business and technical requirements from clients and translating them into integration solutions
              - listitem [ref=f3157e117]: Help design and implement API-based integrations (REST/SOAP) between Sovos platforms and client ERP systems
              - listitem [ref=f3157e118]: Provide technical support during integration onboarding, UAT, and post-production go-live phases
              - listitem [ref=f3157e119]: Collaborate with client teams and third-party integration partners to support timely delivery and issue resolution
              - listitem [ref=f3157e120]: Troubleshoot and resolve integration, data, and system issues across development and production environments
              - listitem [ref=f3157e121]: Validate data flows, mappings, and transformations between source and target systems
              - listitem [ref=f3157e122]: Document integration designs, interface specifications, and support procedures
              - listitem [ref=f3157e123]: Work with internal engineering, QA, database, and product teams to deliver reliable integration solutions
              - listitem [ref=f3157e124]: Monitor production integrations and assist with incident analysis and root cause resolution
              - listitem [ref=f3157e125]: Learn and apply security, compliance, and performance standards across all integration work
            - paragraph [ref=f3157e126]:
              - strong [ref=f3157e127]: What We Need From You
            - list [ref=f3157e128]:
              - listitem [ref=f3157e129]: Bachelor’s degree in Computer Science, Information Technology, Engineering, or related field (or equivalent practical experience)
              - listitem [ref=f3157e130]: 0-1 years of experience in software development, integration, or related technical roles (internships and academic projects count!)
              - listitem [ref=f3157e131]: Basic understanding of APIs (REST/SOAP) and how systems communicate
              - listitem [ref=f3157e132]: Foundational knowledge of programming concepts and at least one programming language (Java, Python, C#, or similar)
              - listitem [ref=f3157e133]: Familiarity with JSON and XML data formats
              - listitem [ref=f3157e134]: Basic SQL knowledge for querying and validating data
              - listitem [ref=f3157e135]: Interest in learning ERP systems such as NetSuite, SAP, Oracle, or Microsoft Dynamics
              - listitem [ref=f3157e136]: Strong problem-solving mindset and eagerness to learn new technologies
              - listitem [ref=f3157e137]: Ability to communicate technical concepts clearly to both technical and non-technical audiences
              - listitem [ref=f3157e138]: Collaborative team player who thrives in a global, cross-functional environment
              - listitem [ref=f3157e139]: Exposure to cloud platforms (AWS preferred) is a plus
              - listitem [ref=f3157e140]: Due to client contractual obligations, the successful candidate will be asked to clear a background check and drug test upon hire
            - heading [level=2] [ref=f3157e141]:
              - strong [ref=f3157e142]: "How To Apply :"
            - paragraph [ref=f3157e143]:
              - text: Interested and eligible candidates can apply for the hiring on the following application Sovos careers link, Shortlisted candidates will receive further selection process.
