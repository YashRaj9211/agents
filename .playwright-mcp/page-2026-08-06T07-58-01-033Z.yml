            - heading "Role Description :" [level=3] [ref=f670e118]
            - paragraph [ref=f670e119]: You will work closely with a cross-functional team of engineers working together to bring text alive on Embedded Displays. You are expected to contribute to the design, and development of new features, identify technical risks and find alternate solutions to various problems. In addition, the role also demands to follow best practices while developing code and writing tests.
            - paragraph [ref=f670e120]:
              - strong [ref=f670e121]: "What you’ll be doing:"
              - text: • Work in a small scrum team designing and building high-quality customer-facing software.• Write automation tests to support the new features.• Gain product knowledge by successfully developing features for our applications.• Communicate effectively with stakeholders, peers, and others.
              - link "Trainee recruitment services" [ref=f670e122] [cursor=pointer]
