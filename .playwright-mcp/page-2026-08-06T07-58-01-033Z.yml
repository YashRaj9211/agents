            - paragraph [ref=f670e129]:
              - strong [ref=f670e130]: "What we’re looking for:"
              - text: • Strong knowledge with C and algorithms is a MUST.• Knowledge on Python and coding related tools like – Cursor, ChatGPT, Claude is a plus.• Concepts on memory optimization, platform independent coding, complexity analysis etc.• Experience with Visual Studio or Makefiles.• Experience with GitHub and the Features branching workflow.• Awesome Written and Oral communication skills.
