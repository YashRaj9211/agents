            - heading [level=2] [ref=f2603e108]:
              - strong [ref=f2603e109]: "Job Description :"
            - paragraph [ref=f2603e110]:
              - text: This role is ideal for those at the start of their professional journey, with less than two years of industry experience who are eager to learn, grow, and make an immediate impact. As this is a general posting, we’ll align you with a team based on your skills, interests, and career aspirations to set you up for success.
              - link "Science" [ref=f2603e111] [cursor=pointer]
            - paragraph [ref=f2603e115]:
              - strong [ref=f2603e116]: Responsibilities
            - paragraph [ref=f2603e117]: "Frontend Engineering:"
            - list [ref=f2603e118]:
              - listitem [ref=f2603e119]: Experience developing scalable, responsive, and dynamic web-based applications
              - listitem [ref=f2603e120]: Familiarity with modern frontend tools and frameworks such as React, AngularJS, or Vue.js
              - listitem [ref=f2603e121]: Knowledge of HTML, CSS, and JavaScript standards
              - listitem [ref=f2603e122]: Strong ability to collaborate with designers, UX specialists, and backend engineers
            - paragraph [ref=f2603e123]: "Backend Engineering:"
            - list [ref=f2603e124]:
              - listitem [ref=f2603e125]: Experience developing web applications using server-side languages, such as Java, Python, or Node.js.
              - listitem [ref=f2603e126]: Familiarity with database technologies such as MySQL, PostgreSQL, or MongoDB
              - listitem [ref=f2603e127]: Understanding of RESTful API design principles and ability to work with API integrations
              - listitem [ref=f2603e128]: Experience with server frameworks such as Express, Spring MVC or Django
            - paragraph [ref=f2603e129]: "Fullstack Engineering:"
            - list [ref=f2603e130]:
              - listitem [ref=f2603e131]: Familiarity with both frontend and backend development
              - listitem [ref=f2603e132]: Ability to work effectively with developers and designers, discussing application and API architectures
              - listitem [ref=f2603e133]: Understanding of Agile methodologies and ability to work with Scrum teams
              - listitem [ref=f2603e134]: Familiarity with tools such as Git, Jenkins, or Travis
            - paragraph [ref=f2603e135]: "Mobile Engineering:"
            - list [ref=f2603e136]:
              - listitem [ref=f2603e137]: Experience developing applications for one or more platforms such as Android and iOS
              - listitem [ref=f2603e138]: Familiarity with mobile application development frameworks such as React Native or Flutter
              - listitem [ref=f2603e139]: Understanding of development tools such as XCode, Android Studio and SDK languages such as Objective-C, Swift or Java
              - listitem [ref=f2603e140]: Ability to work with designers and backend engineers to integrate mobile applications with cloud-based APIs
            - paragraph [ref=f2603e141]:
              - text: "Across all tech stacks:"
              - link "Civil Engineering" [ref=f2603e142] [cursor=pointer]
            - list [ref=f2603e146]:
              - listitem [ref=f2603e147]: Contribute to our core products and services, as well as systems that power critical engineering operations.
              - listitem [ref=f2603e148]: See your work launched and help solve meaningful problems for customers.
              - listitem [ref=f2603e149]: Learn and apply proven best practices in designing, building, and supporting software projects.
              - listitem [ref=f2603e150]: Receive hands-on guidance, detailed feedback, and mentorship from experienced team members.
              - listitem [ref=f2603e151]: Collaborate closely with peers across disciplines and build strong, supportive working relationships.
            - paragraph [ref=f2603e152]:
              - strong [ref=f2603e153]: Qualifications
            - paragraph [ref=f2603e154]:
              - strong [ref=f2603e155]: Qualifications
            - list [ref=f2603e156]:
              - listitem [ref=f2603e157]: Bachelor’s or Master’s degree in Computer Science, a related technical field, or equivalent practical experience.
              - listitem [ref=f2603e158]: Foundational understanding of Agile development, object-oriented design, and programming principles.
              - listitem [ref=f2603e159]: Coursework, internships, personal projects, or academic experience with one or more programming languages (e.g., Java, Python, JavaScript, C++, etc.).
              - listitem [ref=f2603e160]: Basic knowledge of front-end web technologies (e.g., HTML, CSS, JavaScript) and familiarity with frameworks or tools is a plus.
              - listitem [ref=f2603e161]: Strong written, verbal, and collaboration skills with the ability to work effectively in a team environment.
              - listitem [ref=f2603e162]: Awareness of AI concepts and a basic understanding of capabilities like Generative AI.
              - listitem [ref=f2603e163]: Willingness to learn and adapt to new priorities, tools, and technologies in a fast-paced, dynamic environment.
            - heading [level=2] [ref=f2603e164]:
              - strong [ref=f2603e165]: "How To Apply:"
