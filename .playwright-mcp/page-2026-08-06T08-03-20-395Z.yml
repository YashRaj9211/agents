                  - /url: "#"
                - text: Description;
            - paragraph [ref=f1092e112]: Our team builds scalable platforms and internal products that support engineering and business operations. We move fast, collaborate closely, and encourage continuous learning and experimentation. We value engineers who are curious, adaptable, and excited to grow in the AI-driven software engineering era.
            - heading "Responsibilities:" [level=2] [ref=f1092e113]
            - list [ref=f1092e114]:
              - listitem [ref=f1092e115]: Designing, developing, and maintaining frontend and backend applications.
              - listitem [ref=f1092e116]: Building responsive UI components and reliable backend APIs for scalable applications.
              - listitem [ref=f1092e117]: Collaborating with product managers, designers, and engineers to deliver features quickly and iteratively.
              - listitem [ref=f1092e118]: Writing clean, maintainable, and testable code following engineering best practices.
              - listitem [ref=f1092e119]: Debugging production issues, improving application performance, and ensuring service reliability.
              - listitem [ref=f1092e120]: Working with databases, cloud platforms, and containerized environments.
              - listitem [ref=f1092e121]: Leveraging AI-powered developer tools and modern workflows to improve productivity and accelerate delivery.
              - listitem [ref=f1092e122]: Learning new technologies quickly and contributing across different parts of the stack as needed.
            - heading "What We’re Looking For" [level=2] [ref=f1092e123]
            - list [ref=f1092e124]:
              - listitem [ref=f1092e125]: 0–3 years of software engineering experience in frontend, backend, or full-stack development.
              - listitem [ref=f1092e126]: Strong fundamentals in data structures, problem solving, and software engineering concepts.
              - listitem [ref=f1092e127]: Experience with JavaScript/TypeScript and modern frontend frameworks such as React, Angular, or Vue.js.
              - listitem [ref=f1092e128]: Experience building backend services or APIs using Node.js, Python, Java, or similar technologies.
              - listitem [ref=f1092e129]: Understanding of databases such as PostgreSQL, MySQL, MongoDB, or Redis.
              - listitem [ref=f1092e130]: Familiarity with Git, debugging, testing, and basic CI/CD workflows.
              - listitem [ref=f1092e131]: Basic understanding of cloud platforms, Docker, and modern deployment environments.
              - listitem [ref=f1092e132]: Strong learning mindset, curiosity, and ability to adapt quickly in a fast-moving engineering environment.
              - listitem [ref=f1092e133]: Passion for leveraging AI tools, automation, and modern engineering workflows to improve productivity and software quality.
              - listitem [ref=f1092e134]: Exposure to Kubernetes, Kafka, distributed systems, or data engineering concepts.
              - listitem [ref=f1092e135]: •Contributions to personal projects, open-source work, hackathons, internships, or AI-driven applications
