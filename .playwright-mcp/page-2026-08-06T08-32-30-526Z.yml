              - text: ":"
            - paragraph [ref=f2847e111]:
              - text: As a fresher joining our Web Development or QA teams, you will work on real, globally used products, learn from experienced
              - link "engineers" [ref=f2847e112] [cursor=pointer]:
                - /url: "#"
              - text: ", and grow in an environment that values ownership, clarity, and craftsmanship. This role is ideal for someone starting their career in software engineering and looking for exposure to real-world product development, modern web technologies, and high-impact projects."
            - paragraph [ref=f2847e115]: "You will be responsible for:"
            - list [ref=f2847e116]:
              - listitem [ref=f2847e117]: Learning system architecture, workflows, and coding standards with guidance from senior engineers.
              - listitem [ref=f2847e118]: Contributing to feature development across frontend, backend, or QA automation tracks.
              - listitem [ref=f2847e119]: Writing clean, maintainable, and well-tested code.
              - listitem [ref=f2847e120]: Collaborating with Product, Design, and QA teams to understand requirements and deliver high-quality features.
              - listitem [ref=f2847e121]: Participating in stand-ups, sprint ceremonies, and technical discussions.
              - listitem [ref=f2847e122]: Strengthening fundamentals in data structures, algorithms, and core programming concepts.
              - listitem [ref=f2847e123]: Gaining hands-on experience with Git, JIRA, code reviews, and Agile practices.
              - listitem [ref=f2847e124]: (For QA roles) Learning manual testing, automation frameworks, and quality best practices.
              - listitem [ref=f2847e125]: Taking feedback positively and continuously improving technical and communication skills.
              - listitem [ref=f2847e126]: Proactively learning new tools, frameworks, and product areas.
            - paragraph [ref=f2847e127]:
