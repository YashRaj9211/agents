            - heading [level=2] [ref=f2565e113]:
              - strong [ref=f2565e114]: "Philips Job Description :"
            - paragraph [ref=f2565e115]:
              - text: • Participates in full software development processes, working with broader autonomy and in pairing mode with other software team members, challenging requirements, design, and quality.• Serves as a recognized technical expert in specific areas within the team, leading the creation of software designs and providing guidance on best practices.• Takes on moderately complex software development tasks, collaborating with senior team members to deliver high-quality software solutions that meet project requirements.• Develops and executes comprehensive test plans, including unit, integration, and system tests, to ensure software reliability, performance, and adherence to specifications.• Conducts thorough code reviews to ensure adherence to coding standards, identify potential bugs, and promote best practices in software development, fostering a culture of continuous improvement and high-quality code.• Supports DevOps in deploying software, setting, monitoring, and ensuring own performance metrics are met, while also defining, monitoring, and meeting broader performance and quality metrics.• Diagnoses and resolves software defects by analyzing logs, reproducing issues, and implementing effective fixes to enhance software reliability and performance.• Creates and maintains comprehensive technical documentation, including system architecture diagrams, API specifications, and user guides to facilitate knowledge sharing and support.• Keeps abreast of emerging technologies, industry trends, and best practices in software development to continuously improve skill sets and apply innovative solutions.• Applies analytical skills to resolve medium complexity requests efficiently, exercising judgment within defined procedures/practices to determine appropriate action.
              - strong [ref=f2565e116]: "You’re the right fit if:"
              - link "Internships" [ref=f2565e117] [cursor=pointer]
            - paragraph [ref=f2565e121]: • Bachelor’s Degree in Computer Science, Software Engineering, Information Technology or Vocational Education in Information Technology or equivalent with experience in Software Development, Software Design and Architecture, Testing and Quality Assurance or equivalent.
            - insertion [ref=f2565e123]
            - paragraph [ref=f2565e125]:
              - text: • 1+ year of experience in C# .NET, AWS cloud knowledge, experience in writing unit test code, good to have healthcare background preferably DICOM knowledge.
