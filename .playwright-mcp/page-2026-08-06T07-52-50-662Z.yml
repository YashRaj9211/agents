            - heading [level=2] [ref=f41e115]:
              - strong [ref=f41e116]: "Job Description:"
            - paragraph [ref=f41e117]:
              - text: We are looking for a passionate and motivated full stack developer with experience in PHP and Angular to join our development team. The candidate will be responsible for developing, maintaining, and enhancing web applications, APIs, and backend services while collaborating with cross-functional teams to deliver high-quality solutions.
              - strong [ref=f41e118]: "Key Responsibilities:"
              - link "Jobs" [ref=f41e119] [cursor=pointer]
            - list [ref=f41e123]:
              - listitem [ref=f41e124]: Develop and maintain web applications using PHP and Angular.
              - listitem [ref=f41e125]: Design and develop REST APIs and backend services .
              - listitem [ref=f41e126]: Work with MySQL databases for query writing, optimization, and maintenance.
              - listitem [ref=f41e127]: Integrate third-party APIs and services.
              - listitem [ref=f41e128]: Debug, troubleshoot, and resolve application issues.
              - listitem [ref=f41e129]: Participate in code reviews and follow coding standards.
              - listitem [ref=f41e130]: Collaborate with frontend, backend, QA, and DevOps teams.
              - listitem [ref=f41e131]: Optimize application performance and scalability.
              - listitem [ref=f41e132]: Maintain proper documentation for development tasks and modules.
              - listitem [ref=f41e133]: Work on bug fixing, enhancements, and new feature development.
            - insertion [ref=f41e135]
            - heading "Qualifications" [level=3] [ref=f41e137]
            - heading "Minimum Qualifications" [level=4] [ref=f41e138]
            - list [ref=f41e139]:
              - listitem [ref=f41e140]: 6 Months to 1 Years of experience in full-stack development or working knowledge
              - listitem [ref=f41e141]: Strong knowledge of Core PHP and Hands-on experience with Angular.
              - listitem [ref=f41e142]: Good understanding of HTML, CSS, JavaScript, and TypeScript.
              - listitem [ref=f41e143]: Experience with MySQL database Knowledge of REST API development and integration.
              - listitem [ref=f41e144]: Familiarity with Git/version control systems.
              - listitem [ref=f41e145]: Basic understanding of Linux servers and deployment process.
              - listitem [ref=f41e146]: Good debugging and problem-solving skills Strong communication and teamwork abilities.
            - paragraph
