                  - /url: https://chat.whatsapp.com/LD7u8YPDaP7JDTDrnpwNNP
              - generic [ref=f1182e136]:
                - generic [ref=f1182e137]: Telegram Channel
                - link "Join Now" [ref=f1182e139] [cursor=pointer]:
                  - /url: https://telegram.me/campusdrivejobs
            - paragraph [ref=f1182e140]:
              - text: Qualifications:• Bachelor’s or master’s degree in computer science, IT, or related engineeringfields.• Strong understanding of programming fundamentals (Java, JavaScript, or similar).• Basic knowledge of data structures, algorithms, and OOP concepts.• Familiarity with web technologies, databases, or cloud concepts is a plus.• Good analytical and problem-solving skills.• Strong communication skills and eagerness to learn.
              - link "Geographic Reference" [ref=f1182e141] [cursor=pointer]
            - paragraph [ref=f1182e145]: Preferred Skills (Good to Have)• Exposure to frameworks such as React, or Node.js.• Understanding of REST APIs and microservices architecture.• Knowledge of version control systems like Git.• Experience with SQL/NoSQL databases.• Familiarity with CI/CD pipelines or DevOps concepts
