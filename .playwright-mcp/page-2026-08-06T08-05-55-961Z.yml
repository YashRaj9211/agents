            - paragraph [ref=f1182e116]:
              - text: Tracelink is recognized as an industry leader by Gartner and IDC, and for having a great company culture by Comparably.
              - link "Engineering & Technology" [ref=f1182e117] [cursor=pointer]
            - paragraph [ref=f1182e121]:
              - text: Key Responsibilities• Assist in the design, development, and testing of software features across Tracelink’splatform.• Collaborate with senior
              - link "engineers" [ref=f1182e122] [cursor=pointer]:
                - /url: "#"
              - text: to troubleshoot, debug, and resolve technical issues.• Participate in code reviews, sprint planning, and daily standups as part of an agileenvironment.• Write clean, maintainable, and efficient code following best practices.• Support integration, QA, and DevOps teams with required technical tasks.• Contribute to documentation, test cases, and automation efforts.
              - link "Enterprise Technology" [ref=f1182e125] [cursor=pointer]
            - generic [ref=f1182e131]:
              - generic [ref=f1182e132]:
