            - heading "Job Description :" [level=3] [ref=f974e119]:
              - text: "Job Description :"
              - strong
            - paragraph [ref=f974e120]: "In ADP, we’re building the next generation of technologies. Our mission is simple: Create powerful solutions that are efficient, intuitive, beautiful, and responsive. As an Associate Software Engineer, you’ll work in a SCRUM/Agile software development environment where all team members share responsibility of design, development, test planning, test execution and documentation of the product."
            - insertion [ref=f974e122]
            - paragraph [ref=f974e124]:
              - strong [ref=f974e125]: "What you’ll do:"
              - link "Computer Science" [ref=f974e126] [cursor=pointer]
            - paragraph [ref=f974e130]:
              - text:  Develop, certify and deploy the application/modules based on functional and system requirements.
              - link "Science" [ref=f974e131] [cursor=pointer]
            - paragraph [ref=f974e135]:  Work closely with Business Analysts, Architecture team and other stakeholders to understand functional – system requirements, architectural integrity, and product quality respectively.
            - paragraph [ref=f974e136]:  Document consistently throughout the development.
            - paragraph [ref=f974e137]:  Escalate any issues to the Lead Application Developer that will affect the delivery of the project
            - paragraph [ref=f974e138]:  Contribute to ongoing team’s processes, procedures and best practices.
            - insertion [ref=f974e140]
            - paragraph [ref=f974e142]:
              - strong [ref=f974e143]: "Qualifications you’ll need:"
              - link "Enterprise Technology" [ref=f974e144] [cursor=pointer]
            - paragraph [ref=f974e148]: "Education: Bachelor’s degree (or pursuing final year with no outstanding arrears) preferably in Computer Science or Information Technology"
            - paragraph [ref=f974e149]:
              - strong [ref=f974e150]: "Experience:"
            - paragraph [ref=f974e151]:  Basic programming skills (Any programming language)
            - paragraph [ref=f974e152]:  Strong core knowledge on Oops, data structures and algorithms
            - paragraph [ref=f974e153]:  A very good logical reasoning skill and ability to solve complex problems using algorithms/ flow chart/ programs
            - paragraph [ref=f974e154]:  A clear understanding of database, preferably RDBMS
            - paragraph [ref=f974e155]:
              - text:  Active contribution to the final year project with a clear understanding of the overall project
              - link "Payroll Services" [ref=f974e156] [cursor=pointer]
            - insertion [ref=f974e161]
            - paragraph [ref=f974e163]:
              - text:  Participation in hackathon, codify, debugging or any other similar events.
              - link "Jobs" [ref=f974e164] [cursor=pointer]
            - paragraph [ref=f974e168]:  Participation in college team events
            - paragraph [ref=f974e169]:
              - strong [ref=f974e170]: "Bonus points if you have these:"
            - paragraph [ref=f974e171]:  Knowledge in AI/ML
            - paragraph [ref=f974e172]:  Experience in organising events within college.
            - paragraph [ref=f974e173]:  Git hub accounts managing source code.
            - paragraph [ref=f974e174]:  Internship in a registered reputed software company
            - heading [level=4] [ref=f974e175]:
              - strong [ref=f974e176]: "How To Apply:"
            - paragraph [ref=f974e177]:
              - text: The interested and eligible graduates register for the same position on following ADP Graduate Program link.
