            - paragraph [ref=f2090e105]: We are looking for an Associate Software Engineer who is dedicated to and is proud of his/her craft. Apart from being able to hit the ground running, the candidate is also expected to write robust code and scale themselves in a way that impacts the platform(s) in a meaningful way.
            - paragraph [ref=f2090e106]:
              - text: You will be a part of a Scrum Team that is responsible for all aspects of the ongoing product development from the initial specification, development, testing and eventually releasing
