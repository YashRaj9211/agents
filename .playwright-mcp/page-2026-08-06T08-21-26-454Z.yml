            - list [ref=f2090e124]:
              - listitem [ref=f2090e125]: Proficiency in a modern OOPs programming language like Python/Java/C++
              - listitem [ref=f2090e126]: Knowledge of any SQL/NoSQL databases will be a plus
              - listitem [ref=f2090e127]: Strong written & verbal communication skills
              - listitem [ref=f2090e128]: Passion for ‘good’ development practices – Unit testing, TDD, BDD, modularity, Micro Services.
              - listitem [ref=f2090e129]: Interest in working in a cloud-driven architecture
