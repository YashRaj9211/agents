            - list [ref=f2090e112]:
              - listitem [ref=f2090e113]: Plan, Design, Architect, Develop, Test and deploy complex web applications on cloud
              - listitem [ref=f2090e114]: Troubleshoot, test and automate all aspects of product to ensure strong optimization and functionality
              - listitem [ref=f2090e115]: Adoption of Scrum and other agile practices as applicable
              - listitem [ref=f2090e116]: Work with product managers to manage feature/product development time-lines and requirements
              - listitem [ref=f2090e117]: Stay abreast of current trends and best practices in coding standards and cloud technologies
