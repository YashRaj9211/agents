            - paragraph [ref=f2935e137]:
              - text: The program spans over 18 months and consists of three six-month rotations (3*6) across different departments like Full Stack Development, Data Science/AI-ML, Data Engineering/Data Virtualization, Cloud Engineering, Devops, Automation ( Test/Infrastructure), Agile Project Management & Product Development.
              - link "Software" [ref=f2935e138] [cursor=pointer]
            - paragraph [ref=f2935e142]:
              - strong [ref=f2935e143]: "What’s in it for you:"
            - generic [ref=f2935e144]:
              - insertion:
                - generic:
                  - iframe
            - list [ref=f2935e145]:
              - listitem [ref=f2935e146]: As a Graduate Program Participant, you will quickly gain exposure to a wide range of technologies, frameworks and paradigms which will broaden and deepen your knowledge and provide a stimulating and challenging working environment.
              - listitem [ref=f2935e147]:
                - text: "Cross-functional Exposure: Explore various domains within the technology landscape, including"
                - link "software" [ref=f2935e148] [cursor=pointer]:
                  - /url: "#"
                - text: development,
                - link "data" [ref=f2935e151] [cursor=pointer]:
                  - /url: "#"
                - text: analytics, Data sciences, and more.
              - listitem [ref=f2935e154]: "Structured Learning: Benefit from structured training sessions, workshops, and mentorship opportunities tailored to your development needs."
              - listitem [ref=f2935e155]: "Hands-on Experience: Engage in real-world projects from day one, working alongside experienced professionals in cutting-edge technology environments."
              - listitem [ref=f2935e156]: "Networking Opportunities: Connect with industry experts, build relationships with peers, and expand your professional network through networking events, seminars, and community initiatives."
              - listitem [ref=f2935e157]: "Career Guidance: Receive personalized career guidance and support from program manager throughout your journey."
              - listitem [ref=f2935e158]: "Continuous Feedback: Regular evaluations and feedback sessions to track progress and ensure continuous improvement."
              - listitem [ref=f2935e159]: "Career Pathway: Upon successful completion of the program, participants will have the opportunity to transition into diverse roles within the organization, based on their interests, strengths, and business needs. What We’re Looking For:"
            - paragraph [ref=f2935e160]:
              - strong [ref=f2935e161]: "Basic Required Qualifications:"
            - list [ref=f2935e162]:
              - listitem [ref=f2935e163]: Fresher with bachelor’s degree in computer science, Engineering, or another analytical/technical subject (Passing year 2026)
              - listitem [ref=f2935e164]: Excellent communication and time management skills.
              - listitem [ref=f2935e165]: Willing to work in 24*5 rotational shift depending on the business requirement.
              - listitem [ref=f2935e166]: Knowledge on Coding, Data structure & algorithms.
              - listitem [ref=f2935e167]: A strong desire to pursue a career in software development and delivery and a demonstrable the ability to quickly understand and apply new technical concepts and frameworks.
              - listitem [ref=f2935e168]: Strong critical thinking and problem-solving skills.
              - listitem [ref=f2935e169]: An aptitude to learn and adapt quickly in a rapidly changing environment.
              - listitem [ref=f2935e170]: The ability to build strong working relationships in a collaborative setting.
              - listitem [ref=f2935e171]: Familiarity with database concepts.
              - listitem [ref=f2935e172]: Good understanding of object-oriented programming, clean code principles, and design patterns.
              - listitem [ref=f2935e173]: Knowledge of techniques like unit testing, pair programming, code reviews, etc.
            - paragraph [ref=f2935e174]:
              - text: "How To Apply For S&P Global :"
