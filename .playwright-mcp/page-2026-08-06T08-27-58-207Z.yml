            - 'heading "About Smartsheet: Empowering Teams Worldwide" [level=2] [ref=f2586e134]'
            - paragraph [ref=f2586e135]:
              - text: Smartsheet is a leading cloud-based platform for work management and collaboration. Trusted by millions of users and numerous Fortune 500 companies, Smartsheet empowers teams to plan, track, automate, and report on work. With a focus on innovation and customer success, Smartsheet continues to expand its global footprint, and India is a key strategic location for its engineering talent. Joining Smartsheet means becoming part of a dynamic, forward-thinking company that values growth, collaboration, and technical excellence.
              - link "Software" [ref=f2586e136] [cursor=pointer]
