            - heading "Frequently Asked Questions (FAQ)" [level=2] [ref=f2586e223]
            - heading "1. What is the Smartsheet HPEL Program?" [level=3] [ref=f2586e224]
            - paragraph [ref=f2586e225]:
              - text: The HPEL (High Potential Entry-Level) Program is Smartsheet’s initiative for early-career engineers, specifically designed for fresh graduates who prioritize technical mastery and foundational engineering skills over immediate specialization. It aims to develop well-rounded “Engineers” rather than niche specialists.
              - link "Career Resources & Planning" [ref=f2586e226] [cursor=pointer]
            - heading "2. Which batch is eligible for this Smartsheet Off Campus Drive?" [level=3] [ref=f2586e230]
            - paragraph [ref=f2586e231]: This drive is exclusively for the Class of 2025 graduates (BE/B.Tech).
            - heading "3. Is this a remote job?" [level=3] [ref=f2586e232]
            - paragraph [ref=f2586e233]: Yes, the Associate Software Engineer position under the HPEL Program is a remote role for candidates located anywhere in India.
            - heading "4. What qualifications are required for this role?" [level=3] [ref=f2586e234]
            - paragraph [ref=f2586e235]:
              - text: Candidates must hold a B.Tech/BE degree, preferably in Computer Science or a related field.
              - link "Engineering & Technology" [ref=f2586e236] [cursor=pointer]
            - heading "5. What kind of skills is Smartsheet looking for?" [level=3] [ref=f2586e240]
            - paragraph [ref=f2586e241]: Smartsheet emphasizes a strong CS core (Data Structures, Algorithms, OOP), logical clarity, proficiency in at least one C-style language (Java, Go, C++, Node.js), and a strong growth mindset/coachability signal. They are looking for general engineering aptitude, not specific stack expertise.
            - heading "6. What is the application deadline?" [level=3] [ref=f2586e242]
            - paragraph [ref=f2586e243]:
              - text: The application deadline is not explicitly mentioned. It’s advisable to apply as soon as possible as these opportunities tend to fill up quickly.
              - link "Project Management Software" [ref=f2586e244] [cursor=pointer]
