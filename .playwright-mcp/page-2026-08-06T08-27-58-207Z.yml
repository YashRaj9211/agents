            - heading "Smartsheet Associate Software Engineer Job Description (HPEL Program)" [level=2] [ref=f2586e151]
            - paragraph [ref=f2586e152]:
              - text: In line with our strategic expansion in India, Smartsheet is proud to introduce the HPEL Program for Fiscal Year 2027. This initiative is designed for early-career engineers who prioritize technical mastery over premature specialization.
              - link "IT & Technical Jobs" [ref=f2586e153] [cursor=pointer]
            - paragraph [ref=f2586e157]: This cohort is exclusively for the Class of 2025. We are seeking “Day Zero” talent—ambitious individuals who have spent their university years building, experimenting, and learning, but have not yet held a full-time professional role. If you have a passion for first-principles thinking and are ready to launch your career from a clean slate in April 2026, this is for you.
            - insertion [ref=f2586e159]
            - paragraph [ref=f2586e161]:
              - text: We hire for potential, not just a tech stack. Rather than confining you to a specific niche, we focus on General Engineering Aptitude. At this stage, we believe specialization is premature; we don’t hire “Front-end” or “Back-end” Associates—we hire Engineers.
              - link "Civil Engineering" [ref=f2586e162] [cursor=pointer]
            - paragraph [ref=f2586e166]: You will be evaluated on your ability to navigate complex logic and your “coachability” signal—ensuring you build a robust, language-agnostic foundation for a long-term career in engineering. We aren’t looking for specialists yet; we are looking for the next generation of builders with a hunger for foundational excellence.
            - insertion [ref=f2586e168]
            - heading "You Will:" [level=3] [ref=f2586e170]
            - list [ref=f2586e171]:
              - listitem [ref=f2586e172]:
                - strong [ref=f2586e173]: "Learn & Contribute:"
                - text: Participate in the full development life cycle, moving from guided tasks to owning feature components.
              - listitem [ref=f2586e174]:
                - strong [ref=f2586e175]: "Build Foundations:"
                - text: Work across the stack (Full Stack/Back-End focus) to understand how scalable systems are built from the ground up.
              - listitem [ref=f2586e176]:
                - strong [ref=f2586e177]: "Collaborate:"
                - text: Engage in technical discussions and “whiteboard” sessions to break down problems into manageable code.
              - listitem [ref=f2586e178]:
                - strong [ref=f2586e179]: "Master AI-Augmentation:"
                - text: Use AI tools not just to write code, but to troubleshoot, optimize, and accelerate your learning curve.
              - listitem [ref=f2586e180]:
                - strong [ref=f2586e181]: "Quality First:"
                - text: Learn to identify edge cases, write robust tests, and debug issues within a microservices architecture.
            - heading "You Have:" [level=3] [ref=f2586e182]
            - list [ref=f2586e183]:
              - listitem [ref=f2586e184]:
                - strong [ref=f2586e185]: "Strong CS Core:"
                - text: Deep understanding of Data Structures, Algorithms, and Object-Oriented design.
              - listitem [ref=f2586e186]:
                - strong [ref=f2586e187]: "Logical Clarity:"
                - text: Ability to translate a complex problem into a clean, brute-force solution and then optimize it.
              - listitem [ref=f2586e188]:
                - strong [ref=f2586e189]: "Language Agnostic:"
                - text: Proficiency in at least one C-style language (Java, Go, C++, etc.) or Node.js.
              - listitem [ref=f2586e190]:
                - strong [ref=f2586e191]: "Growth Mindset:"
                - text: A high “coachability” signal—you take hints, iterate on feedback, and aren’t afraid to say “I don’t know yet.”
              - listitem [ref=f2586e192]:
                - strong [ref=f2586e193]: "Education:"
                - text: BTech/BE – Comp Science
            - heading "Why Join Smartsheet’s HPEL Program?" [level=2] [ref=f2586e194]
            - list [ref=f2586e195]:
              - listitem [ref=f2586e196]:
                - strong [ref=f2586e197]: "Foundational Excellence:"
                - text: Build a strong, language-agnostic engineering base.
              - listitem [ref=f2586e198]:
                - strong [ref=f2586e199]: "Innovation:"
                - text: Work with cutting-edge technologies, including AI augmentation.
              - listitem [ref=f2586e200]:
                - strong [ref=f2586e201]: "Growth Environment:"
                - text: A culture that values learning, mentorship, and
                - link "career" [ref=f2586e202] [cursor=pointer]:
                  - /url: "#"
                - text: development.
              - listitem [ref=f2586e205]:
                - strong [ref=f2586e206]: "Impact:"
                - text: Contribute to a product used by millions globally.
              - listitem [ref=f2586e207]:
                - strong [ref=f2586e208]: "Remote Work:"
                - text: Enjoy the flexibility and convenience of working from anywhere in India.
              - listitem [ref=f2586e209]:
                - strong [ref=f2586e210]: "Dynamic Team:"
                - text: Collaborate with bright minds in a supportive and engaging environment.
