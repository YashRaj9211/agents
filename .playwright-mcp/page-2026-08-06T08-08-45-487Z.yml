            - paragraph [ref=f1391e122]:
              - strong [ref=f1391e123]: "Qualification :"
              - text: BE, B.Tech, BS, MCA, MS, MTech or any related
              - link "Jobs" [ref=f1391e124] [cursor=pointer]
            - paragraph [ref=f1391e128]:
              - strong [ref=f1391e129]: "Batch :"
              - text: 2026/2025/2024 or Any
            - heading [level=3] [ref=f1391e130]:
              - text: "Job Description :"
              - strong [ref=f1391e131]
            - paragraph [ref=f1391e132]: As a Software Engineer I on the Martech Intelligence Pod, you’ll be starting your engineering career working on real customer-facing applications across both frontend and backend, learning the foundations of professional software development in a supportive environment. You’ll also have the opportunity to explore and learn about AI tools and AI-centric solutions that are becoming central to how we build products.
            - insertion [ref=f1391e134]
            - paragraph [ref=f1391e136]:
              - text: We’re optimizing for learning potential, solid fundamentals, and genuine engagement with engineering. You don’t need years of experience — you need to be curious, humble about what you don’t know, and eager to grow.
              - link "Engineering & Technology" [ref=f1391e137] [cursor=pointer]
            - list [ref=f1391e141]:
              - listitem [ref=f1391e142]: You have a Bachelor’s degree in Computer Science, Engineering, or a related field, or equivalent bootcamp/self-taught experience with a portfolio demonstrating competency
              - listitem [ref=f1391e143]: You are proficient in English, both written and verbal, sufficient for success in a remote and largely asynchronous work environment
              - listitem [ref=f1391e144]: You have 0-2 years of professional software engineering experience, or are a recent graduate with solid foundational knowledge
              - listitem [ref=f1391e145]: You have hands-on experience writing code in C# or Java (through academic projects, bootcamp, or personal projects) and understand the basics of how programs work
              - listitem [ref=f1391e146]: You have some experience with React and TypeScript or are eager to learn them quickly — through academic projects, bootcamp, tutorials, or personal projects; you understand the basics of components and JSX
              - listitem [ref=f1391e147]: You know the basics of HTML, CSS, and JavaScript — you understand how the browser works and can build simple web pages and interactive elements
              - listitem [ref=f1391e148]: "You understand the fundamentals of object-oriented programming: classes, objects, inheritance, and interfaces"
              - listitem [ref=f1391e149]: "You can debug code in multiple environments: backend (logs, IDE debugger) and frontend (browser developer tools, console logs)"
              - listitem [ref=f1391e150]: You’ve written code that other people have read and reviewed — you’re comfortable receiving feedback and iterating
              - listitem [ref=f1391e151]: You know the basics of relational databases and can write simple SQL queries (SELECT, INSERT, UPDATE); you’re learning to think about data
              - listitem [ref=f1391e152]: You’ve worked with Git and understand the basics of version control, branching, and merging
              - listitem [ref=f1391e153]: "You can debug code systematically: read error messages, add logging, trace through code, form hypotheses about what’s wrong"
              - listitem [ref=f1391e154]: You’re genuinely curious about how things work and you ask good questions when you don’t understand something
              - listitem [ref=f1391e155]: You’re interested in and curious about AI tools (LLMs, generative AI, agents) — you’ve probably experimented with ChatGPT, Claude, or similar tools and think about how they could be useful
              - listitem [ref=f1391e156]: You’re open to exploring AI-centric solutions to problems and willing to experiment with new approaches that leverage AI capabilities
              - listitem [ref=f1391e157]: "You can explain what you’ve learned in writing: you’re comfortable documenting decisions, asking for help in PRs, and sharing what you discovered"
              - listitem [ref=f1391e158]: "You’re reliable and follow through: you finish what you start, communicate when you’re blocked, and ask for help before getting stuck for too long"
              - listitem [ref=f1391e159]: You’re humble about what you don’t know and genuinely want to learn from more experienced engineers
              - listitem [ref=f1391e160]: You make an effort to include others and appreciate feedback as a gift, not a criticism
            - heading [level=4] [ref=f1391e161]:
              - strong [ref=f1391e162]: "How To Apply:"
