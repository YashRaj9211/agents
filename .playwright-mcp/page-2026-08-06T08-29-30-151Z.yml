              - listitem [ref=f2699e130]: Actively contributes to product reliability improvements, valuable service technology, and new operations flows in diverse agile squads
              - listitem [ref=f2699e131]: Opportunities to make a difference on a global or local scale through mentorship and continued learning and experiments.
