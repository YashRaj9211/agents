              - listitem [ref=f2699e127]: Build Deep Learning solutions using AI/ML Platforms for real time transactions at a scale of 100K+ TPS and for peta bytes of Data.
              - listitem [ref=f2699e128]: Design code and systems that touch 40% of the world population while influencing Visa’s internal standards for scalability, security, and reusability
