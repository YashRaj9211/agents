            - paragraph [ref=f1242e109]:
              - strong [ref=f1242e110]: Key Responsibilities
            - list [ref=f1242e111]:
              - listitem [ref=f1242e112]: Perform technical triage on reported issues, approaching each with healthy skepticism and confirming how the system actually behaves through reproduction, code analysis, and evidence
              - listitem [ref=f1242e113]: Learn the EHR application endtoend from the front end, understanding user workflows and how those actions translate into system behavior
              - listitem [ref=f1242e114]: Read and trace existing code paths to understand system interactions and identify likely failure points (ASP.NET, SQL Server, Classic ASP, with exposure to additional technologies)
              - listitem [ref=f1242e115]: Reproduce issues in lower or productionlike environments using workflows, test data, configuration, logs, and screenshots
              - listitem [ref=f1242e116]: Assess reported issues to determine whether they are investigable, identifying missing information early and driving clear next steps
              - listitem [ref=f1242e117]: Produce clear, structured investigation notes (reproduction steps, expected vs. actual behavior, scope/impact, supporting evidence) to enable effective handoff to other teams
            - paragraph [ref=f1242e118]:
              - strong [ref=f1242e119]: Knowledge & Application
            - list [ref=f1242e120]:
              - listitem [ref=f1242e121]: Ability to read and understand web application code and database logic for analysis and debugging
              - listitem [ref=f1242e122]: Willingness to deeply learn a large, mature codebase and application surface area
              - listitem [ref=f1242e123]: Familiarity with relational data concepts and SQL
              - listitem [ref=f1242e124]: Comfort in reasoning about how frontend actions affect backend state
              - listitem [ref=f1242e125]: Proficient using AI-powered development assistants (e.g., GitHub Copilot, Microsoft Copilot) to accelerate coding tasks, troubleshooting, and documentation.
            - paragraph [ref=f1242e126]:
              - strong [ref=f1242e127]: Complexity & Problem Solving
            - list [ref=f1242e128]:
              - listitem [ref=f1242e129]: Comfortable working through ambiguity and incomplete information
              - listitem [ref=f1242e130]: Enjoys validating behavior, forming evidencebased conclusions, and knowing when investigation should pause pending more information
            - separator [ref=f1242e131]
            - paragraph [ref=f1242e132]:
              - strong [ref=f1242e133]: Collaboration & Interaction
            - list [ref=f1242e134]:
              - listitem [ref=f1242e135]: Works collaboratively within a crossfunctional team and communicates technical findings clearly in writing and discussion
            - separator [ref=f1242e136]
