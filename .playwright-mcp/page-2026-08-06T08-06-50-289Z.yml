              - listitem [ref=f1242e140]: 0–1 years of experience in software engineering, QA/automation, production support engineering, or technical investigation roles.
              - listitem [ref=f1242e141]: Strong curiosity, attention to detail, and interest in debugging realworld system behavior
              - listitem [ref=f1242e142]: Ability to communicate investigation results clearly and unambiguously in English, both in writing and discussion
              - listitem [ref=f1242e143]: Ability to apply AI tools to support daily engineering activities, such as generating test cases, refactoring code, researching technical solutions, and improving productivity.
