              - text: craftsmanship principles and meet the acceptance criteria.• Complete the assigned learning path and contribute to daily meetings.• Deliver on all aspects of Software Development Lifecyle (SDLC) in-line with Agile and IT craftsmanship principles.• Take part in team ceremonies be it agile practices or chapter meetings.• Deliver high-quality clean code and design that can be re-used.• Actively, work with other Development teams to define and implement API’s and rules for data access.• Perform bug-free release validations and produce test and defect reports.• Contribute to developing scripts, configuring quality and automating framework usage.• Run and maintain test suites with the guidance of seniors.• Support existing data models, data dictionary, data pipeline standards, storage of source, process and consumer metadata.
