            - heading "Job Description:" [level=3] [ref=f2971e108]
            - paragraph [ref=f2971e109]:
              - text: Works in the area of Software Engineering, which encompasses the development, maintenance and optimization of
              - link "software" [ref=f2971e110] [cursor=pointer]:
                - /url: "#"
              - text: solutions/applications.1. Applies
              - link "scientific" [ref=f2971e113] [cursor=pointer]:
                - /url: "#"
              - text: methods to analyse and solve software engineering problems.2. He/she is responsible for the development and application of software engineering practice and knowledge, in research, design, development and maintenance.3. His/her work requires the exercise of original thought and judgement and the ability to supervise the technical and administrative work of other software engineers.4. The software engineer builds skills and expertise of his/her software engineering discipline to reach standard software engineer skills expectations for the applicable role, as defined in Professional Communities.5. The software engineer collaborates and acts as team player with other software engineers and stakeholders.
              - link "Civil Engineering" [ref=f2971e116] [cursor=pointer]
            - heading "Job Description – Grade Specific" [level=3] [ref=f2971e120]
            - list [ref=f2971e121]:
              - listitem [ref=f2971e122]: Is the entry level in Software Engineering with a foundational understanding on programming concepts, software design and software development principles.
              - listitem [ref=f2971e123]: Consistently works to direction with reducing supervision, producing accurate and reliable results.
              - listitem [ref=f2971e124]: They are expected to be eager to learn and know when to ask questions and check for understanding.
              - listitem [ref=f2971e125]: Understands and follows work processes. Is aware of costs related to own work.
              - listitem [ref=f2971e126]: Organises own time to deliver against tasks set by others with a short term horizon.
              - listitem [ref=f2971e127]: Works co-operatively with others to achieve team goals and has a direct and positive impact on project performance.
              - listitem [ref=f2971e128]: Actively seeking feedback to improve and starting to manage own career with support.
