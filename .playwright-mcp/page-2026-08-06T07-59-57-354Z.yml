            - list [ref=f846e139]:
              - listitem [ref=f846e140]: Develop and maintain highly reliable, scalable, and maintainable enterprise applications that can match Apple volumes
              - listitem [ref=f846e141]: Understand requirements, engage with team members, multi-functional teams and project managers to define solutions, and estimate the scope of work required
              - listitem [ref=f846e142]: Deliver solutions that can keep up with a rapidly evolving product in a timely fashion
            - list [ref=f846e143]:
              - listitem [ref=f846e144]
