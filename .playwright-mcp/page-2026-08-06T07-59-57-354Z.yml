            - heading "Job Description:" [level=2] [ref=f846e120]
            - paragraph [ref=f846e121]:
              - text: Apple’s IS&T team is looking for highly motivated and dedicated engineers to build the next generation of software services that power several critically important applications. We are looking for extraordinary individuals with strong communication and interpersonal skills and ability to work effectively across multiple business and technical teams. As a part of this dynamic team, you will build pioneering software service, one that is continually innovating & is proud of making a difference and help us build the Apple experience on a global scale. You should be a self starter, motivated, with exceptional interpersonal skills as well as a positive and flexible approach to problems. Your ability to thrive in a fast-paced environment is what we are looking for.
              - link "Civil Engineering" [ref=f846e122] [cursor=pointer]
