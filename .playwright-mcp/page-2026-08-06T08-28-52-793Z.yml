            - paragraph [ref=f2651e106]:
              - text: As an Early Career Technologist, you will contribute to the development and support of
              - link "software" [ref=f2651e107] [cursor=pointer]:
                - /url: "#"
              - text: applications and platforms that help people build a more confident future. This is an ideal opportunity for new college graduates and early-career technologists passionate about building scalable, secure, and intelligent solutions. You’ll work in a collaborative, agile environment and gain exposure to modern software engineering practices and AI-enabling technologies.
              - link "Geographic Reference" [ref=f2651e110] [cursor=pointer]
            - paragraph [ref=f2651e114]: ________________________________________
            - paragraph [ref=f2651e115]: How You’ll Help Us Build a Confident Future (Key Responsibilities)
            - paragraph [ref=f2651e116]: • Assist in gathering and refining product requirements and user stories.
            - generic:
              - insertion:
                - generic:
                  - iframe
            - paragraph [ref=f2651e117]:
              - text: • Support the design, development, testing, and deployment of full stack software applications (UI, API,
              - link "Data" [ref=f2651e118] [cursor=pointer]:
                - /url: "#"
              - text: ) while leveraging AI tools.
              - link "Software" [ref=f2651e121] [cursor=pointer]
            - paragraph [ref=f2651e125]: • Participate in peer reviews of code, solution designs, and configurations.
            - paragraph [ref=f2651e126]: • Help investigate and resolve production incidents and service requests.
            - paragraph [ref=f2651e127]: • Collaborate with cross-functional teams to identify innovative solutions.
            - paragraph [ref=f2651e128]: • Contribute to the integration of AI capabilities into applications (e.g., GenAI APIs, ML models).
            - paragraph [ref=f2651e129]: ________________________________________
            - paragraph [ref=f2651e130]: What You Will Need to Succeed (Required Qualifications)
            - paragraph [ref=f2651e131]:
              - text: • A Bachelor’s degree in Computer Science, Information Systems, Engineering, or a closely related discipline is required.
              - link "Civil Engineering" [ref=f2651e132] [cursor=pointer]
            - insertion [ref=f2651e137]
            - paragraph [ref=f2651e139]:
              - text: • Internship or academic project experience in software development or AI/ML.
              - link "Dictionaries & Encyclopedias" [ref=f2651e140] [cursor=pointer]
            - paragraph [ref=f2651e144]: • Demonstrated ability to quickly learn and apply new skills to deliver high quality software as evidenced by academic or project experience.
            - paragraph [ref=f2651e145]: • Proficiency in at least one programming language (e.g., Java, Python, C#, JavaScript/TypeScript, COBOL, etc.).
            - insertion [ref=f2651e147]
            - paragraph [ref=f2651e149]:
              - text: • Basic understanding of software design principles and coding best practices
              - link "Computer Science" [ref=f2651e150] [cursor=pointer]
            - paragraph [ref=f2651e154]: • Familiarity with Database concepts, design, and development
            - paragraph [ref=f2651e155]: • Familiarity with cloud-native technologies (e.g., Azure, AWS, GCP).
            - paragraph [ref=f2651e156]: • Basic knowledge of secure coding practices and automated testing.
            - paragraph [ref=f2651e157]: • Strong communication, collaboration, and problem-solving skills.
