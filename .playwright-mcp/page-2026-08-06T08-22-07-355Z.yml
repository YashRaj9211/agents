            - paragraph [ref=f2131e111]:
              - strong [ref=f2131e112]: "Education:"
              - text: BE/ B.Tech/BSC/BCA/M.Tech/MCA – CSE/IT/EEE/ECE Or Other Tech Related
              - link "Corporate Training" [ref=f2131e113] [cursor=pointer]
            - heading [level=2] [ref=f2131e117]:
              - strong [ref=f2131e118]: "Job Description:"
            - paragraph [ref=f2131e119]: You will report to the Manager- Software Engineering, Application Delivery and have a hybrid schedule working in Pune, India.
            - paragraph [ref=f2131e120]:
              - strong [ref=f2131e121]: "Your Responsibilities:"
            - list [ref=f2131e122]:
              - listitem [ref=f2131e123]: Analyse, design software programmes for software enhancements and new products.
              - listitem [ref=f2131e124]: Use current programming language (MS stack) and technologies, writing code, completing programming, and performing testing and debugging of applications.
              - listitem [ref=f2131e125]: Follow the process of Agile and using all the tools that are used during the development cycle.
              - listitem [ref=f2131e126]: Complete documentation and procedures for installation and maintenance.
              - listitem [ref=f2131e127]: May work with users to define system requirements or necessary modifications.
              - listitem [ref=f2131e128]: Personal and delivery; ability to establish and meet milestones and deadlines with our requirements and the process of translating them into well-engineered and integrated technical solutions
            - paragraph [ref=f2131e129]:
              - strong [ref=f2131e130]: "The Essentials – You Will Have:"
              - link "Geographic Reference" [ref=f2131e131] [cursor=pointer]
            - list [ref=f2131e135]:
              - listitem [ref=f2131e136]: Degree in Computer Science and IT or related
              - listitem [ref=f2131e137]: CGPA for 7.0 and above
              - listitem [ref=f2131e138]: Fresher passed out in 2025-2026 with 0-1 year of experience
              - listitem [ref=f2131e139]: We will prefer students who have completed the CDAC course.
              - listitem [ref=f2131e140]: Hands-on experience with SQL such as Microsoft SQL Server, Oracle, or other relational database software
              - listitem [ref=f2131e141]: Hands-on experience with Object-oriented programming such as C#
              - listitem [ref=f2131e142]:
                - text: 0-1 year of experience in the following web frameworks such as
                - link "ASP.NET" [ref=f2131e143] [cursor=pointer]:
                  - /url: https://asp.net/
                - text: ", ASP, node.js"
              - listitem [ref=f2131e144]: Database design/data modelling experience and performance tuning
              - listitem [ref=f2131e145]: Experience in web development including HTML, CSS, JavaScript
              - listitem [ref=f2131e146]: Experience with version control systems such as Git, Subversion
              - listitem [ref=f2131e147]: Solve business problems, thoughtful in learning new things and having good work attitude and ethics
              - listitem [ref=f2131e148]: Commit to meeting customer service metrics, Service level agreements
              - listitem [ref=f2131e149]: Collaborate with partner teams, peers, and managers
              - listitem [ref=f2131e150]: Status reporting within their teams
              - listitem [ref=f2131e151]: Effective in both individual and team-based work settings
              - listitem [ref=f2131e152]: Work with diverse and cross-cultural teams
              - listitem [ref=f2131e153]: Stay informed about relevant technology trends and developments
              - listitem [ref=f2131e154]: We authorise only applicants who are authorised to work in India to apply for job openings based in India.
            - paragraph [ref=f2131e155]:
              - strong [ref=f2131e156]: "The Preferred – You Might Also Have:"
              - link "Engineering & Technology" [ref=f2131e157] [cursor=pointer]
            - list [ref=f2131e161]:
              - listitem [ref=f2131e162]: Experience with Azure DevOps
              - listitem [ref=f2131e163]: Usage of tools like Jira, Confluence
              - listitem [ref=f2131e164]: Usage of any AI tools like Git hub, Copilot.
              - listitem [ref=f2131e165]: Familiarity with Rockwell Automation platforms.
              - listitem [ref=f2131e166]: Knowledge of industrial automation, control systems or engineering fundamentals.
              - listitem [ref=f2131e167]: Hands-on project or internship experience in automation, robotics, or industrial systems.
              - listitem [ref=f2131e168]: Exposure in deploying code in AWS, Azure, or Google Cloud environments.
            - heading "How to Apply :" [level=2] [ref=f2131e169]
            - paragraph [ref=f2131e170]: The interested and eligible can register on the following Rockwell Automation application link.
