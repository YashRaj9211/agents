            - heading [level=3] [ref=f1147e146]:
              - strong [ref=f1147e147]: How to Apply for Wipro ELite Off Campus Registration?
            - list [ref=f1147e148]:
              - listitem [ref=f1147e149]: "Step 1: Registration – Register for Wipro’s elite by filling up a simple form."
              - listitem [ref=f1147e150]: "Step 2: Online Assessment – Eligible candidates will be invited to take an 80-minute online assessment that will test your verbal, analytical, quantitative and written communication skills followed by coding."
              - listitem [ref=f1147e151]: "Step 3: Business Discussion – If you get through the online assessment, you will be called for a business discussion round with our team."
              - listitem [ref=f1147e152]: "Step 4: Offer Letter – Congratulations — if you’re at this stage, you’ve made it! Simply wait for our recruitment team to send you the Letter Of Intent and the final offer letter. Accept it, and join the Wipro team!"
