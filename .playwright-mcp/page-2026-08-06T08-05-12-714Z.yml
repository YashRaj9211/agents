            - heading "Job Description" [level=3] [ref=f1147e105]
            - paragraph [ref=f1147e106]: The purpose of this role is to design, test and maintain software programs for operating systems or applications which needs to be deployed at a client end and ensure its meet 100% quality assurance parameters
            - heading "͏" [level=2] [ref=f1147e107]
            - paragraph [ref=f1147e108]:
              - strong [ref=f1147e109]: Do
            - insertion [ref=f1147e111]
            - paragraph [ref=f1147e113]: 1. Instrumental in understanding the requirements and design of the product/ software
            - list [ref=f1147e114]:
              - listitem [ref=f1147e115]: Develop software solutions by studying information needs, studying systems flow, data usage and work processes
              - listitem [ref=f1147e116]: Investigating problem areas followed by the software development life cycle
              - listitem [ref=f1147e117]: Facilitate root cause analysis of the system issues and problem statement
              - listitem [ref=f1147e118]: Identify ideas to improve system performance and impact availability
              - listitem [ref=f1147e119]: Analyze client requirements and convert requirements to feasible design
              - listitem [ref=f1147e120]: Collaborate with functional teams or systems analysts who carry out the detailed investigation into software requirements
              - listitem [ref=f1147e121]: Conferring with project managers to obtain information on software capabilities
            - heading "͏" [level=2] [ref=f1147e122]
            - paragraph [ref=f1147e123]: 2. Perform coding and ensure optimal software/ module development
            - list [ref=f1147e124]:
              - listitem [ref=f1147e125]: Determine operational feasibility by evaluating analysis, problem definition, requirements, software development and proposed software
              - listitem [ref=f1147e126]: Develop and automate processes for software validation by setting up and designing test cases/scenarios/usage cases, and executing these cases
              - listitem [ref=f1147e127]: Modifying software to fix errors, adapt it to new hardware, improve its performance, or upgrade interfaces.
              - listitem [ref=f1147e128]: Analyzing information to recommend and plan the installation of new systems or modifications of an existing system
              - listitem [ref=f1147e129]: Ensuring that code is error free or has no bugs and test failure
              - listitem [ref=f1147e130]: Preparing reports on programming project specifications, activities and status
              - listitem [ref=f1147e131]: Ensure all the codes are raised as per the norm defined for project / program / account with clear description and replication patterns
              - listitem [ref=f1147e132]: Compile timely, comprehensive and accurate documentation and reports as requested
              - listitem [ref=f1147e133]: Coordinating with the team on daily project status and progress and documenting it
              - listitem [ref=f1147e134]: Providing feedback on usability and serviceability, trace the result to quality risk and report it to concerned stakeholders
            - heading "͏" [level=2] [ref=f1147e135]
            - paragraph [ref=f1147e136]: 3. Status Reporting and Customer Focus on an ongoing basis with respect to project and its execution
            - list [ref=f1147e137]:
              - listitem [ref=f1147e138]: Capturing all the requirements and clarifications from the client for better quality work
              - listitem [ref=f1147e139]: Taking feedback on the regular basis to ensure smooth and on time delivery
              - listitem [ref=f1147e140]: Participating in continuing education and training to remain current on best practices, learn new programming languages, and better assist other team members.
              - listitem [ref=f1147e141]: Consulting with engineering staff to evaluate software-hardware interfaces and develop specifications and performance requirements
              - listitem [ref=f1147e142]: Document and demonstrate solutions by developing documentation, flowcharts, layouts, diagrams, charts, code comments and clear code
              - listitem [ref=f1147e143]: Documenting very necessary details and reports in a formal way for proper understanding of software from client proposal to implementation
              - listitem [ref=f1147e144]: Ensure good quality of interaction with customer w.r.t. e-mail content, fault report tracking, voice calls, business etiquette etc
              - listitem [ref=f1147e145]: Timely Response to customer requests and no instances of complaints either internally or externally
