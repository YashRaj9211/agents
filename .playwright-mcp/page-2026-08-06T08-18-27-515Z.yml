            - paragraph [ref=f1903e101]: Ontic is hiring an Associate Software Engineer (Frontend) to contribute to the development of user interfaces for our SaaS platform. This role is designed for early-career engineers who are building strong foundations in frontend development and software engineering practices.
            - paragraph [ref=f1903e102]: You will work closely with experienced engineers to build UI features, fix issues, and improve existing experiences, while learning how to create scalable, performant, and user-friendly web applications. Your focus will be on writing high-quality code, understanding frontend fundamentals, and growing into an independent contributor.
            - generic [ref=f1903e105]:
              - generic [ref=f1903e106]:
                - generic [ref=f1903e107]: WhatsApp Channel
                - link "Join Now" [ref=f1903e109] [cursor=pointer]:
                  - /url: https://chat.whatsapp.com/LD7u8YPDaP7JDTDrnpwNNP
              - generic [ref=f1903e110]:
                - generic [ref=f1903e111]: Telegram Channel
                - link "Join Now" [ref=f1903e113] [cursor=pointer]:
                  - /url: https://telegram.me/campusdrivejobs
            - heading [level=1] [ref=f1903e114]:
              - strong [ref=f1903e115]: Key Responsibilities
            - paragraph [ref=f1903e116]: Development & Implementation
            - list [ref=f1903e117]:
              - listitem [ref=f1903e118]:
                - text: Contribute to building user interfaces and features using
                - strong [ref=f1903e119]: JavaScript, TypeScript, React, HTML, and CSS
              - listitem [ref=f1903e120]: Implement well-defined UI components and flows with guidance from senior engineers
              - listitem [ref=f1903e121]: Work with APIs to integrate frontend with backend services
            - paragraph [ref=f1903e122]: Code Quality & Best Practices
            - insertion [ref=f1903e124]
            - list [ref=f1903e126]:
              - listitem [ref=f1903e127]: Write clean, maintainable, and reusable code following established engineering standards
              - listitem [ref=f1903e128]: Participate in code reviews and apply feedback to improve code quality
              - listitem [ref=f1903e129]: Follow best practices in component design, state management, and accessibility
            - paragraph [ref=f1903e130]: Learning & Technical Growth
            - list [ref=f1903e131]:
              - listitem [ref=f1903e132]: Build understanding of frontend architecture, component-based design, and application state
              - listitem [ref=f1903e133]: Learn and apply best practices in debugging, testing, and performance optimization
              - listitem [ref=f1903e134]: Gain familiarity with modern frontend tools and build systems
            - heading [level=1] [ref=f1903e135]:
              - strong [ref=f1903e136]: Qualifications and Experiences
            - list [ref=f1903e137]:
              - listitem [ref=f1903e138]: 0–2 years of software engineering experience (including internships, academic, or personal projects)
              - listitem [ref=f1903e139]:
                - text: Foundational knowledge of
                - strong [ref=f1903e140]: JavaScript, HTML, and CSS
              - listitem [ref=f1903e141]:
                - text: Basic understanding of
                - strong [ref=f1903e142]: React (or similar frontend frameworks)
              - listitem [ref=f1903e143]:
                - text: Understanding of
                - strong [ref=f1903e144]: core programming concepts, data structures, and problem-solving
              - listitem [ref=f1903e145]:
                - text: Familiarity with
                - strong [ref=f1903e146]: REST APIs and asynchronous programming (promises, async/await)
              - listitem [ref=f1903e147]:
                - text: Exposure to
                - strong [ref=f1903e148]: version control systems like Git
              - listitem [ref=f1903e149]:
                - text: Awareness of
                - strong [ref=f1903e150]: frontend development lifecycle (build tools, bundling, deployment basics)
              - listitem [ref=f1903e151]: Strong willingness to learn and grow in a fast-paced environment
              - listitem [ref=f1903e152]: Good problem-solving ability and attention to detail
              - listitem [ref=f1903e153]: Effective communication and collaboration skills
              - listitem [ref=f1903e154]: Hands-on experience through academic, personal, or open-source projects
            - heading "Selection Process" [level=2] [ref=f1903e155]
            - insertion [ref=f1903e157]
            - paragraph [ref=f1903e159]: "The Nexla recruitment process is designed to identify the best technical talent. It consists of the following rounds:"
            - list [ref=f1903e160]:
              - listitem [ref=f1903e161]:
                - strong [ref=f1903e162]: "Profile Screening:"
                - text: Review of resumes and technical portfolios.
              - listitem [ref=f1903e163]:
                - strong [ref=f1903e164]: "Online Test:"
                - text: Assessing coding skills and CS fundamentals.
              - listitem [ref=f1903e165]:
                - strong [ref=f1903e166]: "Technical Interview:"
                - text: Deep dive into engineering concepts and problem-solving.
              - listitem [ref=f1903e167]:
                - strong [ref=f1903e168]: "HR Interview:"
                - text: Cultural fit and behavioral assessment.
            - heading "How to Apply" [level=2] [ref=f1903e169]
