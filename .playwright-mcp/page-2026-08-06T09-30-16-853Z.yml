                - heading "Job Description" [level=2] [ref=e92]
              - generic [ref=e94]: "Project Role : Custom Software EngineerProject Role Description : Develop custom software solutions to design, code, and enhance components across systems or applications. Use modern frameworks and agile practices to deliver scalable, high-performing solutions tailored to specific business needs. Must have skills : Python (Programming Language)Good to have skills : NAMinimum 0-2 year(s) of experience is requiredEducational Qualification : 15 years full time educationSummary: As a Custom Software Engineer, a typical day involves creating tailored software solutions by designing, coding, and improving various components within systems or applications. The role requires working closely with team members to ensure that the software meets specific business requirements. The work environment encourages the use of contemporary development frameworks and agile methodologies to build scalable and efficient software. Collaboration and continuous improvement are key aspects, as the engineer contributes to delivering high-quality solutions that align with organizational goals and client expectations. Roles & Responsibilities: - Expected to build knowledge and support the team.- Participate in Problem Solving discussions.- Assist in the documentation and maintenance of software components to ensure clarity and ease of future updates.- Collaborate with cross-functional teams to understand requirements and contribute to solution design.- Engage in code reviews and provide constructive feedback to peers to maintain code quality.- Support testing efforts by identifying and resolving defects in a timely manner. Professional & Technical Skills: - Must To Have Skills: Proficiency in Python (Programming Language).- Strong understanding of object-oriented programming concepts and software design principles.- Familiarity with version control systems to manage codebase effectively.- Experience with debugging and troubleshooting techniques to resolve software issues.- Ability to write clean, maintainable, and efficient code following best practices. Additional Information: - The candidate should have minimum 0-2 years of experience in Python (Programming Language).- This position is based at our Hyderabad office.- A 15 years full time education is required."
