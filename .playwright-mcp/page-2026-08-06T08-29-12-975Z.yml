            - 'heading "About the Role: Junior Software Engineer" [level=2] [ref=f2670e92]'
            - paragraph [ref=f2670e93]:
              - text: As a Junior Software Engineer at Zensar, you will be an integral part of our dynamic development teams. This role is perfect for individuals with a foundational understanding of web technologies and a passion for problem-solving. You will contribute to various stages of the software development lifecycle, working on exciting projects that leverage cutting-edge technologies.
              - link "Recruitment & Staffing" [ref=f2670e94] [cursor=pointer]
            - heading "Key Responsibilities:" [level=3] [ref=f2670e98]
            - list [ref=f2670e99]:
              - listitem [ref=f2670e100]: Understand and analyze project requirements, collaborating with senior engineers and stakeholders.
              - listitem [ref=f2670e101]: Develop robust and scalable applications primarily using HTML, CSS, and JavaScript.
              - listitem [ref=f2670e102]: Participate in unit testing, integration testing, and support various testing phases to ensure high-quality software delivery.
              - listitem [ref=f2670e103]: Assist in creating and maintaining technical documentation for developed applications and processes.
              - listitem [ref=f2670e104]: Coordinate with cross-functional teams to ensure smooth project execution and timely delivery.
              - listitem [ref=f2670e105]: Actively contribute to a culture of continuous improvement and learning.
            - heading "Skills & Qualifications:" [level=3] [ref=f2670e106]
