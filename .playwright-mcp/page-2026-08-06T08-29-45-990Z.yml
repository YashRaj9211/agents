            - list [ref=f2717e131]:
              - listitem [ref=f2717e132]: Strong understanding of Object-Oriented design principles and software engineering fundamentals.
              - listitem [ref=f2717e133]: Working knowledge of relational databases and data-driven application development.
              - listitem [ref=f2717e134]: Proficiency in Python or other modern programming languages; Python strongly preferred.
              - listitem [ref=f2717e135]: Familiarity with cloud platforms such as AWS is a plus.
              - listitem [ref=f2717e136]: Exposure to modern data engineering tools such as dbt, Airflow, and Jinja is advantageous.
              - listitem [ref=f2717e137]: Strong analytical, quantitative, and debugging skills with persistence in problem-solving.
              - listitem [ref=f2717e138]: Ability and willingness to learn new technologies through self-directed learning.
              - listitem [ref=f2717e139]: Excellent verbal and written communication skills, with the ability to explain complex concepts to both technical and non-technical audiences.
              - listitem [ref=f2717e140]: Strong organizational skills, initiative, and a positive, growth-oriented mindset.
              - listitem [ref=f2717e141]: Proven ability to collaborate effectively with global, cross-functional, and virtual teams.
            - paragraph [ref=f2717e142]: Education
            - list [ref=f2717e143]:
              - listitem [ref=f2717e144]: Bachelor’s degree in Computer Science, Engineering, or a related technical field.
              - listitem [ref=f2717e145]: Academic or project-based experience in software development is preferred.
              - listitem [ref=f2717e146]: Participation in at least one hands-on project (academic or professional) is a plus.
            - paragraph [ref=f2717e147]:
              - strong [ref=f2717e148]: Responsibilities
            - insertion [ref=f2717e150]
            - list [ref=f2717e152]:
              - listitem [ref=f2717e153]: Design, develop, and support software solutions for financial data management and risk analytics platforms.
              - listitem [ref=f2717e154]: Contribute to the development of analytical, data, and software products supporting Fixed Income and Commercial Real Estate solutions.
              - listitem [ref=f2717e155]: Apply object-oriented design principles to build scalable and maintainable systems.
              - listitem [ref=f2717e156]: Work with relational databases to support data storage, retrieval, and processing needs.
              - listitem [ref=f2717e157]: Collaborate closely with team members to enhance existing products and develop new capabilities.
              - listitem [ref=f2717e158]: Debug, troubleshoot, and resolve technical issues across applications and data workflows.
              - listitem [ref=f2717e159]: Learn and adopt new technologies, frameworks, and tools to continuously improve product offerings.
              - listitem [ref=f2717e160]: Participate actively in team discussions, code reviews, and agile development practices.
