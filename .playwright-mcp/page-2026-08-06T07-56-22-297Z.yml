            - list [ref=f398e116]:
              - listitem [ref=f398e117]: Requires working knowledge and experience within own function/specialty area
              - listitem [ref=f398e118]: Builds professional expertise, including knowledge of the domain, processes, customers etc.
              - listitem [ref=f398e119]: Solves variety of problems of moderate scope and within own area
