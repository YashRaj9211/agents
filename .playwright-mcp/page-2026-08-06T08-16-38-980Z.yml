            - heading [level=2] [ref=f1808e116]:
              - strong [ref=f1808e117]: "Job Description :"
            - paragraph
            - paragraph [ref=f1808e118]: "As a Software Engineer, you will be responsible for:"
            - list [ref=f1808e119]:
              - listitem [ref=f1808e120]: Designing and developing software that is optimal, scalable, complete, and robust that powers some of the biggest online events like IPL
              - listitem [ref=f1808e121]: Working with programming languages including C/C++ alongside Python or Perl to develop and maintain software solutions effectively.
              - listitem [ref=f1808e122]: Investigating and analyzing the root causes of technical issues or performance bottlenecks to identify effective solutions.
              - listitem [ref=f1808e123]: Developing and implementing strategies to assess potential initiatives related to performance optimization and COGS.
              - listitem [ref=f1808e124]: Benchmarking diverse server metrics across releases and hardware to ensure exceptional quality and optimal performance.
              - listitem [ref=f1808e125]: Maintain/enhance/develop tools and automation frameworks.
            - paragraph [ref=f1808e126]:
              - strong [ref=f1808e127]: Do what you love
              - link "Engineering & Technology" [ref=f1808e128] [cursor=pointer]
            - insertion [ref=f1808e133]
            - paragraph [ref=f1808e135]: "To be successful in this role you will:"
            - list [ref=f1808e136]:
              - listitem [ref=f1808e137]: Have 0-2 years of relevant experience and a Bachelor’s or Master’s degree in Computer Science
              - listitem [ref=f1808e138]: Have understanding of Automation Frameworks, Data Structures, Computer Networks, Operating System concepts
              - listitem [ref=f1808e139]: Have proficiency in at least one programming language (C, C++) and any scripting language (Python, Perl, Shell, etc.)
              - listitem [ref=f1808e140]: Have exposure to working in Unix/Linux
              - listitem [ref=f1808e141]: Have exposure or interest in internet technologies such as TCP/IP, HTTP, DNS, etc.
              - listitem [ref=f1808e142]: Be passionate about solving large-scale distributed systems problems, pay meticulous attention to detail, and possess debugging/troubleshooting skills
