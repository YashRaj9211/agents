            - list [ref=f1202e157]:
              - listitem [ref=f1202e158]: Build and enhance responsive, accessible, and performant web experiences using modern front-end technologies, design systems, and browser capabilities
            - list [ref=f1202e159]:
              - listitem [ref=f1202e160]: Build and integrate cloud-native platforms, applications, APIs, and services using an API-first engineering approach
            - list [ref=f1202e161]:
              - listitem [ref=f1202e162]: Develop sofware by participating in Agile sprint ceremonies and working on software tasks assigned to you
            - list [ref=f1202e163]:
