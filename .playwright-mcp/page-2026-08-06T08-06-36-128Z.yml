            - heading "Job Description :" [level=2] [ref=f1202e120]
            - paragraph [ref=f1202e121]: We’re looking for a Software Engineer to solve problems supporting Nike’s pursuit of delivering state of the art tools to our product designers and broader creation community. The candidate needs to be highly collaborative with peers, productive in a fast-paced development environment.
