            - list [ref=f1202e165]:
              - listitem [ref=f1202e166]: Support the full software development lifecycle, including development, testing, deployment, monitoring, and operational excellence
            - list [ref=f1202e167]:
              - listitem [ref=f1202e168]: Improve usability, performance, scalability, resilience, and maintainability across user-facing applications and backend services
