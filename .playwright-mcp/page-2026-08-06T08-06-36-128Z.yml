              - listitem [ref=f1202e126]: 0–2 years of software development experience
            - list [ref=f1202e127]:
              - listitem [ref=f1202e128]: Experience with React or Vue.js
            - list [ref=f1202e129]:
              - listitem [ref=f1202e130]: Experience with cloud architecture, DevOps, infrastructure as code, CI/CD, and related tools
            - list [ref=f1202e131]:
