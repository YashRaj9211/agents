            - heading [level=2] [ref=f3055e114]:
              - strong [ref=f3055e115]: "Job Description:"
            - paragraph [ref=f3055e116]:
              - text: We are looking for highly motivated individuals who can join our engineering team as aSDEs. As an Android aSDE at Swiggy, you will play a crucial role in developing and enhancing our Android mobile application, which millions of users rely on to order food, order groceries, dine in and enjoy a seamless delivery experience. This opportunity offers you a chance to work closely with our talented team of Android developers and gain valuable hands-on experience in the fast-paced world of app development.
              - link "Software" [ref=f3055e117] [cursor=pointer]
            - paragraph [ref=f3055e121]:
              - strong [ref=f3055e122]: What will you get to do here?
            - list [ref=f3055e123]:
              - listitem [ref=f3055e124]: Develop and maintain high-quality Android applications using Kotlin and other relevant technologies.
              - listitem [ref=f3055e125]: Collaborate with the Android development team to understand the app’s architecture, codebase, and functionality.
              - listitem [ref=f3055e126]: Assist in designing, implementing, and testing new features and improvements to the Swiggy Android app.
              - listitem [ref=f3055e127]: Work closely with backend developers to integrate APIs and deliver seamless data exchange between the app and server.
              - listitem [ref=f3055e128]: Participate in code reviews to maintain code quality and adherence to best practices.
              - listitem [ref=f3055e129]: Identify and troubleshoot issues, providing innovative solutions to ensure app performance and user satisfaction.
              - listitem [ref=f3055e130]: Stay up-to-date with the latest Android development trends, frameworks, and technologies.
              - listitem [ref=f3055e131]: Work closely with cross-functional teams, including product managers, designers, and backend developers, to ensure seamless integration of new features.
              - listitem [ref=f3055e132]: Actively contribute ideas and suggestions to improve the user experience and app performance.
              - listitem [ref=f3055e133]: Assist in the maintenance and enhancement of existing features and functionalities.
            - paragraph [ref=f3055e134]:
              - strong [ref=f3055e135]: What qualities are we looking for?
              - link "Civil Engineering" [ref=f3055e136] [cursor=pointer]
            - list [ref=f3055e140]:
              - listitem [ref=f3055e141]: Bachelor’s degree in Computer Science, Engineering, or a related field.
              - listitem [ref=f3055e142]: Strong understanding of Kotlin and Android SDK.
              - listitem [ref=f3055e143]: Knowledge of object-oriented programming and design principles.
              - listitem [ref=f3055e144]: Excellent problem-solving and debugging skills.
              - listitem [ref=f3055e145]: Ability to work effectively in a collaborative team environment.
              - listitem [ref=f3055e146]: Strong communication skills.
            - paragraph
