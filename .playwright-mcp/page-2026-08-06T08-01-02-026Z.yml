            - paragraph [ref=f934e113]:
              - strong [ref=f934e114]: Experience
              - text: ": 0-2 Years"
            - heading [level=3] [ref=f934e115]:
              - strong [ref=f934e116]: "Job Description::"
            - paragraph [ref=f934e117]: We are looking for a dynamic and motivated Software Engineer to join our team and contribute to building next-generation cloud-native, API-first, microservices-driven platforms. This role is ideal for someone passionate about full-stack development and eager to learn and grow their skills in a fast-paced Agile environment leading the ‘learn by doing’ principle.
            - paragraph [ref=f934e118]: You will work alongside experienced engineers and systems experts to develop scalable, secure, and intelligent CPQ (Configure, Price, Quote) solutions that support our sales and pre-sales channels. The ideal candidate thrives at the intersection of complex distributed systems, cutting-edge frameworks, and enterprise-grade architectures, bringing both technical depth and creative innovation to deliver world-class digital experiences. In our fast-paced, Agile-first environment, you won’t just build software—you’ll define the future of intelligent platforms.
            - insertion [ref=f934e120]
