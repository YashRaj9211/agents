              - link "Computer Science" [ref=f934e137] [cursor=pointer]
            - list [ref=f934e141]:
              - listitem [ref=f934e142]: Cloud-native technologies with Azure, AWS, GCP
              - listitem [ref=f934e143]: Containerization with Docker and orchestration using Kubernetes
              - listitem [ref=f934e144]: CI/CD pipeline creation and maintenance using Azure DevOps, GitHub Actions
            - paragraph [ref=f934e145]:
