              - listitem [ref=f934e128]: "Front-end: Blazor, React, Angular, Vue.js / Nuxt.js"
              - listitem [ref=f934e129]: Python with FastAPI framework
              - listitem [ref=f934e130]: Microservices architecture, API-first design (REST, gRPC)
            - paragraph [ref=f934e131]:
