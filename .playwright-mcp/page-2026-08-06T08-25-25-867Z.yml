              - strong [ref=f2385e102]: Job Location
              - text: ": Gurgaon"
            - paragraph [ref=f2385e103]:
              - strong [ref=f2385e104]: "Salary:"
              - text: Best in Industry
              - link "Engineering & Technology" [ref=f2385e105] [cursor=pointer]
            - paragraph [ref=f2385e109]:
              - strong [ref=f2385e110]: Experience
              - text: ": Freshers"
            - paragraph [ref=f2385e111]:
              - strong [ref=f2385e112]: "Eligibility Criteria:"
              - text: –
            - list [ref=f2385e113]:
              - listitem [ref=f2385e114]: BE/ B.Tech/ MCA or Any graduate
            - paragraph [ref=f2385e115]:
              - strong [ref=f2385e116]: "Job Description:"
            - paragraph [ref=f2385e117]:
              - text: We are seeking a motivated and enthusiastic Trainee Full Stack Engineer to join our dynamic team. In this role, you will have the opportunity to gain hands-on experience working with advanced software development technologies, tools, and frameworks including React., NET, Databricks and Azure. This position is ideal for individuals eager to expand their technical skills, contribute to innovative projects, and grow as professionals in a collaborative environment.
              - link "Corporate Training" [ref=f2385e118] [cursor=pointer]
            - paragraph [ref=f2385e122]:
              - strong [ref=f2385e123]: "Roles and Responsibilities:"
            - list [ref=f2385e124]:
              - listitem [ref=f2385e125]: Develop a comprehensive understanding of the organization, including its overarching mission, core values, and strategic goals, to ensure alignment in all tasks and responsibilities.
              - listitem [ref=f2385e126]: Exhibit a proactive learning attitude during the various training sessions provided, effectively applying the knowledge gained to the projects and products supported throughout the tenure.
              - listitem [ref=f2385e127]: Learn and understand the technologies, tools, and frameworks used by the development team to contribute effectively to projects.
              - listitem [ref=f2385e128]: Initially, you will work under general guidance, with the opportunity to gradually take on more responsibility and handle tasks independently.
              - listitem [ref=f2385e129]: Work effectively as part of a distributed global team, collaborating with colleagues across different time zones and locations.
            - paragraph [ref=f2385e130]:
              - strong [ref=f2385e131]: Key Requirements
              - text: ":"
            - list [ref=f2385e132]:
              - listitem [ref=f2385e133]: Freshers who wish to pick up career opportunities in IT are eligible to apply.
              - listitem [ref=f2385e134]: Having knowledge of Redux, Databricks, SQL will be an added advantage.
              - listitem [ref=f2385e135]: Must have knowledge of basic frontend technologies including HTML, CSS, OOPS Concepts (Structural language e.g. C#), .NET CORE, JavaScript, React.js and its core principles.
              - listitem [ref=f2385e136]: Strong analytical and problem-solving skills.
              - listitem [ref=f2385e137]: Highly motivated with an eagerness to learn and a sense of ownership and accountability.
            - paragraph [ref=f2385e138]:
              - strong [ref=f2385e139]: Qualification
              - text: ": Any Graduate (B.E, B.Tech, MCA) with less or no experience."
              - link "Software" [ref=f2385e140] [cursor=pointer]
            - paragraph [ref=f2385e144]:
              - strong [ref=f2385e145]: "How To Apply:"
            - paragraph [ref=f2385e146]: Interested and eligible candidates can apply to the posts ASAP.
