            - paragraph [ref=f2621e102]:
              - strong [ref=f2621e103]: Experience
              - text: ": 0-6 Years Hands on experience"
            - paragraph [ref=f2621e104]:
              - strong [ref=f2621e105]: Qualification
              - text: ": BE/B.Tech//BSC/MCA/MS/M.Tech or Any Graduate"
            - paragraph [ref=f2621e106]:
