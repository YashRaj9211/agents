                - strong [ref=f2621e147]: ₹3.6 to ₹8 Lakhs PA
              - listitem [ref=f2621e148]:
                - strong [ref=f2621e149]: 2 to 4 years
                - text: – Software Engineer –
                - strong [ref=f2621e150]: ₹6 to ₹16 Lakhs PA
              - listitem [ref=f2621e151]:
                - strong [ref=f2621e152]: 4 to 6 years
                - text: – Senior Software Engineer –
                - strong [ref=f2621e153]: ₹10 to ₹24 Lakhs PA
            - paragraph [ref=f2621e154]:
              - strong [ref=f2621e155]: "Location:"
