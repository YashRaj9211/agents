            - heading "Job Description :" [level=3] [ref=f2621e110]
            - paragraph [ref=f2621e111]:
              - text: Role Overview We are seeking an experienced Core Java Developer with strong expertise in API development and microservices architecture, along with hands-on experience in building and deploying applications on AWS. The ideal candidate will have a solid background in designing and developing RESTful APIs, implementing scalable microservices, and ensuring high availability and performance in cloud-based environments.
              - link "Engineering & Technology" [ref=f2621e112] [cursor=pointer]
            - paragraph [ref=f2621e116]: Qualifications
            - list [ref=f2621e117]:
              - listitem [ref=f2621e118]:
                - text: Bachelor’s degree in
                - link "Computer Science" [ref=f2621e119] [cursor=pointer]:
                  - /url: "#"
                - text: ", Information Technology,"
                - link "Engineering" [ref=f2621e122] [cursor=pointer]:
                  - /url: "#"
                - text: ", or a related field."
              - listitem [ref=f2621e125]: Strong hands-on experience in Core Java with a solid understanding of object-oriented programming and design principles. Certification preferred
              - listitem [ref=f2621e126]: Proven experience in developing RESTful APIs and microservices-based applications using Java frameworks such as Spring and Spring Boot.
              - listitem [ref=f2621e127]: Practical experience in deploying and managing applications on AWS cloud platforms, including services like EC2, S3, RDS, Lambda, IAM, and CloudWatch.
              - listitem [ref=f2621e128]: Mandatory experience in the payment domain, with a clear understanding of payment processing workflows, transaction lifecycles, security standards, and compliance requirements (e.g., PCI-DSS).
              - listitem [ref=f2621e129]: Experience with distributed systems, asynchronous processing, and message-based architectures.
              - listitem [ref=f2621e130]: Working knowledge of database technologies, including relational databases (MySQL, PostgreSQL) and/or NoSQL databases.
              - listitem [ref=f2621e131]: Familiarity with CI/CD pipelines, version control systems (Git), and Agile development practices.
              - listitem [ref=f2621e132]: Exposure to Angular UI development or other modern frontend frameworks is a plus.
              - listitem [ref=f2621e133]: Strong problem-solving, analytical, and debugging skills with attention to performance and security.
              - listitem [ref=f2621e134]: Excellent communication skills and the ability to work effectively in cross functional teams.
            - paragraph [ref=f2621e135]:
              - strong [ref=f2621e136]: "Positions Available:"
              - text: "10"
              - strong [ref=f2621e137]: Tech stack
              - text: – Java-21, Spring Boot-3.x, PostgreSQL (or) MySQL
              - link "Java (Programming Language)" [ref=f2621e138] [cursor=pointer]
