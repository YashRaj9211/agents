            - heading "Job Description :" [level=2] [ref=f1125e109]
            - paragraph [ref=f1125e110]:
              - text: We are seeking enthusiastic Apprentice Trainees to join our engineering teams as part of a 1-year apprenticeship program. This role is intended for graduates in
              - link "Computer Science" [ref=f1125e111] [cursor=pointer]:
                - /url: "#"
              - text: / Information Science / Information Technology / Electronics & Communication Engineering, who are interested in working on testing and validation of medical instruments and software systems.
              - link "Enterprise Technology" [ref=f1125e114] [cursor=pointer]
            - paragraph [ref=f1125e118]: The apprentice will gain hands-on experience in medical device testing, validation processes, and quality standards, working closely with experienced engineers in a regulated environment.
            - insertion [ref=f1125e120]:
              - iframe [ref=f1125e122]:
                
            - paragraph [ref=f1125e123]:
              - strong [ref=f1125e124]: Key Responsibilities
            - paragraph [ref=f1125e125]: · Perform functional, integration, and system-level testing of medical instruments and associated software. Willingness to perform Manual , Automation , Instrumentation & Performance Testing.
            - paragraph [ref=f1125e126]: · Support execution of test cases, test plans, and validation protocols
            - paragraph [ref=f1125e127]:
              - text: · Assist in verification and validation (V&V) activities for medical devices
              - link "Software" [ref=f1125e128] [cursor=pointer]
            - paragraph [ref=f1125e132]: · Identify, log, and track defects using defect management tools
            - paragraph [ref=f1125e133]: · Support automation of test scenarios, where applicable
            - paragraph [ref=f1125e134]: · Work with cross-functional teams .
            - insertion [ref=f1125e136]
            - paragraph [ref=f1125e138]: · Ensure compliance with quality standards and regulatory guidelines (e.g., ISO, FDA-related practices as applicable)
            - paragraph [ref=f1125e139]: · Document test results, observations, and deviations in a structured manner
            - paragraph [ref=f1125e140]: · Assist in troubleshooting issues observed during testing and validation phases
            - paragraph [ref=f1125e141]:
              - text: · Contribute to continuous improvement of testing processes and tools
              - link "Engineering & Technology" [ref=f1125e142] [cursor=pointer]
            - paragraph [ref=f1125e146]: Learning & Development
            - paragraph [ref=f1125e147]: · Gain exposure to medical device lifecycle, compliance, and regulatory testing environments
            - insertion [ref=f1125e149]
            - paragraph [ref=f1125e151]: · Learn industry-standard practices for quality assurance, validation, and documentation
            - paragraph [ref=f1125e152]: · Develop hands-on experience with testing tools, lab setups, and instrumentation
            - paragraph [ref=f1125e153]: · Receive mentorship and periodic performance feedback
