            - paragraph
            - 'heading "EA Job Description: Software Engineer AI" [level=2] [ref=f1468e108]'
            - paragraph [ref=f1468e109]:
              - text: This internship offers an opportunity to work on modern technologies across AI/ML, Generative AI, cloud platforms, automation, and scalable backend systems while collaborating with experienced
              - link "engineers" [ref=f1468e110] [cursor=pointer]:
                - /url: "#"
              - text: and mentors. You will gain hands-on exposure to real-world engineering challenges and contribute to building reliable, intelligent, and high-impact AI Platform services used across EA’s ecosystem.
              - link "Engineering & Technology" [ref=f1468e113] [cursor=pointer]
            - generic [ref=f1468e119]:
              - generic [ref=f1468e120]:
                - generic [ref=f1468e121]: WhatsApp Channel
                - link "Join Now" [ref=f1468e123] [cursor=pointer]:
                  - /url: https://chat.whatsapp.com/LD7u8YPDaP7JDTDrnpwNNP
              - generic [ref=f1468e124]:
                - generic [ref=f1468e125]: Telegram Channel
                - link "Join Now" [ref=f1468e127] [cursor=pointer]:
                  - /url: https://telegram.me/campusdrivejobs
            - paragraph
            - paragraph [ref=f1468e128]: At EADP, innovation, learning, and collaboration are at the core of how we build technology that connects millions of players anytime, anywhere.
            - insertion [ref=f1468e130]
            - heading "Responsibilities:" [level=3] [ref=f1468e132]
            - list [ref=f1468e133]:
              - listitem [ref=f1468e134]: Assist in building and integrating AI-powered tools and automation solutions to improve engineering efficiency and developer productivity.
              - listitem [ref=f1468e135]: Contribute to the development of scalable AI/ML and Generative AI applications, including workflows involving LLMs, RAG pipelines, and intelligent agents.
              - listitem [ref=f1468e136]: Support the design, testing, and optimization of backend services, APIs, and cloud-native applications.
              - listitem [ref=f1468e137]: Analyze application logs, test results, and system metrics to identify issues and improve overall platform performance.
              - listitem [ref=f1468e138]: Collaborate with cross-functional engineering teams to troubleshoot technical problems and support feature development.
              - listitem [ref=f1468e139]: Work on automation, monitoring, and operational tasks related to AI Platform products & services, cloud infrastructure, and deployment pipelines.
              - listitem [ref=f1468e140]: Document findings, communicate progress updates, and present technical learnings to mentors and team members.
              - listitem [ref=f1468e141]: Follow engineering best practices, security standards, and organizational compliance guidelines.
              - listitem [ref=f1468e142]: Demonstrate curiosity, ownership, adaptability, and a willingness to learn emerging AI and cloud technologies in a fast-paced environment.
            - paragraph
            - heading "Qualifications:" [level=3] [ref=f1468e143]
            - list [ref=f1468e144]:
              - listitem [ref=f1468e145]:
                - text: Recently completed a Bachelor’s or Master’s degree in
                - link "Computer Science" [ref=f1468e146] [cursor=pointer]:
                  - /url: "#"
                - text: ", Artificial Intelligence, Data Science, or a related field."
              - listitem [ref=f1468e149]: Basic programming knowledge in Python, SQL, or Java, with an interest in AI/ML application development.
              - listitem [ref=f1468e150]: Familiarity with Machine Learning, Deep Learning, or Generative AI concepts is preferred.
              - listitem [ref=f1468e151]: Exposure to technologies such as LLMs, RAG (Retrieval-Augmented Generation), AI Agents, Vector Databases, or MLOps is a plus.
              - listitem [ref=f1468e152]: Basic understanding of cloud platforms (GCP, Azure, or AWS. Docker, and Kubernetes is an added advantage.
              - listitem [ref=f1468e153]: Interest in building scalable AI platforms, intelligent applications, and data-driven solutions.
              - listitem [ref=f1468e154]: Understanding of APIs, backend services, and distributed systems fundamentals is beneficial.
              - listitem [ref=f1468e155]: Strong analytical and problem-solving skills with eagerness to learn emerging AI technologies.
              - listitem [ref=f1468e156]: Ability to work collaboratively in a fast-paced engineering environment.
              - listitem [ref=f1468e157]: Good communication and presentation skills with a proactive and innovative mindset.
            - paragraph
            - heading "How to Apply for EA Off Campus Drive 2026?" [level=2] [ref=f1468e158]
            - paragraph [ref=f1468e159]:
              - text: Interested and eligible candidates can register for the Software Engineer role via the official EA Careers page. Ensure your resume highlights your projects related to AI/ML or cloud technologies for a better chance of selection.
              - link "Software" [ref=f1468e160] [cursor=pointer]
            - 'link "Apply Link: Click Here" [ref=f1468e166] [cursor=pointer]':
              - /url: https://jobs.ea.com/en_US/careers/JobDetail/Software-Engineer-I/214227?source=LinkedIn
            - heading "Frequently Asked Questions (FAQs)" [level=2] [ref=f1468e168]
            - heading "1. Who is eligible for the EA Off Campus Drive 2026?" [level=3] [ref=f1468e169]
            - paragraph [ref=f1468e170]:
              - text: Candidates with a degree in BE/B.Tech, MCA, MS, or MTech in Computer Science, IT, ECE, or AI-related fields are eligible. The drive is primarily targeting the 2025 and 2026 batches, but others with relevant skills may apply.
              - link "Engineering & Technology" [ref=f1468e171] [cursor=pointer]
            - heading "2. What is the job location for this role?" [level=3] [ref=f1468e175]
            - paragraph [ref=f1468e176]: The selected candidates will be working at Electronic Arts’ state-of-the-art office located in Hyderabad, India.
            - heading "3. What is the expected salary for a Software Engineer 1 at EA?" [level=3] [ref=f1468e177]
            - paragraph [ref=f1468e178]:
              - text: While the exact salary is not disclosed, EA offers “Best in Industry” compensation packages that include competitive base pay, bonuses, and comprehensive benefits.
              - link "Computer Science" [ref=f1468e179] [cursor=pointer]
            - heading "4. Does this role require knowledge of AI?" [level=3] [ref=f1468e183]
            - paragraph [ref=f1468e184]: Yes, since the role focuses on the AI Platform, a basic understanding of Python, Machine Learning, LLMs, and Generative AI concepts is highly preferred.
            - insertion [ref=f1468e186]
            - heading "5. How can I prepare for the EA interview?" [level=3] [ref=f1468e188]
            - paragraph [ref=f1468e189]:
              - text: Focus on
              - link "Data" [ref=f1468e190] [cursor=pointer]:
                - /url: "#"
              - text: Structures and Algorithms (DSA), Python/Java programming, and basic AI/ML concepts. Be prepared to discuss any projects involving cloud services (AWS/GCP) or AI models.
              - link "Dictionaries & Encyclopedias" [ref=f1468e193] [cursor=pointer]
