                - text: Description
              - text: ":"
            - paragraph [ref=f1943e115]: We are looking for a Junior Software Engineering fresher with hands-on experience working with modern web technologies. The ideal candidate should have strong problem-solving skills, a passion for learning, and the ability to adapt quickly in a fast-paced engineering environment.
            - paragraph [ref=f1943e116]:
              - strong [ref=f1943e117]: Key Responsibilities
            - paragraph [ref=f1943e118]:
              - text: • Develop, maintain, and support scalable applications across frontend and backend systems.
              - link "Engineering & Technology" [ref=f1943e119] [cursor=pointer]
            - paragraph [ref=f1943e123]: • Build and enhance backend services and APIs using Node.js.
            - paragraph [ref=f1943e124]: • Write and maintain unit tests using Jest.
            - generic:
              - insertion:
                - generic:
                  - iframe
            - paragraph [ref=f1943e125]:
              - text: • Collaborate with cross-functional teams to deliver high-quality software solutions.
              - link "Libraries" [ref=f1943e126] [cursor=pointer]
            - paragraph [ref=f1943e130]: • Troubleshoot issues, optimize performance, and ensure application reliability.
            - paragraph [ref=f1943e131]: • Follow coding standards, version control practices, and participate in code reviews.
            - paragraph [ref=f1943e132]:
              - strong [ref=f1943e133]: Required Skills & Experience
            - paragraph [ref=f1943e134]: • Basic hands-on experience with Node.js and React/Angular.
            - paragraph [ref=f1943e135]: • Good understanding of Git and version control tools.
            - paragraph [ref=f1943e136]: • Experience writing unit tests using Jest.
            - paragraph [ref=f1943e137]:
              - text: • Strong problem-solving and debugging skills.
              - link "Jobs" [ref=f1943e138] [cursor=pointer]
            - insertion [ref=f1943e143]
            - paragraph [ref=f1943e145]:
              - text: • Passion for learning new technologies and improving technical skills.
              - link "Programming" [ref=f1943e146] [cursor=pointer]
            - paragraph [ref=f1943e150]: • Good communication and teamwork abilities.
            - paragraph [ref=f1943e151]:
              - strong [ref=f1943e152]: Good to Have
            - paragraph [ref=f1943e153]: • Experience in browser automation using Playwright or Puppeteer.
            - paragraph [ref=f1943e154]: • Exposure to CI/CD pipelines and deployment processes.
            - paragraph [ref=f1943e155]: • Familiarity with Agile development practices.
