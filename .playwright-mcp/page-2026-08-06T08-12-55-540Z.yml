            - paragraph
            - heading "Job Description:" [level=3] [ref=f1679e96]
            - paragraph [ref=f1679e97]: a Qualcomm Software Test Engineer, you will design, develop, create, and modify test cases and validate embedded software, cloud software, system algorithms, application software, automation, and/or specialized utility programs that launch cutting-edge, world class products. Qualcomm Software Test Engineers collaborate across various engineering teams and functions to design and implement test plans.
            - generic:
              - insertion:
                - generic:
                  - iframe
            - paragraph [ref=f1679e98]:
              - strong [ref=f1679e99]: "Minimum Qualifications:"
            - paragraph [ref=f1679e100]: • Bachelor’s degree in Engineering, Information Systems, Computer Science, or related field.
            - paragraph [ref=f1679e101]:
              - strong [ref=f1679e102]: "Preferred Qualifications:"
            - paragraph [ref=f1679e103]: • Master’s degree in Engineering, Information Systems, Computer Science, or related field.
            - paragraph [ref=f1679e104]: • 1+ year of work or academic experience with Programming Language such as C, C++, Java, Python, etc. • 1+ year of experience with Software Test or System Test, developing and automating test plans and/or tools (e.g., Source Code Control Systems, Continuous Integration Tools, and Bug Tracking Tools).
            - insertion [ref=f1679e106]
            - paragraph [ref=f1679e108]:
              - strong [ref=f1679e109]: "Principal Duties and Responsibilities:"
            - paragraph [ref=f1679e110]: • Applies software and systems knowledge to assist and support the design, development, creation, and modification of test cases and validation of embedded software, cloud software, system algorithms, application software, automation and/or specialized utility programs.
            - paragraph [ref=f1679e111]: • Designs and implements basic test plans, scenarios, scripts, or procedures to identify a failure within a determined area of code.
            - paragraph [ref=f1679e112]: • Writes functional tests for features to ensure functionality.
            - paragraph [ref=f1679e113]: • Assists in the identification, analyses, and documentation of software defects.
            - paragraph [ref=f1679e114]: • Collaborates with others inside of project team to accomplish project objectives and improve the overall quality of the product.
            - paragraph [ref=f1679e115]: • Assists in the development of test case automations and/or scripts to improve productivity.
            - separator [ref=f1679e116]
