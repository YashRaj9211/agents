              - text: "Job Description :"
              - strong
            - paragraph [ref=f2507e104]:
              - text: As a Software Engineer I and a member of a dynamic and multi-functional Agile development team, you will be responsible for crafting, developing, and unit testing product features with an eye towards user-centric workflow accuracy within our scientific and healthcare suite of products. To be successful in this role you need a real passion for quality software, a dedication to customer happiness, and an ability to work effectively in a matrix organization. You will need a positive attitude, persistence, a love of problem solving, and the ability to communicate with people at all levels of a product development organization.
              - link "Software" [ref=f2507e105] [cursor=pointer]
            - paragraph [ref=f2507e109]:
              - strong [ref=f2507e110]: Essential Functions
            - list [ref=f2507e111]:
              - listitem [ref=f2507e112]: Develops software solutions across multiple subsystems within our applications, including collaboration with requirements definition, prototyping, architectural design, coding, testing and deployment
              - listitem [ref=f2507e113]: Understands how our applications operate, are structured, and how customers use them
              - listitem [ref=f2507e114]: Researches new technology and development tools to remain informed of current trends
              - listitem [ref=f2507e115]: Documents and demonstrates solutions by developing documentation, flowcharts, layouts, diagrams, code comments and clearly readable code
              - listitem [ref=f2507e116]: Analyzes defects, performs root cause analysis, and collaborates to resolve
              - listitem [ref=f2507e117]: Complies with established internal quality systems and considers standards, best practices, and regulatory requirements as part of coding activities
              - listitem [ref=f2507e118]: All other duties and responsibilities as assigned
            - paragraph [ref=f2507e119]:
              - strong [ref=f2507e120]: Skills needed to be successful
              - link "Civil Engineering" [ref=f2507e121] [cursor=pointer]
            - list [ref=f2507e125]:
              - listitem [ref=f2507e126]: Clear, effective verbal and written communication skills
              - listitem [ref=f2507e127]: Good collaboration and teamwork skills
              - listitem [ref=f2507e128]: Solid knowledge of scripting and object-oriented software development principles
              - listitem [ref=f2507e129]: Functional knowledge of relational and/or non-relational databases
              - listitem [ref=f2507e130]: Solid development skills and overall understanding of software development methodologies
              - listitem [ref=f2507e131]: Understanding of refactoring or re-engineering solutions
              - listitem [ref=f2507e132]: Thorough knowledge of design principles and patterns
            - paragraph [ref=f2507e133]:
              - strong [ref=f2507e134]: Required Experience & Education
            - list [ref=f2507e135]:
              - listitem [ref=f2507e136]:
                - text: Bachelor’s degree in software
                - link "engineering" [ref=f2507e137] [cursor=pointer]:
                  - /url: "#"
                - text: ", computer science, or related discipline or equivalent experience"
              - listitem [ref=f2507e140]: 1 -2years of experience in software development.
              - listitem [ref=f2507e141]: Hands-on experience with Java, SQL, and JavaScript in enterprise applications.
              - listitem [ref=f2507e142]: Exposure to front-end technologies (HTML, CSS) and modern development tools.
              - listitem [ref=f2507e143]: Experience with IDEs like IntelliJ or Eclipse.
              - listitem [ref=f2507e144]: Proficiency in leveraging AI-powered development tools and frameworks (e.g., code generation, automated testing, and intelligent debugging) to accelerate software delivery and improve code quality in day-to-day workflows.
              - listitem [ref=f2507e145]: Experience integrating AI capabilities into applications and services, including working with APIs, machine learning models, and prompt engineering to build features that enhance user experience and operational efficiency.
