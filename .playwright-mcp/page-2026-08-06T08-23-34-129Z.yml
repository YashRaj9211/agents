            - heading "Eligibility Criteria for Oracle Hiring" [level=2] [ref=f2226e112]
            - generic:
              - insertion:
                - generic:
                  - iframe
            - paragraph [ref=f2226e113]:
              - text: "To be eligible for the Oracle Software Engineer 1 role, candidates must meet the following requirements:"
              - link "Recruitment & Staffing" [ref=f2226e114] [cursor=pointer]
            - list [ref=f2226e118]:
              - listitem [ref=f2226e119]:
                - strong [ref=f2226e120]: "Educational Background:"
                - text: A Bachelor’s or Master’s degree in Computer Science, Engineering, or a related technical field (BE, B.Tech, MCA, B.Sc Tech).
              - listitem [ref=f2226e121]:
                - strong [ref=f2226e122]: "Experience:"
                - text: 0 to 2 years of experience in software development.
              - listitem [ref=f2226e123]:
                - strong [ref=f2226e124]: "Technical Skills:"
                - text: Basic understanding of software architecture, data structures, and algorithms.
              - listitem [ref=f2226e125]:
                - strong [ref=f2226e126]: "Problem Solving:"
                - text: Strong analytical skills to troubleshoot and debug complex software programs.
              - listitem [ref=f2226e127]:
                - strong [ref=f2226e128]: "Communication:"
                - text: Good verbal and written communication skills to collaborate effectively within a team environment.
            - heading "Job Description & Responsibilities" [level=2] [ref=f2226e129]
            - insertion [ref=f2226e131]
            - paragraph [ref=f2226e133]:
              - text: As a Software Engineer 1 at Oracle, you will be part of the software engineering division. Your primary focus will be on developing, debugging, and designing software applications or operating systems based on specific design requirements.
              - link "Programming" [ref=f2226e134] [cursor=pointer]
            - generic [ref=f2226e140]:
              - generic [ref=f2226e141]:
                - generic [ref=f2226e142]: WhatsApp Channel
                - link "Join Now" [ref=f2226e144] [cursor=pointer]:
                  - /url: https://chat.whatsapp.com/LD7u8YPDaP7JDTDrnpwNNP
              - generic [ref=f2226e145]:
                - generic [ref=f2226e146]: Telegram Channel
                - link "Join Now" [ref=f2226e148] [cursor=pointer]:
                  - /url: https://telegram.me/campusdrivejobs
            - list [ref=f2226e149]:
              - listitem [ref=f2226e150]: Design and develop software programs for databases, networks, tools, and applications.
              - listitem [ref=f2226e151]: Perform tasks associated with software architecture enhancements.
              - listitem [ref=f2226e152]: Troubleshoot and debug existing codebases to improve performance and reliability.
              - listitem [ref=f2226e153]: Build new features within the existing software framework according to design specifications.
              - listitem [ref=f2226e154]: Stay updated with the latest industry trends and technologies to contribute effectively to Oracle’s product ecosystem.
            - heading "How to Apply for Oracle Recruitment?" [level=2] [ref=f2226e155]
            - paragraph [ref=f2226e156]:
              - text: "Interested and eligible candidates can apply for the Oracle Off-Campus Drive through the official Oracle careers portal. Follow these steps:"
              - link "Engineering & Technology" [ref=f2226e157] [cursor=pointer]
            - list [ref=f2226e161]:
              - listitem [ref=f2226e162]: Click on the “Apply Link” provided below.
              - listitem [ref=f2226e163]: Read the job description and requirements carefully.
              - listitem [ref=f2226e164]: Click on the “Apply Now” button.
              - listitem [ref=f2226e165]: Create an account or log in if you already have one.
              - listitem [ref=f2226e166]: Fill in your personal details and upload your updated resume.
              - listitem [ref=f2226e167]: Submit the application form.
            - paragraph [ref=f2226e168]:
              - strong [ref=f2226e169]: "Oracle Apply Link:"
              - link "Click Here to Apply" [ref=f2226e170] [cursor=pointer]:
                - /url: https://eeho.fa.us2.oraclecloud.com/hcmUI/CandidateExperience/en/sites/jobsearch/job/321672
            - insertion [ref=f2226e172]
            - insertion [ref=f2226e175]
            - heading "Frequently Asked Questions (FAQs)" [level=2] [ref=f2226e177]
            - list [ref=f2226e178]:
              - listitem [ref=f2226e179]:
                - strong [ref=f2226e180]: 1. Can 2025/2026 batch freshers apply for this role?
                - text: Yes, freshers with a technical degree (BE/B.Tech/MCA) are eligible to apply for the Software Engineer 1 position.
              - listitem [ref=f2226e181]:
                - strong [ref=f2226e182]: 2. What is the salary for a Software Engineer 1 at Oracle?
                - text: Oracle offers a competitive salary package that is considered among the best in the industry for entry-level roles, typically ranging based on candidate skills and location.
              - listitem [ref=f2226e183]:
                - strong [ref=f2226e184]: 3. Where is the job location?
                - text: The job is available across Pan India locations, including major tech hubs like Bangalore, Hyderabad, Pune, and Noida.
              - listitem [ref=f2226e185]:
                - strong [ref=f2226e186]: 4. What is the selection process?
                - text: The selection process usually involves an online aptitude/technical test, followed by multiple rounds of technical interviews and an HR interview.
              - listitem [ref=f2226e187]:
                - strong [ref=f2226e188]: 5. Is there any bond for this role?
                - text: Information regarding employment bonds, if any, will be shared by the Oracle HR team during the offer process.
