            - heading [level=2] [ref=f3087e104]:
              - strong [ref=f3087e105]: "Job Description:"
            - paragraph [ref=f3087e106]: Join us as a Software Engineer on our Engineering Development team in Bangalore to do the best work of your career and make a profound social impact.
            - paragraph [ref=f3087e107]:
              - strong [ref=f3087e108]: What you’ll achieve
            - paragraph [ref=f3087e109]:
              - text: "As a Software Engineer, you will be responsible for developing sophisticated systems and software basis the customer’s business goals, needs and general business environment creating software solutions.You will:• Develop, test and integrate code for new or existing software while following source code revision control• Troubleshoot software reliability and performance issues• Review requirements, specifications and designs, developing and implementing tests for product quality and performance assurance• Assist with the development and review of (technical) end user documentation• Drive idea generation for new software products or for the next version of an existing productTake the first step towards your dream careerEvery Boomi team member brings something unique to the table. Here’s what we are looking for with this role:"
              - link "Civil Engineering" [ref=f3087e110] [cursor=pointer]
            - paragraph
            - paragraph [ref=f3087e114]:
              - strong [ref=f3087e115]: Essential Requirements
              - text: • Entry level position requiring basic knowledge of programming languages, operating systems and databases, UI
            - insertion [ref=f3087e117]
            - paragraph [ref=f3087e119]: • Good understanding of languages such of Java, React, Python, Javascript and AI concepts knowledge• Debugging skills for simple programs using either written or verbal design specifications• A good understanding of hardware and software interactions• First-hand experience with server, storage, networking and client technologies• Insight into software architectures and applications
            - insertion [ref=f3087e121]
            - paragraph [ref=f3087e123]:
              - strong [ref=f3087e124]: Desirable Requirements
              - text: • First-hand experience gathered during an internship, student job or related professional role
