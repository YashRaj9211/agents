            - paragraph [ref=f2829e109]:
              - strong [ref=f2829e110]: "Job Description :"
            - paragraph [ref=f2829e111]: We are looking for dynamic and enthusiastic software developer to join our team. This role is ideal for developer with Gen AI, NLP and CV experience or individuals with a strong foundation in software development who are eager to kickstart their careers in a collaborative and innovative environment.
            - paragraph [ref=f2829e112]: You will work closely with experienced professionals to develop, troubleshoot, and optimize applications using cutting-edge technologies. You will be a part of an Agile team and contribute to building robust, scalable, and high-performing solutions.
            - paragraph [ref=f2829e113]:
              - strong [ref=f2829e114]: "Key Responsibilities:"
            - paragraph [ref=f2829e115]:
              - text: · Collaborate with cross-functional teams to design, develop, and Gen AI solutions
              - link "Geographic Reference" [ref=f2829e116] [cursor=pointer]
            - paragraph [ref=f2829e120]: · Experience in using LLMs, robust prompting strategies, and its relevant frameworks.
            - paragraph [ref=f2829e121]: · Apply Machine Learning, NLP, Deep Learning and GenAI functionalities to solve problems
            - paragraph [ref=f2829e122]: · Develop and maintain user interfaces using react or any similar UI framework.
            - paragraph [ref=f2829e123]: · Utilize Azure for cloud-based application development and deployment.
            - paragraph [ref=f2829e124]: · Identify, troubleshoot, and debug issues to ensure high-quality deliverables.
            - paragraph [ref=f2829e125]: · Continuously learn and adapt to new tools, technologies, and best practices.
            - paragraph [ref=f2829e126]:
              - text: · Apply strong problem-solving skills to deliver innovative and effective solutions.
              - link "Enterprise Technology" [ref=f2829e127] [cursor=pointer]
            - paragraph [ref=f2829e131]: · Proven work experience on using deep learning frameworks such as TensorFlow, Pytorch, etc.
            - paragraph [ref=f2829e132]: · Proven work experience with cloud platforms like Azure is a must.
            - paragraph [ref=f2829e133]: · Working knowledge of Azure DevOps, GitHub, Docker is good to have.
            - paragraph [ref=f2829e134]: · Experience with Search Indexes (SOLR, Elastic Search, Redis, Azure Cognitive Search, etc.) and Search concepts are plus.
            - paragraph [ref=f2829e135]:
              - strong [ref=f2829e136]: "Qualifications and Skills:"
            - paragraph [ref=f2829e137]:
              - text: · A bachelor’s degree in computer science, Information Technology, BE, B.Tech, MCA, MCs, or a related field with some coursework around Data Science and Machine Learning.
              - link "Software" [ref=f2829e138] [cursor=pointer]
            - paragraph [ref=f2829e142]: · Knowledge of Python, SQL and Azure is essential.
            - paragraph [ref=f2829e143]: · Familiarity with Agile frameworks is a plus.
            - paragraph [ref=f2829e144]: · Strong troubleshooting and debugging skills.
            - paragraph [ref=f2829e145]: · Excellent problem-solving abilities with a proactive and dynamic approach.
            - paragraph [ref=f2829e146]: · A passion for learning and growing in a fast-paced environment.
            - paragraph [ref=f2829e147]:
