            - heading [level=3] [ref=f1551e149]:
              - strong [ref=f1551e150]: "Requirements:"
            - list [ref=f1551e151]:
              - listitem [ref=f1551e152]:
                - strong [ref=f1551e153]: Educational Qualifications
                - text: ": Should have completed BE/B.Tech in Computer Science or Computer Engineering ( any specialization like AI/ML etc ) , or Electronics & Communications Engineering."
              - listitem [ref=f1551e154]:
                - strong [ref=f1551e155]: Important note
                - text: ": Candidates must be able to join Vonage full time on the 5th August 2026 as a mandatory requirement. We are looking for candidates who have already graduated from University and can provide a copy of their Provisional Degree Certificate."
              - listitem [ref=f1551e156]:
                - strong [ref=f1551e157]: "Location:"
                - text: Please note, we are looking for candidates already located in Bangalore and do not need to relocate
              - listitem [ref=f1551e158]:
                - strong [ref=f1551e159]: "GPA:"
                - text: We are strictly looking for candidates with a GPA of 8.0 or above
              - listitem [ref=f1551e160]:
                - strong [ref=f1551e161]: Age Requirement
                - text: ": Must meet minimum legal age for apprenticeship programs as per local labour laws."
              - listitem [ref=f1551e162]:
                - strong [ref=f1551e163]: Communication Skills
                - text: ": Strong English verbal and written communication abilities."
              - listitem [ref=f1551e164]:
                - strong [ref=f1551e165]: Eagerness to Learn
                - text: ": Enthusiastic about acquiring new skills and knowledge in the field."
              - listitem [ref=f1551e166]:
                - strong [ref=f1551e167]: Team Player
                - text: ": Ability to work collaboratively and take direction from senior staff."
              - listitem [ref=f1551e168]:
                - strong [ref=f1551e169]: Problem-Solving
                - text: ": A proactive attitude and willingness to tackle challenges."
              - listitem [ref=f1551e170]:
                - strong [ref=f1551e171]: Attention to Detail
                - text: ": Strong focus on accuracy and quality in task execution."
              - listitem [ref=f1551e172]:
                - strong [ref=f1551e173]: Technical Skills
                - text: ": Proficient coding skills with a strong understanding of programming languages, algorithms, and software development best practices."
              - listitem [ref=f1551e174]:
                - strong [ref=f1551e175]: Work timings
                - text: ": Certain roles may require an alignment with the UK timezone (For ex. from 2.00 PM up to 10.30/11.00 PM India)"
            - heading [level=3] [ref=f1551e176]:
              - strong [ref=f1551e177]: "Benefits:"
            - list [ref=f1551e178]:
              - listitem [ref=f1551e179]:
                - strong [ref=f1551e180]: Comprehensive Training
                - text: ": Access to structured learning programs and mentorship."
              - listitem [ref=f1551e181]:
                - strong [ref=f1551e182]: Career Development
                - text: ": Opportunity to build a strong foundation for a career in Communication Industry"
              - listitem [ref=f1551e183]:
                - strong [ref=f1551e184]: Hands-on Experience
                - text: ": Work on real projects, gaining practical knowledge in the field."
              - listitem [ref=f1551e185]:
                - strong [ref=f1551e186]: Remuneration
                - text: ": This is a 12 month Apprenticeship position paying INR 50,000 per month. The position will not be eligible for any other benefits."
            - heading [level=3] [ref=f1551e187]:
              - strong [ref=f1551e188]: "How To Apply:"
            - paragraph [ref=f1551e189]:
              - text: Interested and eligible graduates apply on the following Vonage ASAP.
