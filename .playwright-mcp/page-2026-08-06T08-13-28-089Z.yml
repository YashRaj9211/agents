              - strong [ref=f1701e120]: "Job Description:"
            - paragraph [ref=f1701e121]: Wells Fargo is seeking a Software Engineer/Java Backend, Spring Boot, Kafka, Clouds.
            - paragraph [ref=f1701e122]:
              - strong [ref=f1701e123]: "In this role, you will:"
              - link "Computer Education" [ref=f1701e124] [cursor=pointer]
            - list [ref=f1701e128]:
              - listitem [ref=f1701e129]: Participate in low to moderately complex initiatives and projects associated with the technology domain, including installation, upgrades, and deployment efforts
              - listitem [ref=f1701e130]: Identify opportunities for service quality and availability improvements within the technology domain environment
              - listitem [ref=f1701e131]: Design, code, test, debug, and document for low to moderately complex projects and programs associated with technology domain, including upgrades and deployments
              - listitem [ref=f1701e132]: Review and analyze technical assignments or challenges that are related to low to medium risk deliverables and that require research, evaluation, and selection of alternative technology domains
              - listitem [ref=f1701e133]: Present recommendations for resolving issues or may escalate issues as needed to meet established service level agreements
              - listitem [ref=f1701e134]: Exercise some independent judgment while also developing understanding of given technology domain in reference to security and compliance requirements
              - listitem [ref=f1701e135]: Provide information to technology colleagues, internal partners, and stakeholders
            - paragraph [ref=f1701e136]:
              - strong [ref=f1701e137]: "Required Qualifications:"
            - list [ref=f1701e138]:
              - listitem [ref=f1701e139]: "2+ years of software engineering experience, or equivalent demonstrated through one or a combination of the following: work experience, training, military experience, education"
            - paragraph [ref=f1701e140]:
              - strong [ref=f1701e141]: "Desired Qualifications:"
            - list [ref=f1701e142]:
              - listitem [ref=f1701e143]: Looking for only 2023 Pass Out/Graduated
              - listitem [ref=f1701e144]: "Software engineering experience, or equivalent demonstrated through one or a combination of the following: work experience, training, military experience, education."
              - listitem [ref=f1701e145]: Strong in Java/JEE, Spring framework, JavaScript, RESTful web services
              - listitem [ref=f1701e146]: Sound knowledge of UI frameworks like Angular / React
              - listitem [ref=f1701e147]: Strong understanding of microservices and associated design patterns
              - listitem [ref=f1701e148]: Experience with latest unit testing tools including Junit
              - listitem [ref=f1701e149]: Experience with best-in-class version control tools like GitHub
              - listitem [ref=f1701e150]: Experience with build tools like Maven or Gradle
              - listitem [ref=f1701e151]: Working knowledge of both SQL and NoSQL databases
              - listitem [ref=f1701e152]: Experience in identifying and remediating security vulnerabilities
              - listitem [ref=f1701e153]: Should be well versed with test driven development and be knowledgeable on associated tools and practices
              - listitem [ref=f1701e154]: Strong verbal and written communication skills
              - listitem [ref=f1701e155]: Domain knowledge in home lending or consumer lending space.
              - listitem [ref=f1701e156]: Knowledge on messaging systems like MQ, Solace, Kafka
              - listitem [ref=f1701e157]: Well versed in DevOps concepts
              - listitem [ref=f1701e158]: Experience with working with globally distributed teams in working in Agile scrums
