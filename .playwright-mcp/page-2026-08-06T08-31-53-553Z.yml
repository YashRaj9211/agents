            - heading "Job Description :" [level=2] [ref=f2811e123]
            - paragraph [ref=f2811e124]: As a Junior Software Engineer, you will work in a fast-paced, team-oriented environment using Agile methodologies. You will collaborate closely with senior engineers and cross-functional teams to design, develop, test, and maintain high-quality software solutions.
            - paragraph [ref=f2811e125]:
              - text: You are eager to learn, passionate about technology, and motivated to build scalable and reliable software systems. You should have a cloud-first mindset, understand the importance of writing clean and maintainable code, and be willing to build systems that are resilient and failure-aware.
              - link "Engineering & Technology" [ref=f2811e126] [cursor=pointer]
            - generic [ref=f2811e130]:
              - insertion:
                - generic:
                  - iframe
            - heading "Role Responsibilities:" [level=4] [ref=f2811e131]
            - paragraph [ref=f2811e132]: • Assist in designing, developing, testing, and maintaining software systems as per the definition of done.• Collaborate with team members and follow best practices for software development.• Participate in requirement analysis and contribute to technical documentation.• Write clean, maintainable, and well-tested code under guidance from senior engineers.• Debug, troubleshoot, and resolve issues in development and production environments.• Contribute to improving internal methods, processes, and systems.• Support DevOps practices including CI/CD pipelines and deployment automation.
            - heading "Technical Qualifications / Role Requirements (Must – Have Skills)" [level=4] [ref=f2811e133]
            - paragraph [ref=f2811e134]:
              - text: • 0–2 years of experience in software development (internships and academic projects included).• Strong understanding of object-oriented programming principles and data structures.• Working knowledge of Microsoft .NET technologies (preferably .NET 6 or later).• Basic understanding of asynchronous programming concepts.• Familiarity with web technologies such as JavaScript or TypeScript.• Basic understanding of REST APIs and client-server architecture.• Exposure to relational databases such as Microsoft SQL Server.• Understanding of version control systems like Git.• Strong analytical, problem-solving, and communication skills.
              - link "Data Management" [ref=f2811e135] [cursor=pointer]
            - heading "Good to Have Skills:" [level=4] [ref=f2811e139]
            - paragraph [ref=f2811e140]: • Exposure to cloud technologies such as Azure or AWS.• Familiarity with containerization technologies like Docker.• Understanding of Agile/Scrum methodologies.• Knowledge of unit testing frameworks and automated testing practices.
