              - text: ":"
            - paragraph [ref=f2015e96]:
              - text: The Associate Software Engineer supports the design, development, and maintenance of software applications as part of a dynamic cross-functional agile team. In addition, they will collaborate with other staff to design and implement solutions.
              - link "Engineering & Technology" [ref=f2015e97] [cursor=pointer]
            - generic [ref=f2015e101]:
              - insertion:
                - generic:
                  - iframe
            - paragraph [ref=f2015e102]: Essential Duties and Responsibilities
            - list [ref=f2015e103]:
              - listitem [ref=f2015e104]: Develops software applications and supporting infrastructure using established coding standards and methodologies.
              - listitem [ref=f2015e105]: Relentlessly pursues quality through multiple levels of automated testing, including but not limited to unit, API, end-to-end, and load testing.
              - listitem [ref=f2015e106]: Develops tooling, test harnesses, and innovative solutions to understand and monitor product quality.
              - listitem [ref=f2015e107]: Develops infrastructure as code to reliably deploy applications on demand or through automation.
              - listitem [ref=f2015e108]: Understands cloud-managed services and builds scalable, secure applications using them.Creates proof of concepts for new ideas to answer key questions of feasibility, desirability, and viability.
              - listitem [ref=f2015e109]: Performs thorough code reviews that promote better understanding across the team.
              - listitem [ref=f2015e110]: Troubleshoots, instruments, and debugs existing software, resolving root causes of defective behavior.
              - listitem [ref=f2015e111]: Builds intuitive user interfaces with the end-user persona in mind using front-end frameworks and styling.Works with architects, designers, business analysts, and others to design and implement solutions.
              - listitem [ref=f2015e112]: Works within an Agile Scrum team and contributes to an atmosphere of continuous improvement.
              - listitem [ref=f2015e113]:
                - text: Understands how to interpret database models and collaborates effectively with Database
                - link "Engineers" [ref=f2015e114] [cursor=pointer]:
                  - /url: "#"
                - text: .
              - listitem [ref=f2015e117]: Assists product owners with backlog grooming, story breakdown, and story estimation.Collaborates and communicates effectively with team members and stakeholders throughout the organization.
              - listitem [ref=f2015e118]: Documents software changes for use by other engineers, quality assurance, and documentation specialists.
              - listitem [ref=f2015e119]: Builds technical skills and domain expertise through structured assignments, training, and hands-on project work.
              - listitem [ref=f2015e120]: Applies foundational software engineering knowledge, testing methodologies, tools, and documented practices to address standard or recurring issues and make informed decisions within scope.
              - listitem [ref=f2015e121]: Contributes as an individual contributor without supervisory responsibilities.
              - listitem [ref=f2015e122]: Actively participates in team meetings, training sessions, and engagement activities.Develops mastery of the technologies, languages, and practices used by the team and assigned projects
            - insertion [ref=f2015e124]
            - heading "Education and Experience" [level=3] [ref=f2015e126]
            - list [ref=f2015e127]:
              - listitem [ref=f2015e128]: Bachelor’s degree or equivalent with minimal relevant work experience (0-2 years)
            - heading "Knowledge, Skills and Abilities" [level=3] [ref=f2015e129]
            - list [ref=f2015e130]:
              - listitem [ref=f2015e131]:
                - text: Basic programming skills and proficient in one or more of the following languages (Specific languages needed will vary based on development department or project
                - list [ref=f2015e132]:
                  - listitem [ref=f2015e133]: Net Core, C#, Java, SQL, JavaScript, Typescript, Python
              - listitem [ref=f2015e134]:
                - text: "Additional desired skills:"
                - list [ref=f2015e135]:
                  - listitem [ref=f2015e136]: Single-Page Applications, Angular (v9), Ivy, RXJS, NGRX, HTML5, CSS/SASS, Web Components, Atomic Design
                  - listitem [ref=f2015e137]: Test First approach, Test Driven Development (TDD), Automated testing (Protractor, Jasmine), Newman Postman, artillery.io
                  - listitem [ref=f2015e138]: Microservices, Terraform, Jenkins, Jupyter Notebook, Docker, NPM, Yarn, Nuget, NodeJS, Git/Gerrit, LaunchDarkly
                  - listitem [ref=f2015e139]: Amazon Web Services (AWS), Lambda, S3, Cognito, Step Functions, SQS, IAM, Cloudwatch, Elasticache
                  - listitem [ref=f2015e140]: Database Design, Optimization, Replication, Partitioning/Sharding, NoSQL, PostgreSQL, MongoDB, DynamoDB, Elastic Search, PySpark, Kafka
                  - listitem [ref=f2015e141]: Agile, Scrum, Kanban, DevSecOps
