                    - paragraph [ref=f13e903]: ABOUT VJ OVERSEAS INDIA
                    - paragraph [ref=f13e904]: VJ Overseas India is a Delhi-based delivery and operations firm handling end-to-end digital fulfillment, HR, and technical execution for US-based digital marketing clients. Our team works in a night-shift model aligned with US business hours, delivering high-quality web, SEO, content, design, and AI-driven marketing solutions across multiple verticals and markets.
                    - paragraph [ref=f13e905]: ROLE OVERVIEW
                    - paragraph [ref=f13e906]: We are looking for a skilled MERN Stack Developer who can build scalable web applications using MongoDB, Express.js, React.js, and Node.js.
                    - paragraph [ref=f13e907]: The candidate should be capable of handling both frontend and backend development, API integration, database management, and deployment.
                    - paragraph [ref=f13e908]: "RESPONSIBILITIES:"
