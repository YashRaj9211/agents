                      - listitem [ref=f13e916]: Collaborate with UI/UX designers and other developers
                      - listitem [ref=f13e917]: Deploy and maintain applications on cloud/VPS servers
                    - paragraph [ref=f13e918]: "REQUIRED SKILLS:"
