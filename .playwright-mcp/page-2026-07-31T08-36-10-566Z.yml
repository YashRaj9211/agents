                  - heading "Full job description" [level=2] [ref=f19e1222]
                  - generic [ref=f19e1223]:
                    - generic [ref=f19e1224]:
                      - paragraph [ref=f19e1225]: Credit Acceptance is proud to be an award-winning company with workplace recognition in multiple categories! Our world-class culture is shaped by dedicated Team Members who share a drive to succeed as professionals and together as a company. A great product, amazing people and our stable financial history have made us one of the largest used car finance companies in the United States.
                      - paragraph [ref=f19e1226]: In this role, you will work as a dedicated member of a globally distributed team, partnering closely with business partners in the U.S. to design, build, and scale solutions that directly impact our customers and operations. While your legal employer will be our EoR partner, you will be fully integrated into our Credit Acceptance team for day-to-day work and collaboration.
                      - paragraph
                      - text: The Staff Software Engineer is a technical leader responsible for designing and delivering scalable, high-quality software solutions that support business objectives across multiple applications and systems. This role drives technical design, architecture decisions, coding standards, and engineering best practices while solving complex technical challenges and ensuring long-term maintainability and reliability. Working across teams, the Staff Software Engineer provides technical direction, conducts impact analysis, evaluates solution options, and leads initiatives that improve engineering effectiveness. The role mentors engineers, influences technical strategy, promotes continuous learning, and collaborates with business and technology partners to deliver innovative and efficient solutions.
                      - paragraph
                      - paragraph [ref=f19e1227]: "Outcomes and Activities:"
                      - list [ref=f19e1228]:
                        - listitem [ref=f19e1229]: This position will work remotely from India
                        - listitem [ref=f19e1230]: Design and develop software and improve existing code to make it more efficient to detect bugs in the code
                        - listitem [ref=f19e1231]: Write unit-tests and validate your software against acceptance criteria
                        - listitem [ref=f19e1232]: Evolve and transform the design and architecture of applications towards leading edge technologies and practices
                        - listitem [ref=f19e1233]: Author, apply and advocate for team coding, documenting and testing standards
                        - listitem [ref=f19e1234]: Conduct impact analysis to proactively identify impact of a change across multiple applications
                        - listitem [ref=f19e1235]: Learn the business process domain to better support the business and align technologies with the business process
                        - listitem [ref=f19e1236]: Experiment and test ideas, validate assumptions against needs, reach conclusions and recommend solutions
                        - listitem [ref=f19e1237]: Lead code reviews and communicate application changes
                        - listitem [ref=f19e1238]: Document code and projects so others can easily understand, maintain and support
                        - listitem [ref=f19e1239]: Debug the problems which arise in production and propose effective solutions within the application and across multiple applications
                        - listitem [ref=f19e1240]: Read, write and review design documents
                        - listitem [ref=f19e1241]: Contribute to team's sprint commitments and actively participate in our Agile practices, including recommendations for process improvement
                        - listitem [ref=f19e1242]: Lead continuous learning activities to improve design and code quality as well as to increase application domain knowledge
                        - listitem [ref=f19e1243]: Participate in the talent selection process
                        - listitem [ref=f19e1244]: Act as a mentor to guide and review the code, designs and documentation of less experienced software engineers
                      - paragraph
                      - paragraph [ref=f19e1245]: "Competencies: The following items detail how you will be successful in this role."
                      - list [ref=f19e1246]:
                        - listitem [ref=f19e1247]: "Customer Empathy: Customer Empathy is the ability to understand the perspectives, pain points, and experiences of customers. It involves actively putting oneself in the customer’s shoes, comprehending their needs and challenges, and using that understanding to provide a better, more customer-centric experience."
                        - listitem [ref=f19e1248]: "Engineering Excellence: Engineering Excellence is about bringing great craftsmanship and thought leadership to deliver an outstanding product that delights customers and solves for the business. This involves the pursuit and achievement of high standards, best practices, innovation, and superior solutions."
                        - listitem [ref=f19e1249]: "One Team: A One Team mindset refers to a collaborative approach across the organization, where individuals work together seamlessly, without boundaries, as a single, cohesive team. Shared goals, open communication and mutual support create a sense of collective purpose. This enables teams to navigate challenges and pursue shared objectives more effectively."
                        - listitem [ref=f19e1250]: "Owner’s Mindset: Owner’s Mindset involves adopting a set of behaviors that reflect a sense of responsibility, accountability, strategic thinking, and a proactive approach to managing your domain. As an owner, you understand the business and your domain(s) deeply and solve for the right outcome for the domain(s) and the business."
                      - paragraph
                      - paragraph [ref=f19e1251]: "Requirements:"
                      - list [ref=f19e1252]:
                        - listitem [ref=f19e1253]: Bachelor’s degree in Computer Science, Information Systems, or closely related field of study; or equivalent work experience
                        - listitem [ref=f19e1254]: Minimum 8 years of software engineering experience or comparable depth of experience
                        - listitem [ref=f19e1255]: Experience in the lead role overseeing technical direction of a team of software engineering talent across multiple applications
                        - listitem [ref=f19e1256]: Strong understanding and use of one or more object-oriented programming languages and design patterns
                        - listitem [ref=f19e1257]: Practical experience in Software Development Life Cycle (SDLC) including Agile/SCRUM and Waterfall
                        - listitem [ref=f19e1258]: Practical experience in data modeling, design and messaging
                        - listitem [ref=f19e1259]: Experience working on mission-critical enterprise class applications
                        - listitem [ref=f19e1260]: Demonstrated ability to coach and mentor less experienced team members
                        - listitem [ref=f19e1261]: Willingness to participate in an on-call rotation
                      - paragraph
                      - paragraph [ref=f19e1262]: "Preferred:"
                      - list [ref=f19e1263]:
                        - listitem [ref=f19e1264]: Advanced understanding of IDEs, have the ability to navigate through them quickly and leverage advanced features to improve your performance
                        - listitem [ref=f19e1265]: "In-depth usage and creation of application programming interfaces (API) and frameworks in their particular field: JSON, Rest/SOAP based Web Services, JUnit, Jenkins and Bitbucket preferred"
                        - listitem [ref=f19e1266]: Experience in API security, analytics, throttling, caching, logging, request and response modifications
                        - listitem [ref=f19e1267]: Experience in creating REST API documentation using Swagger or similar tools desirable
                        - listitem [ref=f19e1268]: Ability to use DDL to create database objects and relationships, construct advanced queries, and optimize query performance
                        - listitem [ref=f19e1269]: Financial services industry experience
                      - paragraph
                      - paragraph [ref=f19e1270]: "Knowledge and Skills:"
                      - list [ref=f19e1271]:
                        - listitem [ref=f19e1272]: Ability to challenge the status quo and influence stakeholders to create innovative solutions
                        - listitem [ref=f19e1273]: Be collaborative with other team members, seeking a diversity of thought to meet business outcomes
                        - listitem [ref=f19e1274]: Ability to foster strong relationships across the organization
                        - listitem [ref=f19e1275]: Bring a strong understanding of relevant and emerging technologies, provide input and coach team members and embed learning and innovation in the day-to-day
                        - listitem [ref=f19e1276]: Experience and understanding of how to connect the work being done and how it drives business value
                        - listitem [ref=f19e1277]: Ability to communicate complex technical information (both verbal and written) to all levels, including senior leadership
                      - paragraph
