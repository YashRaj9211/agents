            - heading [level=3] [ref=f1299e96]:
              - strong [ref=f1299e97]: Job Description
              - text: ":"
            - paragraph [ref=f1299e98]:
              - text: We are seeking an
              - strong [ref=f1299e99]: Cloud DevOps Engineer
              - text: to join our dynamic and innovative technology team. This role is ideal for a fresh graduate who has a strong foundation in computer science, software engineering, cloud technologies, and automation, along with a strong desire to learn and grow in the DevOps domain.
            - heading "Minimum Qualifications:" [level=5] [ref=f1299e100]
            - list [ref=f1299e101]:
              - listitem [ref=f1299e102]: Bachelor’s Degree in Computer Science, Information Technology, Engineering, or a related technical field.
              - listitem [ref=f1299e103]: Fresh graduate or early-career candidate with strong interest in Cloud DevOps, SRE, infrastructure, or automation.
              - listitem [ref=f1299e104]: Foundational understanding of software development and operating system concepts.
              - listitem [ref=f1299e105]:
                - text: Basic programming or scripting knowledge in one or more languages such as
                - strong [ref=f1299e106]: Python, Java, JavaScript, Go, Bash, or Shell scripting
                - text: .
              - listitem [ref=f1299e107]:
                - text: Familiarity with
                - strong [ref=f1299e108]: Unix/Linux
                - text: systems and basic command-line usage.
              - listitem [ref=f1299e109]: Basic understanding of cloud computing concepts such as compute, storage, networking, and managed services.
              - listitem [ref=f1299e110]:
                - text: Exposure to one or more cloud platforms such as
                - strong [ref=f1299e111]: AWS, GCP, or Azure
                - text: through coursework, projects, internships, or self-learning.
              - listitem [ref=f1299e112]: Basic knowledge of DevOps concepts such as CI/CD, automation, build pipelines, deployment, and infrastructure as code.
              - listitem [ref=f1299e113]:
                - text: Awareness of container technologies such as
                - strong [ref=f1299e114]: Docker
                - text: ; familiarity with
                - strong [ref=f1299e115]: Kubernetes
                - text: is a plus.
              - listitem [ref=f1299e116]: Good analytical and problem-solving skills.
              - listitem [ref=f1299e117]: Strong communication skills and willingness to work in a team-oriented environment.
              - listitem [ref=f1299e118]: Eagerness to learn, experiment, and adapt in a fast-paced technology environment.
            - heading "Preferred Qualifications" [level=5] [ref=f1299e119]
            - list [ref=f1299e120]:
              - listitem [ref=f1299e121]: Academic projects, internship experience, or personal projects related to cloud, DevOps, automation, or backend systems.
              - listitem [ref=f1299e122]:
                - text: Exposure to CI/CD tools such as
                - strong [ref=f1299e123]: Jenkins, GitHub Actions, GitLab CI, or similar tools
                - text: .
              - listitem [ref=f1299e124]:
                - text: Familiarity with version control systems such as
                - strong [ref=f1299e125]: Git
                - text: .
              - listitem [ref=f1299e126]: Basic understanding of networking concepts such as DNS, HTTP/HTTPS, TCP/IP, load balancing, and firewalls.
              - listitem [ref=f1299e127]: Exposure to monitoring or logging tools such as Prometheus, Grafana, Splunk, ELK, or similar platforms.
              - listitem [ref=f1299e128]: Basic understanding of microservices architecture.
              - listitem [ref=f1299e129]: Interest in cloud security, distributed systems, production operations, and reliability engineering.
              - listitem [ref=f1299e130]: Ability to learn new tools and technologies quickly.
            - heading [level=3] [ref=f1299e131]:
