              - text: ":"
            - paragraph [ref=f2752e108]: As an engineer, contribute to backend development activities of Intersight (SaaS and On-premise Appliance-based) Management Software, including scoping, planning, designing, implementation, testing and coordinating with other teams.
            - paragraph [ref=f2752e109]: Influence the feature development and improving product quality and customer experience.
