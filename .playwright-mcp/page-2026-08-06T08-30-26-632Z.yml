                - text: Bachelor’s degree in
                - link "Computer Science" [ref=f2752e116] [cursor=pointer]:
                  - /url: "#"
                - text: ", Engineering, or a related field (or equivalent experience) with 0-2 years of experience.."
              - listitem [ref=f2752e119]: Good programming skills in languages such as Go, C++, Java, Python with strong design skills in object-oriented methodologies.
              - listitem [ref=f2752e120]: Strengths in Distributed Computing, Data Structures, and Algorithms.
              - listitem [ref=f2752e121]: Good understanding of Linux/Unix environments, shell scripting, and networking fundamentals.
              - listitem [ref=f2752e122]: Familiarity with development tools such as Git, Jenkins, and CI/CD pipelines.
            - paragraph [ref=f2752e123]:
              - strong [ref=f2752e124]: Preferred Qualifications
            - list [ref=f2752e125]:
              - listitem [ref=f2752e126]: Software and product development experience, preferably in cloud computing and distributed systems on Linux and VM environments.
              - listitem [ref=f2752e127]: Experience with virtualization environments such as vSphere, HyperV, KVM.
              - listitem [ref=f2752e128]: Understanding of Microservice architecture using Containers and Orchestration technologies such as Docker, Kubernetes.
              - listitem [ref=f2752e129]: Strong analytical and problem-solving mindset.
              - listitem [ref=f2752e130]: Ability to work independently and as part of a cross-functional team.
              - listitem [ref=f2752e131]: Excellent communication and documentation skills.
              - listitem [ref=f2752e132]: Good team player with strong work ethic
