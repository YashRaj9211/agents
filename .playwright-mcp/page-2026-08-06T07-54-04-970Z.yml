            - heading "Job Description :" [level=3] [ref=f180e113]:
              - text: "Job Description :"
              - strong
            - paragraph [ref=f180e114]:
              - text: We are seeking a highly motivated and enthusiastic
              - strong [ref=f180e115]: IT Application Specialist I– Esker
              - text: to join our growing Enterprise Applications team in Hyderabad, India. This role is ideal for an early-career IT professional with up to 5 years of experience who is eager to learn and build expertise in the
              - strong [ref=f180e116]: Esker platform
              - text: ", including"
              - strong [ref=f180e117]: Accounts Payable Automation (AP), Accounts Receivable Automation (AR), Order Management, and Document Automation solution.
              - link "Enterprise Technology" [ref=f180e118] [cursor=pointer]
            - paragraph [ref=f180e122]:
              - strong [ref=f180e123]: "Key Responsibilities:"
            - list [ref=f180e124]:
              - listitem [ref=f180e125]: Learn and develop expertise in Esker solutions for Accounts Payable, Accounts Receivable, Order Management, and Document Automation.
              - listitem [ref=f180e126]: Collaborate with business and IT stakeholders to understand business processes and system requirements.
              - listitem [ref=f180e127]: Participate in application support, testing, configuration, troubleshooting, and documentation activities.
              - listitem [ref=f180e128]: Support day-to-day operations of the Esker platform and related integrations
              - listitem [ref=f180e129]: Create and maintain documentation including support procedures, training materials, process flows, and knowledge articles.
              - listitem [ref=f180e130]: Work with Finance, Customer Service, Sales Operations, and IT teams to understand and support business requirements.
              - listitem [ref=f180e131]: Gain knowledge of ERP platforms including SAP, Oracle, and Salesforce and understand how Esker integrates with them
            - paragraph [ref=f180e132]:
              - strong [ref=f180e133]: "Personal Skills:"
            - list [ref=f180e134]:
              - listitem [ref=f180e135]: Strong learning agility with the ability to quickly understand new technologies, platforms, and business processes.
              - listitem [ref=f180e136]: Excellent accountability, ownership, teamwork, and problem-solving skills.
              - listitem [ref=f180e137]: Strong verbal and written communication skills with the ability to interact effectively with business and IT stakeholders
            - paragraph [ref=f180e138]:
              - strong [ref=f180e139]: "Technical Competencies:"
            - list [ref=f180e140]:
              - listitem [ref=f180e141]: Strong technical aptitude with the ability to quickly learn new enterprise applications, platforms, and technologies.
              - listitem [ref=f180e142]: Basic understanding of ERP systems (SAP, Oracle, Salesforce), integrations, APIs, and cloud-based applications.
              - listitem [ref=f180e143]: Curiosity and enthusiasm for AI, automation, and emerging software trends, with a willingness to continuously learn and apply new capabilities.
              - listitem [ref=f180e144]: Strong analytical and problem-solving skills with attention to detail.
              - listitem [ref=f180e145]: Understanding of software testing, application support, and system troubleshooting principles.
            - paragraph [ref=f180e146]:
              - strong [ref=f180e147]: Qualifications
            - list [ref=f180e148]:
              - listitem [ref=f180e149]: Bachelor’s degree in Information Technology, Computer Science, Engineering, Business Systems, Finance, or a related field.
              - listitem [ref=f180e150]: 0–5 years of experience in application support, ERP systems, business systems, or related IT roles.
              - listitem [ref=f180e151]: Exposure to SAP, Oracle, Salesforce, integrations, or cloud applications is preferred but not required.
              - listitem [ref=f180e152]: Understanding of Finance processes (Accounts Payable and Accounts Receivable) is advantageous.
            - heading [level=4] [ref=f180e153]:
              - strong [ref=f180e154]: "How To Apply:"
            - paragraph [ref=f180e155]:
              - text: The interested and eligible graduates register for the same position on following Regal Rexnord careers portal link.
