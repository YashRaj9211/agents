            - heading "Job Description:" [level=4] [ref=f3107e103]
            - paragraph [ref=f3107e104]: In your new role, you’ll engineer and maintain innovative, customer centric, high performance, secure and robust solutions.
            - paragraph [ref=f3107e105]: You’ll be working within a feature team and using your extensive experience to engineer software, scripts and tools that are often complex, as well as liaising with other engineers, architects and business analysts across the platform.
            - paragraph [ref=f3107e106]: "You’ll also be:"
            - list [ref=f3107e107]:
              - listitem [ref=f3107e108]: Working in permanent teams who are responsible for the full life cycle, from initial development, through enhancement and maintenance to replacement or decommissioning
              - listitem [ref=f3107e109]: Collaborating to optimise our software engineering capability
              - listitem [ref=f3107e110]: Designing, producing, testing and implementing our working code
              - listitem [ref=f3107e111]: Integrating APIs for seamless data exchange between systems
              - listitem [ref=f3107e112]: Conducting research and staying up-to-date on the latest trends in AI/ML
            - paragraph [ref=f3107e113]:
              - strong [ref=f3107e114]: The skills you’ll need
              - link "Engineering & Technology" [ref=f3107e115] [cursor=pointer]
            - paragraph [ref=f3107e119]: You’ll need a background in software engineering, software design, architecture, and bring an understanding of how your area of expertise supports our customers.
            - paragraph [ref=f3107e120]: "You’ll also need:"
            - list [ref=f3107e121]:
              - listitem [ref=f3107e122]: 0 to 1 year experience in Java, Oracle, or React
              - listitem [ref=f3107e123]: Experience of working with development, bug tracking tools and wikis
              - listitem [ref=f3107e124]: Experience of DevOps, Testing and Agile methodology and associated toolsets
              - listitem [ref=f3107e125]: A background in solving highly complex, analytical and numerical problems
            - heading [level=4] [ref=f3107e126]:
