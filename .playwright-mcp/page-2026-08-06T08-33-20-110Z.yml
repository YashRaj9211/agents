              - listitem [ref=f2897e142]: "Programming skills: Practical development experience in C/C++/Java/Python. Proficiency in at least one of the following: Java, .NET, Python, or JavaScript/TypeScript"
              - listitem [ref=f2897e143]: "Core Concepts: Strong understanding of Data Structures, Algorithms, OOPS and Database Management (SQL/NoSQL)"
