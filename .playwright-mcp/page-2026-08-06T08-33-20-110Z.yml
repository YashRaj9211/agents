                - text: ", or Cloud platforms (AWS/Azure/GCP) is highly valued."
              - listitem [ref=f2897e132]: "Project Exposure: Ability to demonstrate academic or personal projects, good in problem solving, debugging, and troubleshooting skills."
              - listitem [ref=f2897e133]: "Learning Mindset: High learning agility and openness to coaching."
              - listitem [ref=f2897e134]: "Execution: Ability to translate design prototypes into functional, high-quality code."
