            - paragraph [ref=f2897e145]:
              - strong [ref=f2897e146]: "Job Description:"
            - list [ref=f2897e147]:
              - listitem [ref=f2897e148]: As an Associate Software Engineer, you’ll be an integral part of our collaborative and innovative engineering team.
              - listitem [ref=f2897e149]: This role is tailored for freshers or individuals with upto 1.5 years of experience (through projects, internships, or work experience) who are eager to contribute to exciting projects and embark on a journey of professional growth.
              - listitem [ref=f2897e150]: Develop, test, and maintain high-quality software modules and applications.
              - listitem [ref=f2897e151]: Collaborate with senior engineers, participate in agile sprints, code reviews, and technical documentation. Drive independent small-scale projects.
              - listitem [ref=f2897e152]: With a solid foundation in software engineering principles, you’ll have the opportunity to work alongside seasoned engineers, learning from their expertise and making meaningful strides in your technical skills.
