            - heading "Job Description :" [level=2] [ref=f760e114]
            - paragraph [ref=f760e115]: As a Software Engineering Apprentice under the NATS program, you will undergo structured on-the-job training for 12 months. You will work closely with experienced engineers and mentors to contribute to real-world projects and build foundational skills in software development, testing, and system support within the eClinical and Imaging Business Units. You will gain exposure to and build foundational skills in domain-specific platforms, modern tools, SDLC, programming, and AI/automation frameworks.
            - generic:
              - insertion:
                - generic:
                  - iframe
            - paragraph [ref=f760e116]:
              - strong [ref=f760e117]: Key Responsibilities
            - list [ref=f760e118]:
              - listitem [ref=f760e119]: Participate in structured training modules and on-the-job learning assignments.
              - listitem [ref=f760e120]: Work under the guidance of assigned mentors/supervisors.
              - listitem [ref=f760e121]: Demonstrate learning agility, professionalism, and adherence to company policies.
              - listitem [ref=f760e122]: Collaborate with cross-functional teams to support project objectives.
              - listitem [ref=f760e123]: Work with programming tools and eClinical/Imaging systems.
              - listitem [ref=f760e124]: Support SDLC activities such as requirement gathering, documentation, testing, and deployment.
              - listitem [ref=f760e125]: Assist with guided coding in development, testing, debugging and validation activities.
              - listitem [ref=f760e126]: Support regression testing and issue tracking.
              - listitem [ref=f760e127]: Support development of scripts, workflows, and process optimization solutions
              - listitem [ref=f760e128]: Contribute to AI/automation initiatives using tools like Python, Selenium, or RPA platforms.
              - listitem [ref=f760e129]: Document processes, create reports, and maintain project logs.
              - listitem [ref=f760e130]: Participate in team meetings, code reviews, and knowledge-sharing sessions.
            - paragraph [ref=f760e131]:
              - strong [ref=f760e132]: Other
            - list [ref=f760e133]:
              - listitem [ref=f760e134]: Carries out any other reasonable duties as requested.
            - paragraph [ref=f760e135]:
