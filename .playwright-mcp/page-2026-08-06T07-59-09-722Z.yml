            - list [ref=f760e147]:
              - listitem [ref=f760e148]: Graduates in Software Engineering, Computer Science or related faculties, eligible under NATS, with strong interest in learning and applying skills in a professional environment.
              - listitem [ref=f760e149]: Foundational certificate in AI/ML, JavaScript, Python, SQL or relevant certification.
