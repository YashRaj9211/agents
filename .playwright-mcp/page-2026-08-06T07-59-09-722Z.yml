              - link "Software" [ref=f760e137] [cursor=pointer]
            - list [ref=f760e141]:
              - listitem [ref=f760e142]: Develop a strong understanding of the organization’s business model, clinical trial lifecycle, eClinical/Imaging platforms, tools, workflows, and standard operating procedures (SOPs).
              - listitem [ref=f760e143]: Build robust domain knowledge, technical capability, analytical thinking, and professional behaviour aligned with the business unit’s requirements.
              - listitem [ref=f760e144]: Effectively deliver assigned projects and tasks within defined timelines as part of the training program.
            - paragraph [ref=f760e145]:
