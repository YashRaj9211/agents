              - strong [ref=f2459e118]: Job Description:-
            - paragraph [ref=f2459e119]:
              - strong [ref=f2459e120]: "What you’ll be doing:"
            - list [ref=f2459e121]:
              - listitem [ref=f2459e122]: Develop Autonomous AI agents contributing to next-generation GPU System SW stack and tools
              - listitem [ref=f2459e123]: Developing AI agents adopting LLMs, multimodal models, and autonomous agent frameworks, ensuring robust and production-ready deployments.
              - listitem [ref=f2459e124]: Collaborate cross‑functionally with product, engineering, and research teams to ensure customer success and influence NVIDIA’s agentic AI roadmap.
              - listitem [ref=f2459e125]: Build architectures, best practices, and solution patterns for deploying AI agents at scale across NVIDIA and deliver best in class solution to the customers.
            - paragraph [ref=f2459e126]:
              - strong [ref=f2459e127]: "What we need to see:"
              - link "Computer Hardware" [ref=f2459e128] [cursor=pointer]
            - list [ref=f2459e132]:
              - listitem [ref=f2459e133]: Bachelor’s or Master’s degree in Computer Science, or related fields.
              - listitem [ref=f2459e134]: Strong programming skills in Python, C++, CUDA, and experience with deep learning frameworks (PyTorch and TensorFlow).
              - listitem [ref=f2459e135]: Knowledge on next generation of agentic AI systems—autonomous, reasoning‑driven agents capable of planning, collaborating, and executing complex tasks across diverse environments.
              - listitem [ref=f2459e136]: Hands on experience with any agentic frameworks (e.g., LangChain, LangGraph, CrewAI, OpenAI APIs).
              - listitem [ref=f2459e137]: Strong understanding of tool-use frameworks, database, retrieval systems, memory systems, and orchestration engines.
              - listitem [ref=f2459e138]: Background in AI safety, control systems, evaluation frameworks, or agent alignment.
            - paragraph [ref=f2459e139]:
              - strong [ref=f2459e140]: "Ways to stand out from the crowd:"
              - link "Software" [ref=f2459e141] [cursor=pointer]
            - list [ref=f2459e145]:
              - listitem [ref=f2459e146]: Demonstrated experience building or deploying agentic AI systems, LLM‑based agents, workflow orchestration, or multi‑agent frameworks in real‑world environments.
              - listitem [ref=f2459e147]: Prior contributions to open‑source AI ecosystems, including agent frameworks, LLM integrations, inference optimization, or GPU‑accelerated ML libraries.
