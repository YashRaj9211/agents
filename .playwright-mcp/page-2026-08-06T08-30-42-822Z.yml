              - listitem [ref=f2775e114]: Document code and contribute to technical documentation
              - listitem [ref=f2775e115]: Follow established development processes and version control practices
              - listitem [ref=f2775e116]: Debug and troubleshoot issues in development and test environments
              - listitem [ref=f2775e117]: Contribute to continuous improvement of team practices and processes
              - listitem [ref=f2775e118]: Perform other duties as assigned
              - listitem [ref=f2775e119]: Understand and adhere to all corporate policies to include but not limited to the ACI Code of Business Conduct and Ethics.
