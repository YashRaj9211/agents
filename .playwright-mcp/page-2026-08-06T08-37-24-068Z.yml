            - paragraph [ref=f3125e108]:
              - strong [ref=f3125e109]: "Educational Criteria:"
              - text: BE/B.Tech/BSC/MCA/MS/M.Tech or Related
            - paragraph [ref=f3125e110]:
              - strong [ref=f3125e111]: Batch
              - text: ": 2026/2025/2024/2023 or Any"
            - heading [level=3] [ref=f3125e112]:
              - strong [ref=f3125e113]: "Job Description:"
            - paragraph [ref=f3125e114]: As an Entry-Level Software Engineer (IC1), you will contribute to the development, testing, and maintenance of scalable software services. Working closely with senior engineers, you will build strong programming skills, apply core computer science fundamentals, and follow engineering best practices to deliver high-quality solutions.
            - paragraph [ref=f3125e115]: This role is ideal for candidates with solid knowledge of data structures, algorithms, and object-oriented programming who are eager to learn modern technologies and grow in a collaborative, fast-paced environment.
            - paragraph [ref=f3125e116]:
              - strong [ref=f3125e117]: 3. Key Responsibilities
            - list [ref=f3125e118]:
              - listitem [ref=f3125e119]: Design, develop, test, and maintain software components under the guidance of senior engineers.
              - listitem [ref=f3125e120]: Write clean, efficient, and well-documented code following established engineering standards.
              - listitem [ref=f3125e121]: Participate in code reviews and incorporate feedback to improve code quality.
              - listitem [ref=f3125e122]: Assist in building scalable services and applications while learning distributed systems concepts.
              - listitem [ref=f3125e123]: Troubleshoot issues, debug applications, and support ongoing improvements in system reliability and performance.
              - listitem [ref=f3125e124]: Collaborate with cross-functional teams to deliver features on time.
              - listitem [ref=f3125e125]: Continuously learn new technologies, tools, and development practices.
              - listitem [ref=f3125e126]: Contribute to team discussions and actively engage in improving engineering processes.
            - paragraph [ref=f3125e127]:
              - strong [ref=f3125e128]: 4. Qualifications & Skills
              - link "Civil Engineering" [ref=f3125e129] [cursor=pointer]
            - paragraph [ref=f3125e133]:
              - strong [ref=f3125e134]: Summary
            - list [ref=f3125e135]:
              - listitem [ref=f3125e136]: Bachelor’s or Master’s degree in Computer Science, Engineering, or a related field.
              - listitem [ref=f3125e137]: Strong programming fundamentals with proficiency in Java, Python, C&#43;&#43;, or a similar language.
              - listitem [ref=f3125e138]: Good understanding of data structures, algorithms, and object-oriented design.
              - listitem [ref=f3125e139]: Familiarity with software development concepts such as APIs, debugging, and version control (Git).
              - listitem [ref=f3125e140]: Strong problem-solving skills and attention to detail.
              - listitem [ref=f3125e141]: Good communication skills and willingness to learn in a team environment.
            - paragraph [ref=f3125e142]:
              - strong [ref=f3125e143]: Good-to-Have
            - list [ref=f3125e144]:
              - listitem [ref=f3125e145]: Internship experience or academic projects demonstrating strong coding ability.
              - listitem [ref=f3125e146]: Exposure to Cloud concepts, Big Data concepts or modern development tools.
              - listitem [ref=f3125e147]: Basic understanding of distributed systems or microservices.
              - listitem [ref=f3125e148]: Familiarity with databases (RDBMS).
              - listitem [ref=f3125e149]: Experience with open-source projects, hackathons, or competitive programming.
            - heading [level=4] [ref=f3125e150]:
              - strong [ref=f3125e151]: "How To Apply:"
            - paragraph [ref=f3125e152]:
              - text: The interested and eligible candidates can apply to the Oracle Off Campus Drive through online mode.
