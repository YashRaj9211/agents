            - heading [level=2] [ref=f292e111]:
              - strong [ref=f292e112]: "Job Description:"
            - paragraph [ref=f292e113]:
              - text: We are looking for a passionate and motivated full stack developer with experience in PHP and Angular to join our development team. The candidate will be responsible for developing, maintaining, and enhancing web applications, APIs, and backend services while collaborating with cross-functional teams to deliver high-quality solutions.
              - strong [ref=f292e114]: "Key Responsibilities:"
              - link "Recruitment & Staffing" [ref=f292e115] [cursor=pointer]
            - list [ref=f292e119]:
              - listitem [ref=f292e120]: Develop and maintain web applications using PHP and Angular.
              - listitem [ref=f292e121]: Design and develop REST APIs and backend services .
              - listitem [ref=f292e122]: Work with MySQL databases for query writing, optimization, and maintenance.
              - listitem [ref=f292e123]: Integrate third-party APIs and services.
              - listitem [ref=f292e124]: Debug, troubleshoot, and resolve application issues.
              - listitem [ref=f292e125]: Participate in code reviews and follow coding standards.
              - listitem [ref=f292e126]: Collaborate with frontend, backend, QA, and DevOps teams.
              - listitem [ref=f292e127]: Optimize application performance and scalability.
              - listitem [ref=f292e128]: Maintain proper documentation for development tasks and modules.
              - listitem [ref=f292e129]: Work on bug fixing, enhancements, and new feature development.
            - insertion [ref=f292e131]
            - heading "Qualifications" [level=3] [ref=f292e133]
            - heading "Minimum Qualifications" [level=4] [ref=f292e134]
            - list [ref=f292e135]:
              - listitem [ref=f292e136]: 6 Months to 1 Years of experience in full-stack development or working knowledge
              - listitem [ref=f292e137]: Strong knowledge of Core PHP and Hands-on experience with Angular.
              - listitem [ref=f292e138]: Good understanding of HTML, CSS, JavaScript, and TypeScript.
              - listitem [ref=f292e139]: Experience with MySQL database Knowledge of REST API development and integration.
              - listitem [ref=f292e140]: Familiarity with Git/version control systems.
              - listitem [ref=f292e141]: Basic understanding of Linux servers and deployment process.
              - listitem [ref=f292e142]: Good debugging and problem-solving skills Strong communication and teamwork abilities.
