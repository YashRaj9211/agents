                - heading "Full job description" [level=2] [ref=f9e825]
                - generic [ref=f9e827]:
                  - generic [ref=f9e828]:
                    - generic [ref=f9e829]: This role is for one of our clients
                    - generic [ref=f9e830]: "Company Name: ADOSX Tech"
                    - generic [ref=f9e831]: "Industry: Software Development"
                    - generic [ref=f9e832]: "Seniority level: Associate level"
                    - generic [ref=f9e833]:
                      - paragraph [ref=f9e834]: "Experience: 2+ yrs"
                      - paragraph [ref=f9e835]: "Location: Hyderabad, Telangana, India"
                      - paragraph [ref=f9e836]: "Job Type: Full-time"
                  - generic [ref=f9e837]:
                    - generic [ref=f9e839]:
                      - paragraph [ref=f9e840]: "As the first full-time engineer at ADOSX, you will build the foundations that future teams inherit. You are the engineer who turns the architecture into the product people touch. You work across the whole stack, Django and DRF on the back and Next.js and React on the front, and you own the features end to end. Where the architect owns the dangerous core, you own the breadth: shipping the features and screens that make the product usable day to day, and building the integrations that feed them. You build agentically. AI coding agents are part of your daily toolkit and a big reason you ship fast."
                      - paragraph [ref=f9e841]: You'll spend time inside dealerships, work closely with customers, and build systems grounded in operational reality—not assumptions.
                      - paragraph [ref=f9e842]: What you'll own
                      - paragraph [ref=f9e843]: "Features end-to-end : You take a feature from data model to API to UI without hand-offs: the Django models, the DRF endpoints, and the Next.js screens, each built cleanly within the architect's boundaries."
                      - paragraph [ref=f9e844]: "The in-house integrations : Build and maintain the integrations to the external systems. These are built in-house rather than bought, so you own the protocol quirks, the version drift, and the reliability."
                      - paragraph [ref=f9e845]: "The user-facing app : The Next.js and React front end: the dashboard shell, data tables, the AI chat surface, and the mobile-first screens for users who are often on a phone in the field."
                      - paragraph [ref=f9e846]: "Messaging and scheduled flows : The customer-messaging integration (inbound webhooks, queued outbound) and the scheduled jobs behind reminders, follow-ups, and daily insight delivery."
                      - paragraph [ref=f9e847]: "Quality on your surface area: Tests, sensible error handling, and never breaking tenant isolation or the audit trail, including when reviewing AI code."
                      - paragraph [ref=f9e848]: What we're looking for
                      - paragraph [ref=f9e849]: "Solid full-stack delivery : Django and DRF plus React and Next.js, comfortable owning a feature from database to UI on your own."
                      - paragraph [ref=f9e850]: "Agentic development as a habit: You use AI coding agents fluently to move faster, and you review their output as carefully as a teammate's. You have caught the subtle bugs they introduce."
                      - paragraph [ref=f9e851]: "Integration grit : You have wired up a fiddly third-party system and made it reliable, and you do not flinch at messy upstream formats."
                      - paragraph [ref=f9e852]: "PostgreSQL fluency : You write the tenant filter every time and understand why."
                      - paragraph [ref=f9e853]: "Pragmatic and shippy : You prefer a working, tested feature today over a perfect one next month, and you can estimate honestly."
                      - paragraph [ref=f9e854]: "A collaborator. You will pair with the team.Good to Have: Celery, or SQL exposure, curiosity about LLMs and agentic workflows, and comfort on the command line and with Git. Prior work integrating accounting, messaging, or other enterprise platforms across functions like HR, marketing, accounting and CRM."
                    - generic [ref=f9e855]:
                      - heading "About the company" [level=2] [ref=f9e856]
                      - generic [ref=f9e857]: ADOSX is building an AI-native operating system for automotive retail, combining agentic workflows, unified data, and real-time intelligence to help dealerships operate smarter and more profitably. Backed by strategic investors, we're redefining auto-tech from India.
                    - generic [ref=f9e858]:
                      - heading "Must-have skills" [level=2] [ref=f9e859]
                      - generic [ref=f9e860]: Python, ReactJS, Django
                    - generic [ref=f9e861]:
