            - generic [ref=f53e194]:
              - paragraph [ref=f53e195]: Job Description – MERN Stack Trainer
              - paragraph [ref=f53e196]: "Job Title: MERN Stack TrainerDepartment: Training & DevelopmentExperience: 6 Months – 2 Years (Training/Development)Employment Type: Full-TimeLocation: Mohali"
              - paragraph [ref=f53e197]: Job Summary
              - paragraph [ref=f53e198]: We are looking for a passionate and knowledgeable MERN Stack Trainer to train students and fresh graduates in Full Stack Web Development using the MERN Stack (MongoDB, Express.js, React.js, and Node.js). The ideal candidate should have strong technical knowledge, excellent communication skills, and the ability to guide learners through real-world projects and interview preparation.
              - paragraph [ref=f53e199]: Key Responsibilities
              - list [ref=f53e200]:
                - listitem [ref=f53e201]: Deliver classroom and online training on the MERN Stack.
                - listitem [ref=f53e202]: Teach HTML5, CSS3, JavaScript (ES6+), React.js, Node.js, Express.js, and MongoDB.
                - listitem [ref=f53e203]: Explain REST APIs, JWT Authentication, CRUD Operations, and MVC Architecture.
                - listitem [ref=f53e204]: Conduct coding sessions, assignments, and hands-on practical exercises.
                - listitem [ref=f53e205]: Guide students in developing real-time MERN projects.
                - listitem [ref=f53e206]: Review students' code and provide technical feedback.
                - listitem [ref=f53e207]: Assist students with debugging and problem-solving.
                - listitem [ref=f53e208]: Prepare interview questions, mock interviews, and placement support.
                - listitem [ref=f53e209]: Track student progress and maintain training reports.
                - listitem [ref=f53e210]: Stay updated with the latest web development technologies.
              - paragraph [ref=f53e211]: Required Skills
              - list [ref=f53e212]:
                - listitem [ref=f53e213]: Strong knowledge of HTML, CSS, JavaScript (ES6+).
                - listitem [ref=f53e214]: Good understanding of React.js, Hooks, Redux/Context API.
                - listitem [ref=f53e215]: Experience with Node.js, Express.js, MongoDB, and Mongoose.
                - listitem [ref=f53e216]: Knowledge of REST APIs and Authentication (JWT).
                - listitem [ref=f53e217]: Git & GitHub version control.
                - listitem [ref=f53e218]: Postman for API testing.
                - listitem [ref=f53e219]: Understanding of MVC Architecture.
                - listitem [ref=f53e220]: Excellent communication and presentation skills.
              - paragraph [ref=f53e221]: Preferred Qualifications
              - list [ref=f53e222]:
                - listitem [ref=f53e223]: Bachelor's degree in Computer Science, IT, or a related field.
                - listitem [ref=f53e224]: Experience in teaching or mentoring students is preferred.
                - listitem [ref=f53e225]: Knowledge of deployment platforms like Render, Vercel, or Netlify is an advantage.
                - listitem [ref=f53e226]: Familiarity with TypeScript, Next.js, or Docker is a plus.
              - paragraph [ref=f53e227]: Responsibilities Beyond Training
              - list [ref=f53e228]:
                - listitem [ref=f53e229]: Develop training materials and assignments.
                - listitem [ref=f53e230]: Conduct technical assessments.
                - listitem [ref=f53e231]: Support placement activities and interview preparation.
                - listitem [ref=f53e232]: Encourage best coding practices and clean code standards.
              - paragraph [ref=f53e233]: What We Offer
              - list [ref=f53e234]:
                - listitem [ref=f53e235]: Competitive salary.
                - listitem [ref=f53e236]: Career growth opportunities.
                - listitem [ref=f53e237]: Friendly and collaborative work environment.
                - listitem [ref=f53e238]: Opportunity to mentor aspiring developers.
                - listitem [ref=f53e239]: Exposure to real-world projects and modern technologies.
              - paragraph [ref=f53e240]: "Skills: HTML5, CSS3, JavaScript, ES6+, React.js, Redux, Node.js, Express.js, MongoDB, Mongoose, REST API, JWT, Git, GitHub, Postman, MVC Architecture, Problem Solving, Communication Skills."
