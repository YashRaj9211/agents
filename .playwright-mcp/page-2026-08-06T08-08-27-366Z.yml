              - text: We are seeking an Associate Software Engineer who has graduated with a minimum of 60% in B.E/B.Tech not earlier than 2022. The candidate should have obtained at least 60% marks Class XII and Class X as well. The ideal candidate will have a good understanding of subjects studied during the course work. He/she should be a quick learner and go-getter who is willing to commit to 2 years with the organization. Reasonable programming skills in either of Python, Java or Angular would be helpful. Any exposure to AI/ML, Big
