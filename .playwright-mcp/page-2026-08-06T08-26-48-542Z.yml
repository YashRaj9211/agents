            - heading "Job Description:" [level=3] [ref=f2487e101]
            - paragraph [ref=f2487e102]:
              - text: The Risk Solutions Technology Graduate Program is a 12-month experience with two six-month rotations. Participants gain hands-on experience in big
              - link "data" [ref=f2487e103] [cursor=pointer]:
                - /url: "#"
              - text: ", AI, SRE, DevOps, testing and security"
              - link "engineering" [ref=f2487e106] [cursor=pointer]:
                - /url: "#"
              - text: . They also get exposure to leading cloud platforms like AWS and Azure. The program focuses on technical and personal development, offering mentorship, performance feedback, and extensive training. Emphasis is placed on utilizing data for good, supporting key markets in insurance, healthcare, and government, and contributing to innovative product development.
              - link "Computer Science" [ref=f2487e109] [cursor=pointer]
            - paragraph [ref=f2487e113]:
              - strong [ref=f2487e114]: Responsibilities
            - list [ref=f2487e115]:
              - listitem [ref=f2487e116]: Writing and reviewing portions of detailed specifications for developing system components of simple complexity.
              - listitem [ref=f2487e117]: Implementing successful development processes, coding best practices, and code reviews under senior-level engineers’ guidance.
              - listitem [ref=f2487e118]: Operating in various development environments and collaborating with key stakeholders.
              - listitem [ref=f2487e119]: Completing simple bug fixes and applying knowledge of test-driven development.
              - listitem [ref=f2487e120]: Collaborating with stakeholders to gather and analyze requirements for software development projects.
              - listitem [ref=f2487e121]: Resolving basic technical issues and staying updated on new technology developments.
              - listitem [ref=f2487e122]: Demonstrating basic knowledge of software development methodologies and data manipulation languages.
              - listitem [ref=f2487e123]: Understanding data modeling principles and applicable development languages.
            - paragraph [ref=f2487e124]:
              - strong [ref=f2487e125]: Requirements
            - list [ref=f2487e126]:
              - listitem [ref=f2487e127]:
                - strong [ref=f2487e128]: Applicants must have a graduation date Before July 2026to be considered.
              - listitem [ref=f2487e129]: Have completed or will complete a bachelor’s in Computer Science or a related field of study.
              - listitem [ref=f2487e130]: Possess excellent communication skills, both written and verbal, to effectively collaborate with team members.
              - listitem [ref=f2487e131]: Be proficient in development languages such as Java/J2EE, Python, JavaScript, JSP, C/C++, HTML, XML, SQL, Windows, Linux, and .Net.
              - listitem [ref=f2487e132]: Be familiar with software development methodologies (e.g., Agile, Waterfall).
              - listitem [ref=f2487e133]: Be knowledgeable about data manipulation languages and data modeling principles.
              - listitem [ref=f2487e134]: Have the ability and desire to learn new processes and technologies.
              - listitem [ref=f2487e135]: Be knowledgeable about test-driven development.
            - heading [level=4] [ref=f2487e136]:
              - strong [ref=f2487e137]: "How To Apply:"
