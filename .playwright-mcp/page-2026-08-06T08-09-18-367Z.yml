              - strong [ref=f1435e213]:
                - text: "Ref :"
                - link "LinkedIn" [ref=f1435e214] [cursor=pointer]:
                  - /url: https://www.linkedin.com/jobs/view/4423915756/
            - paragraph [ref=f1435e215]:
              - emphasis [ref=f1435e216]: "Note: Applications are processed on a first-come, first-served basis. Apply early to avoid missing out."
            - heading "Frequently Asked Questions (FAQs)" [level=2] [ref=f1435e217]
            - paragraph [ref=f1435e218]:
              - strong [ref=f1435e219]: 1. Who can apply for the Zensar 2026 Off Campus Drive?
              - text: Graduates from the 2025 and 2026 batches with a BE/B.Tech in Computer Science are eligible to apply.
              - link "Jobs" [ref=f1435e220] [cursor=pointer]
            - paragraph [ref=f1435e224]:
              - strong [ref=f1435e225]: 2. What is the job location for this role?
              - text: The job locations include Pune, Bangalore, Hyderabad, Kolkata, and Chennai.
            - paragraph [ref=f1435e226]:
              - strong [ref=f1435e227]: 3. Is there any bond or service agreement?
              - text: Details regarding service agreements (if any) will be disclosed during the HR interview or in the offer letter.
            - paragraph [ref=f1435e228]:
              - strong [ref=f1435e229]: 4. What is Agentic Engineering mentioned in the description?
              - text: Agentic Engineering refers to the design of systems where AI agents perform autonomous tasks. Zensar is looking for candidates who understand this emerging paradigm.
            - insertion [ref=f1435e231]
