            - heading "Job Description & Technical Requirements" [level=2] [ref=f1435e134]
            - paragraph [ref=f1435e135]:
              - text: As a Junior Software Engineer at Zensar, you will be part of a team that builds innovative digital products. The company is looking for candidates with a strong academic background and a passion for problem-solving.
              - link "Engineering & Technology" [ref=f1435e136] [cursor=pointer]
            - generic [ref=f1435e142]:
              - generic [ref=f1435e143]:
                - generic [ref=f1435e144]: WhatsApp Channel
                - link "Join Now" [ref=f1435e146] [cursor=pointer]:
                  - /url: https://chat.whatsapp.com/LD7u8YPDaP7JDTDrnpwNNP
              - generic [ref=f1435e147]:
                - generic [ref=f1435e148]: Telegram Channel
                - link "Join Now" [ref=f1435e150] [cursor=pointer]:
                  - /url: https://telegram.me/campusdrivejobs
            - list [ref=f1435e151]:
              - listitem [ref=f1435e152]:
                - strong [ref=f1435e153]: "Core Skills:"
                - text: Proficient in Sound Coding Principles, Data Structures, and Algorithms (DSA).
              - listitem [ref=f1435e154]:
                - strong [ref=f1435e155]: "Emerging Tech:"
                - text: An understanding of
                - strong [ref=f1435e156]: Agentic Engineering
                - text: and modern AI-driven workflows.
              - listitem [ref=f1435e157]:
                - strong [ref=f1435e158]: "Data Proficiency:"
                - text: A strong background in data handling and analytical thinking.
              - listitem [ref=f1435e159]:
                - strong [ref=f1435e160]: "Problem Solving:"
                - text: Ability to tackle complex logical challenges and provide efficient solutions.
              - listitem [ref=f1435e161]:
                - strong [ref=f1435e162]: "Academic Pedigree:"
                - text: Candidates must have a strong academic record from a reputable institution.
            - heading "Roles and Responsibilities" [level=2] [ref=f1435e163]
            - paragraph [ref=f1435e164]:
              - text: "Selected candidates will be responsible for the following tasks:"
              - link "Computer Science" [ref=f1435e165] [cursor=pointer]
            - list [ref=f1435e169]:
              - listitem [ref=f1435e170]: Developing and maintaining software applications using modern programming languages.
              - listitem [ref=f1435e171]: Collaborating with cross-functional teams to understand system requirements.
              - listitem [ref=f1435e172]: Communicating technical ideas, outcomes, and system behaviors clearly to both technical and non-technical stakeholders.
              - listitem [ref=f1435e173]: Participating in code reviews and ensuring high-quality software delivery.
              - listitem [ref=f1435e174]: Continuously learning and adapting to new technologies and tools.
            - heading "Eligibility Criteria for Zensar Off Campus Drive" [level=2] [ref=f1435e175]
            - list [ref=f1435e176]:
              - listitem [ref=f1435e177]:
                - strong [ref=f1435e178]: "Education:"
                - text: BE/B.Tech in Computer Science or related fields.
              - listitem [ref=f1435e179]:
                - strong [ref=f1435e180]: "Graduation Year:"
                - text: Only 2025 and 2026 batch students are eligible.
              - listitem [ref=f1435e181]:
                - strong [ref=f1435e182]: "Soft Skills:"
                - text: Excellent interpersonal and communication skills.
              - listitem [ref=f1435e183]:
                - strong [ref=f1435e184]: "Teamwork:"
                - text: Ability to work effectively in a team-oriented environment.
              - listitem [ref=f1435e185]:
                - strong [ref=f1435e186]: "Adaptability:"
                - text: Willingness to work from any of Zensar’s office locations (Pune, Bangalore, Hyderabad, Kolkata, or Chennai).
            - heading "Zensar Selection Process" [level=2] [ref=f1435e187]
            - paragraph [ref=f1435e188]:
              - text: "The recruitment process for the Zensar Off Campus Drive 2026 consists of three main stages:"
              - link "Enterprise Technology" [ref=f1435e189] [cursor=pointer]
            - insertion [ref=f1435e194]
            - list [ref=f1435e196]:
              - listitem [ref=f1435e197]:
                - strong [ref=f1435e198]: "Online Assessment Test:"
                - text: This includes Aptitude, Logical Reasoning, and Technical Coding questions (DSA based).
              - listitem [ref=f1435e199]:
                - strong [ref=f1435e200]: "Technical Discussion:"
                - text: A face-to-face or virtual interview focusing on your coding skills, projects, and core CS fundamentals.
              - listitem [ref=f1435e201]:
                - strong [ref=f1435e202]: "HR Interview:"
                - text: A final round to assess cultural fit, communication, and career aspirations.
            - heading "How to Apply for Zensar Off Campus Drive 2026?" [level=2] [ref=f1435e203]
            - paragraph [ref=f1435e204]:
              - text: Interested and eligible candidates should apply through the official Zensar careers portal or the registration link provided below. Ensure your resume highlights your coding skills and any projects related to Data Structures or AI.
              - link "Recruitment & Staffing" [ref=f1435e205] [cursor=pointer]
            - link "Click Here to Register for Zensar Drive" [ref=f1435e211] [cursor=pointer]:
              - /url: https://fa-etvl-saasfaprod1.fa.ocs.oraclecloud.com/hcmUI/CandidateExperience/en/sites/CX_1/job/145691/?utm_medium=jobshare&utm_source=External+Job+Share
