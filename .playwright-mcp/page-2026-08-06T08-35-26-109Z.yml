            - paragraph [ref=f3009e114]:
              - text: At the Digital Integration competency of PwC India, we focus on delivering tech led solutions for the business transformation of our clients. We are a tech-native team of more than 1000 professionals with significant depth of expertise and experience in several contemporary and relevant technologies that enable us to deliver the right technology solutions and meaningful outcomes.
              - link "IT & Technical Jobs" [ref=f3009e115] [cursor=pointer]
            - paragraph [ref=f3009e119]: Once you become part of this team, you will focus on taking up such challenging assignments to deliver appropriate solutions to the complex problems. Alongside delivering world class solutions, there will be ample opportunities for you to learn new technologies, tinker those and innovate and grow in your career as a successful professional.
            - generic:
