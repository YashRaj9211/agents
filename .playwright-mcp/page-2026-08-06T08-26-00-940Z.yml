            - paragraph
            - heading "Frequently Asked Questions (FAQs)" [level=2] [ref=f2426e160]
            - heading "1. Who is eligible for the GoTo Off Campus Drive 2026?" [level=3] [ref=f2426e161]
            - paragraph [ref=f2426e162]: Graduates from the 2025 and 2026 batches with a degree in BE, B.Tech, BSC, MCA, MS, or MTech are eligible to apply. Freshers and those with up to 2 years of experience can participate.
            - heading "2. Is this a remote position?" [level=3] [ref=f2426e163]
            - paragraph [ref=f2426e164]:
              - text: Yes, the Associate Software Engineer role at GoTo is currently listed as a remote position, allowing you to work from anywhere.
              - link "Libraries" [ref=f2426e165] [cursor=pointer]
            - heading "3. What skills are required for this role?" [level=3] [ref=f2426e169]
            - paragraph [ref=f2426e170]: The primary focus is on Salesforce development. Key skills include Apex, Lightning Components, SOQL/SOSL, and an understanding of Salesforce architecture and CI/CD processes.
            - heading "4. Are Salesforce certifications mandatory?" [level=3] [ref=f2426e171]
            - paragraph [ref=f2426e172]:
              - text: While Salesforce certifications are listed as a preferred qualification, they are not strictly mandatory if you have strong project or internship experience in the field.
              - link "Programming" [ref=f2426e173] [cursor=pointer]
            - insertion [ref=f2426e178]
            - heading "5. What is the selection process?" [level=3] [ref=f2426e180]
            - paragraph [ref=f2426e181]:
              - text: Typically, the process involves an initial resume screening, followed by a technical assessment (coding/Salesforce concepts), and multiple rounds of technical and HR interviews.
              - link "Management" [ref=f2426e182] [cursor=pointer]
