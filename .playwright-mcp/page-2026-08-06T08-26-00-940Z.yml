            - paragraph
            - heading "What We’re Looking For" [level=3] [ref=f2426e135]
            - paragraph [ref=f2426e136]:
              - text: "As an Associate Salesforce Engineer, your background will look like:"
              - link "Civil Engineering" [ref=f2426e137] [cursor=pointer]
            - list [ref=f2426e141]:
              - listitem [ref=f2426e142]: Bachelor’s degree or equivalent in Computer Science, Electrical Engineering, or a related field is preferred.
              - listitem [ref=f2426e143]: Candidates graduating between 2025 and 2026 are eligible.
              - listitem [ref=f2426e144]: Course work, project based, or internship experience developing on the Salesforce platform (Apex, Lightning Components, Visualforce, SOQL/SOSL)
              - listitem [ref=f2426e145]: Understanding of Salesforce architecture, best practices, and data security
              - listitem [ref=f2426e146]: Experience with Salesforce integrations (REST/SOAP APIs, middleware, external systems)
              - listitem [ref=f2426e147]: Strong problem-solving and troubleshooting abilities for complex Salesforce environments
              - listitem [ref=f2426e148]: Familiarity with code versioning tools (e.g., Git), CI/CD processes, and code review practices
              - listitem [ref=f2426e149]: Ability to communicate technical concepts as part of a global team
              - listitem [ref=f2426e150]: Salesforce certifications
            - paragraph
            - heading "How to Apply for GoTo Recruitment 2026" [level=2] [ref=f2426e151]
            - paragraph [ref=f2426e152]:
              - text: Interested and eligible graduates can register for the Associate Software Engineer Freshers opening by visiting the official GoTo Careers page. Ensure your resume highlights your Salesforce projects and any relevant certifications.
              - link "Career Resources & Planning" [ref=f2426e153] [cursor=pointer]
            - paragraph [ref=f2426e157]:
              - strong [ref=f2426e158]: "Apply Link:"
              - link "Click Here to Apply" [ref=f2426e159] [cursor=pointer]:
