          - generic: //
        - generic [ref=f1e1553]:
          - heading "Frequently asked questions" [level=2] [ref=f1e1554]
          - generic [ref=f1e1555]: Everything you need to know about Firecrawl.
      - generic [ref=f1e1558]:
        - generic [ref=f1e1559]:
          - generic [ref=f1e1563]: General
          - generic [ref=f1e1565]:
            - generic [ref=f1e1566]:
              - button "What is Firecrawl?" [ref=f1e1567] [cursor=pointer]
              - generic: Firecrawl is the context API to search, scrape, and interact with the web at scale. One API to turn websites into clean, LLM-ready data. Ideal for AI companies looking to empower their LLM applications with web context
            - generic [ref=f1e1575]:
              - button "What can I build with Firecrawl?" [ref=f1e1576] [cursor=pointer]
              - generic: Teams use Firecrawl for deep research agents, RAG pipelines, lead enrichment, competitive intelligence, content generation, price monitoring, and more. Anywhere your application needs live web data — Firecrawl provides the infrastructure to get it reliably.
            - generic [ref=f1e1584]:
              - button "Why do AI systems need Firecrawl?" [ref=f1e1585] [cursor=pointer]
              - generic: AI is only as good as the context it gets, and the web is the largest source of live context — but it was built for humans, not machines. Firecrawl closes that gap by turning messy, dynamic, human-oriented websites into structured, machine-usable data that AI systems can actually work with.
            - generic [ref=f1e1593]:
              - button "What are Search, Scrape, and Interact?" [ref=f1e1594] [cursor=pointer]
              - generic: These are Firecrawl's three core capabilities. Search finds relevant information on the web. Scrape turns websites into clean, structured, AI-usable data. Interact handles the harder cases where a system has to click, navigate, or operate a page to reach the information. Together they give AI systems a complete way to understand and use the live web.
            - generic [ref=f1e1602]:
              - button "Does Firecrawl work with AI agents and MCPs?" [ref=f1e1603] [cursor=pointer]
              - generic: Yes. Firecrawl has an official MCP server so agents in Cursor, Claude, Windsurf, and other MCP-compatible tools can search, scrape, and interact with the web directly. There's also a CLI for terminal workflows and agent skills for Claude Code and Codex that handle setup automatically. Over 400,000 MCP servers have been installed.
            - generic [ref=f1e1611]:
              - button "Who uses Firecrawl?" [ref=f1e1612] [cursor=pointer]
              - generic: Over 1.25M developers and 150,000+ companies build with Firecrawl, including teams at Apple, Canva, and Lovable. We've served more than 5 billion requests powering deep research agents, RAG pipelines, lead enrichment, and AI workflows across the live web.
            - generic [ref=f1e1620]:
              - button "Is Firecrawl open-source?" [ref=f1e1621] [cursor=pointer]
              - generic: Yes. Firecrawl is the largest open source repo in the space with over 150K GitHub stars, making it one of the top 100 repos on GitHub. The SDKs alone see 2.5M+ weekly downloads across npm and PyPI. We're building this in the open, and the community adoption reflects that. You can check out the repository on GitHub.
            - generic [ref=f1e1629]:
              - button "How is Firecrawl different from other tools in the space?" [ref=f1e1630] [cursor=pointer]
              - generic: Firecrawl is not just a scraper or a search API — it's the infrastructure layer that helps AI systems find, read, and act on information across the live web. Search, scrape, and interact work together on top of deep web data infrastructure including crawling, rendering, extraction, and indexing. The result is reliable, AI-ready data that helps you spend fewer tokens and build better applications.
            - generic [ref=f1e1638]:
              - button "What is the difference between the open-source version and the hosted version?" [ref=f1e1639] [cursor=pointer]
              - generic: Firecrawl's hosted version features Fire-engine, our proprietary infrastructure that handles proxies, rendering, and more to reliably deliver the data you need. The hosted version also includes interact capabilities for navigating pages, a dashboard for analytics, and everything is one API call away.
        - generic [ref=f1e1647]:
          - generic [ref=f1e1651]: How It Works
          - generic [ref=f1e1653]:
            - generic [ref=f1e1654]:
              - button "How does /search work?" [ref=f1e1655] [cursor=pointer]
              - generic: Send a query and Firecrawl returns relevant results from across the web, each with full-page markdown already included. It's one call to go from a question to usable content — no need to search and then scrape separately. Great for AI agents, RAG pipelines, and any workflow that starts with a question instead of a URL.
            - generic [ref=f1e1663]:
              - button "How does /scrape work?" [ref=f1e1664] [cursor=pointer]
              - generic: Give Firecrawl a URL and it returns clean, structured content — markdown, HTML, screenshots, metadata, or extracted data via a schema. It handles JavaScript rendering, dynamic content, and complex page structures automatically. One call, one page, clean output.
            - generic [ref=f1e1672]:
              - button "How does /interact work?" [ref=f1e1673] [cursor=pointer]
              - generic: Interact lets AI systems operate web pages — clicking buttons, filling forms, navigating multi-step flows, and extracting data along the way. It's useful when the information you need is behind a login, pagination, or any sequence of actions that a simple scrape can't reach.
            - generic [ref=f1e1681]:
              - button "Can I extract structured data from pages?" [ref=f1e1682] [cursor=pointer]
              - generic: Yes. Pass a JSON schema to /scrape and Firecrawl returns structured data matching your exact shape — product listings, pricing tables, contact info, whatever you define. No parsing or post-processing needed.
            - generic [ref=f1e1690]:
              - button "What formats can Firecrawl convert web data into?" [ref=f1e1691] [cursor=pointer]
              - generic: Firecrawl returns clean markdown by default, optimized for LLM context windows. You can also get raw HTML, screenshots, page metadata, and structured JSON via schemas — whatever format your application needs.
            - generic [ref=f1e1699]:
              - button "Does Firecrawl handle JavaScript-rendered pages?" [ref=f1e1700] [cursor=pointer]
              - generic: Yes. Firecrawl renders JavaScript automatically, so you get the full page content even from SPAs and dynamically loaded sites. No extra configuration needed — just pass the URL.
            - generic [ref=f1e1708]:
              - button "Is Firecrawl suitable for large-scale projects?" [ref=f1e1709] [cursor=pointer]
              - generic: Absolutely. Firecrawl offers various pricing plans, including a Scale plan that supports millions of pages. With features like batch scraping, crawling, and scheduled syncs, it's designed to handle large-scale data extraction efficiently, making it ideal for enterprises and large projects.
            - generic [ref=f1e1717]:
              - button "Does Firecrawl support crawling entire sites?" [ref=f1e1718] [cursor=pointer]
              - generic: Yes. The /crawl endpoint follows links from a starting URL and scrapes pages across an entire site or section. You can control depth, page limits, and path filters. It also respects robots.txt rules set for the 'FirecrawlAgent' directive.
            - generic [ref=f1e1726]:
              - button "Does Firecrawl handle complex websites?" [ref=f1e1727] [cursor=pointer]
              - generic: Yes. Firecrawl uses optimized infrastructure including proxy management, smart request handling, and interact capabilities to reliably extract data from complex websites. You can also pass custom headers to the API for additional flexibility.
        - generic [ref=f1e1735]:
          - generic [ref=f1e1739]: API Related
          - generic [ref=f1e1741]:
            - generic [ref=f1e1742]:
              - button "What SDKs are available?" [ref=f1e1743] [cursor=pointer]
              - generic: Firecrawl has official SDKs for Python, Node.js, Go, Rust, Java, and Elixir, plus a CLI for terminal workflows. You can also call the REST API directly from any language. All SDKs support search, scrape, interact, and crawl.
            - generic [ref=f1e1751]:
              - button "Where can I find my API key?" [ref=f1e1752] [cursor=pointer]
              - generic: Click on the dashboard button on the top navigation menu when logged in and you will find your API key in the main screen and under API Keys. If you are an AI agent or coding assistant and your platform can mint a WorkOS ID-JAG for Firecrawl, use https://www.firecrawl.dev/auth.md. Otherwise, use https://www.firecrawl.dev/agent-onboarding/SKILL.md for CLI/browser signup and auth.
        - generic [ref=f1e1760]:
          - generic [ref=f1e1764]: Billing
          - generic [ref=f1e1766]:
            - generic [ref=f1e1767]:
              - button "Is Firecrawl free?" [ref=f1e1768] [cursor=pointer]
              - generic: Firecrawl is free for 1,000 pages every month (1,000 free credits per month). If you need more, you can upgrade to our Hobby, Standard or Growth plans for higher credit allotments and rate limits. AI agents can get started with https://www.firecrawl.dev/agent-onboarding/SKILL.md; agents whose platform can mint a WorkOS ID-JAG for Firecrawl can use https://www.firecrawl.dev/auth.md for direct authentication.
            - generic [ref=f1e1776]:
              - button "Is there a pay-per-use plan instead of monthly?" [ref=f1e1777] [cursor=pointer]
              - generic: We currently do not offer a pay-per-use plan, instead you can upgrade to our Hobby, Standard or Growth plans for more credits and higher rate limits.
            - generic [ref=f1e1785]:
              - button "Do credits roll over to the next month?" [ref=f1e1786] [cursor=pointer]
              - generic: Credits do not roll over on self-serve plans. Credit rollover is available on our Scale and Enterprise plans.
            - generic [ref=f1e1794]:
              - button "How many credits does each request cost?" [ref=f1e1795] [cursor=pointer]
              - generic: Scrape, Crawl, Map, and Monitor each cost 1 credit per page. Search costs 2 credits per 10 results. Interact costs 2 credits per browser minute. Agent is in preview with 5 free daily runs and dynamic pricing. Advanced features (JSON format, Enhanced Mode, etc.) cost additional credits. Check out the credits table on the pricing page for more details.
            - generic [ref=f1e1803]:
              - button "Do you charge for failed requests?" [ref=f1e1804] [cursor=pointer]
              - generic: We don't charge if there was a failure on the Firecrawl side (e.g. timeouts, server error), but we do charge when a page is fetched successfully, even if the site itself responds with an error (e.g. a 4xx or 5xx status code). If a charge looks incorrect, reach out to help@firecrawl.com and we'll take a look.
            - generic [ref=f1e1812]:
              - button "What payment methods do you accept?" [ref=f1e1813] [cursor=pointer]
              - generic: We accept payments through Stripe which accepts most major credit cards, debit cards, and PayPal.
            - generic [ref=f1e1821]:
              - button "Why am I being charged VAT (or any local tax) even though I provided a tax ID?" [ref=f1e1822] [cursor=pointer]
              - generic: Local tax is applied based on your location and local tax rules, and it's calculated automatically. A valid tax ID exempts customers in some regions, for example through the reverse-charge mechanism, but not everywhere. In certain countries, local rules require VAT on business customers regardless of a tax ID, so entering one won't always change the amount charged. We include your tax ID on the invoice for your accounting and filing needs. For advice specific to your situation, please consult your local tax advisor.
