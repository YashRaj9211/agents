            - heading [level=2] [ref=e111]:
              - strong [ref=e112]: "Job Description:"
            - paragraph [ref=e113]:
              - text: We are looking for a passionate and motivated full stack developer with experience in PHP and Angular to join our development team. The candidate will be responsible for developing, maintaining, and enhancing web applications, APIs, and backend services while collaborating with cross-functional teams to deliver high-quality solutions.
              - strong [ref=e114]: "Key Responsibilities:"
              - link "Recruitment & Staffing" [ref=e115] [cursor=pointer]
            - list [ref=e119]:
              - listitem [ref=e120]: Develop and maintain web applications using PHP and Angular.
              - listitem [ref=e121]: Design and develop REST APIs and backend services .
              - listitem [ref=e122]: Work with MySQL databases for query writing, optimization, and maintenance.
              - listitem [ref=e123]: Integrate third-party APIs and services.
              - listitem [ref=e124]: Debug, troubleshoot, and resolve application issues.
              - listitem [ref=e125]: Participate in code reviews and follow coding standards.
              - listitem [ref=e126]: Collaborate with frontend, backend, QA, and DevOps teams.
              - listitem [ref=e127]: Optimize application performance and scalability.
              - listitem [ref=e128]: Maintain proper documentation for development tasks and modules.
              - listitem [ref=e129]: Work on bug fixing, enhancements, and new feature development.
            - insertion [ref=e131]
            - heading "Qualifications" [level=3] [ref=e133]
            - heading "Minimum Qualifications" [level=4] [ref=e134]
            - list [ref=e135]:
              - listitem [ref=e136]: 6 Months to 1 Years of experience in full-stack development or working knowledge
              - listitem [ref=e137]: Strong knowledge of Core PHP and Hands-on experience with Angular.
              - listitem [ref=e138]: Good understanding of HTML, CSS, JavaScript, and TypeScript.
              - listitem [ref=e139]: Experience with MySQL database Knowledge of REST API development and integration.
              - listitem [ref=e140]: Familiarity with Git/version control systems.
              - listitem [ref=e141]: Basic understanding of Linux servers and deployment process.
              - listitem [ref=e142]: Good debugging and problem-solving skills Strong communication and teamwork abilities.
