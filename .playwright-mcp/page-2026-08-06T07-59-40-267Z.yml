            - heading [level=2] [ref=f805e117]:
              - strong [ref=f805e118]: "Job Description:"
            - paragraph [ref=f805e119]: "ProfileSummary:"
            - list [ref=f805e120]:
              - listitem [ref=f805e121]: Seeking Software Developers with strong Python skills to support the implementation of scalable AI use cases using an enterprise AI platform. This role is ideal for early‑career engineers eager to grow in applied AI development while working under the mentorship of Senior AI Engineers.
            - paragraph [ref=f805e122]: "Key Responsibilities:"
            - list [ref=f805e123]:
              - listitem [ref=f805e124]: Develop and integrate Python-based components for AI use cases following established designs and best practices.
              - listitem [ref=f805e125]: Support AI/ML workflows including data preparation, model integration, and API-based consumption.
              - listitem [ref=f805e126]: Implement and support RAG-based pipelines, including understanding of LLMs, chunking strategies, embeddings, and vector retrieval under guidance.
              - listitem [ref=f805e127]: Collaborate with Senior AI Engineers to build scalable, reliable, and maintainable AI solutions.
              - listitem [ref=f805e128]: Assist in testing, debugging, documentation, and deployment of AI-enabled applications.
              - listitem [ref=f805e129]: Learn and apply cloud, AI, and software engineering best practices through hands-on project work and mentorship.
            - paragraph [ref=f805e130]: "Experience:"
            - insertion [ref=f805e132]
            - paragraph [ref=f805e134]:
              - text: 0 – 2 years of strong programming skills
              - link "Jobs" [ref=f805e135] [cursor=pointer]
            - paragraph [ref=f805e139]: "Technical Skills:"
            - list [ref=f805e140]:
              - listitem [ref=f805e141]: Strong Python programming with solid software development fundamentals
              - listitem [ref=f805e142]: Basic understanding of AI/ML concepts and applied AI use cases
              - listitem [ref=f805e143]: Familiarity with REST APIs, data handling, and modular code design
              - listitem [ref=f805e144]: Exposure to cloud platforms and modern development tools with a strong learning mindset
