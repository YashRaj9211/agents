            - heading "Job Description :" [level=2] [ref=f2953e97]
            - heading "Job Purpose and Impact" [level=4] [ref=f2953e98]
            - list [ref=f2953e99]:
              - listitem [ref=f2953e100]:
                - text: The Associate Professional,
                - link "Software" [ref=f2953e101] [cursor=pointer]:
                  - /url: "#"
                - text: Engineering job assists with designing, developing and maintaining software applications and systems. Under close supervision, this job collaborates with cross functional teams to help implement new software features to meet user needs and business goals and upgrade existing software to improve performance and functionality through writing clean, efficient and scalable code and troubleshooting and debugging standard issues. This job also participates in code reviews to maintain high code quality and learn from software engineering team members.
            - heading "Key Accountabilities" [level=4] [ref=f2953e104]
            - list [ref=f2953e105]:
              - listitem [ref=f2953e106]: "SOFTWARE DEVELOPMENT: Assists with designing and developing high quality software solutions by writing clean, maintainable and efficient codes."
              - listitem [ref=f2953e107]: "AUTOMATION: Partners to apply internal software deployment platform, methodologies and tools to automate the deployment process, ensuring smooth and reliable releases."
              - listitem [ref=f2953e108]:
                - text: "COLLABORATION: Coordinates cross functional team of product managers, designers, architects, and other"
                - link "engineers" [ref=f2953e109] [cursor=pointer]:
                  - /url: "#"
                - text: to help gather requirements and deliver resolutions that meet business needs and deliver cybersecurity goals.
              - listitem [ref=f2953e112]: "TESTING & DEBUGGING: Writes and maintains standard unit tests and integration tests, and performs debugging to maintain the quality and performance of the software."
              - listitem [ref=f2953e113]: "CONTINUOUS IMPROVEMENT: Makes suggestions for improving the software development and deployment processes, and partners to implement the approved standards to improve efficiency and reliability."
              - listitem [ref=f2953e114]: "DOCUMENTATION: Maintains comprehensive documentation for software applications, deployment processes and system configurations."
              - listitem [ref=f2953e115]: "TECHNICAL SUPPORT: Provides technical support and troubleshooting for standard issues with deployed applications to ensure minimal downtime and fast resolution."
            - heading "Qualifications" [level=4] [ref=f2953e116]
            - list [ref=f2953e117]:
              - listitem [ref=f2953e118]: No minimum years of relevant experience required. Typically reflects 2 years or more of relevant experience.
