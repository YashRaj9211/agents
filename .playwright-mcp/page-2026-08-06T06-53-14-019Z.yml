            - generic [ref=f45e206]:
              - paragraph [ref=f45e207]: About Us
              - paragraph [ref=f45e208]: Holiday Tribe is building India’s first AI-powered self-planning travel platform. We combine conversational interfaces with real-time booking integrations to let travelers plan and book entire trips in minutes.
              - paragraph [ref=f45e209]: We’re looking for a Lead Developer who can help us build high-performance APIs and workflows that power our planning and booking assistant.
              - paragraph [ref=f45e210]: "Employment Type: Full-time"
              - paragraph [ref=f45e211]: What You’ll Do
              - list [ref=f45e212]:
                - listitem [ref=f45e213]: Build and maintain backend services using Node.js (Express) / Fastapi / Spring Boot and integrate them with travel APIs (flights, hotels, activities).
                - listitem [ref=f45e214]: Implement RESTful APIs and async programming to support AI-powered trip planning and booking.
                - listitem [ref=f45e215]: Work closely with the frontend and AI orchestration layers to enable seamless end-user experience.
                - listitem [ref=f45e216]: Design clean, reusable modules to integrate with third-party booking platforms.
                - listitem [ref=f45e217]: Optimize performance and scalability of real-time query systems.
              - paragraph [ref=f45e218]: What You Bring
              - list [ref=f45e219]:
                - listitem [ref=f45e220]: 5+ years of backend development experience for product-based startups.
                - listitem [ref=f45e221]: Strong knowledge of distributed systems.
                - listitem [ref=f45e222]: Strong understanding of RESTful APIs, and async programming.
                - listitem [ref=f45e223]: Experience with databases (MongoDB, PostgreSQL, or MySQL).
                - listitem [ref=f45e224]: Familiarity with message queues (e.g. Redis, RabbitMQ, Kafka) websockets and caching mechanisms.
                - listitem [ref=f45e225]: "Non-negotiable: Experience working in high-agency startup engineering teams with a builder's mindset."
                - listitem [ref=f45e226]: Ability to write clean, modular, testable code.
                - listitem [ref=f45e227]: "Bonus: Worked on travel, booking, or real-time systems."
              - paragraph [ref=f45e228]: Perks
              - list [ref=f45e229]:
                - listitem [ref=f45e230]: Work with a fast-moving team building futuristic travel tools.
                - listitem [ref=f45e231]: Shape backend architecture for a high-growth product.
                - listitem [ref=f45e232]: Learn and contribute to AI-agent orchestration pipelines.
                - listitem [ref=f45e233]: Competitive pay and ESOPs.
