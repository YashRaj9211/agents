              - strong [ref=f2333e114]: Qualification
              - text: ": BE/B.Tech/BSC/MCA or Related any"
            - paragraph [ref=f2333e115]:
              - text: This is an incredible opportunity to join, contribute, and shape a new team, while also being a part of a large, fast-growing organization. You will be joining an organization where your contribution makes a significant impact in positively impacting people’s lives, as new treatments and therapeutics are developed.
              - strong [ref=f2333e116]: Responsibilities
            - list [ref=f2333e117]:
              - listitem [ref=f2333e118]: Collect, analyze and document user requirements;
              - listitem [ref=f2333e119]: Design, modify, develop and support software applications;
              - listitem [ref=f2333e120]: Participate in software validation process through development, review, and/or execution of test plan/cases/scripts;
              - listitem [ref=f2333e121]: Create software applications by following software development life-cycle, which includes requirements gathering, design, development, testing, release, and maintenance;
              - listitem [ref=f2333e122]: Communicate with team members regarding projects, development, tools, and procedures;
              - listitem [ref=f2333e123]: Utilize skills in development areas including object oriented programming (C#), databases (SQL) web applications (ASP.NET);
              - listitem [ref=f2333e124]: Potential opportunities to lead software development projects.
            - paragraph [ref=f2333e125]:
              - strong [ref=f2333e126]: Qualifications
            - list [ref=f2333e127]:
              - listitem [ref=f2333e128]: Bachelor’s Degree in Computer Science;
              - listitem [ref=f2333e129]: Experience using technologies such as C#, Angular, Webservices, GraphQL, Git and relational databases is preferred;
              - listitem [ref=f2333e130]: Experience in Entity Framework, Azure DevOps is advantageous;
              - listitem [ref=f2333e131]: Understanding of software development life cycle (SDLC) and software release management;
              - listitem [ref=f2333e132]: Prior experience modernizing systems to a cloud-based platform (Azure) is a plus;
              - listitem [ref=f2333e133]: Excellent analytical, written and oral communication skills in English.
