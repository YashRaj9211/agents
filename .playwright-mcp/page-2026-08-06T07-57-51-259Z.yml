            - paragraph [ref=f588e97]:
              - strong [ref=f588e98]: "Eligibility :"
              - text: BE/B.Tech/BCA/BSC/MCA Or Related
            - paragraph [ref=f588e99]:
              - strong [ref=f588e100]: Experience
              - text: ": Fresher"
            - heading [level=2] [ref=f588e101]:
              - strong [ref=f588e102]: "Job Description:"
            - paragraph [ref=f588e103]: As a Software Engineer at Lam, you will be at the forefront of innovation by designing, developing, and troubleshooting, and debugging software programs. Your role is pivotal in developing software tools that support design, infrastructure, and technology platforms. Your expertise will determine hardware compatibility and influence design, ensuring seamless integration between software and hardware.
            - paragraph [ref=f588e104]: In this role, you’ll make an impact across Lam’s entire product portfolio of equipment working within our centralized software engineering team, collaborating with some of the brightest minds in the industry.
            - insertion [ref=f588e106]
            - heading [level=4] [ref=f588e108]:
              - strong [ref=f588e109]: What you’ll do
            - list [ref=f588e110]:
              - listitem [ref=f588e111]: Design, develop, troubleshoot, and debug software programs for enhancements and new products.
              - listitem [ref=f588e112]: Implement new customer requirements and features in our existing application.
              - listitem [ref=f588e113]: Maintain existing code base by investigating and resolving problem areas.
              - listitem [ref=f588e114]: Demonstrate solutions through clear documentation, flowcharts, and well-structured code.
              - listitem [ref=f588e115]: Collaborate with cross functional teams to design and develop software programs.
              - listitem [ref=f588e116]: May visit customer site to provide support and have ability to travel (total is less than 10%).
            - heading [level=4] [ref=f588e117]:
              - strong [ref=f588e118]: Who we’re looking for
            - insertion [ref=f588e120]
            - paragraph [ref=f588e122]:
              - strong [ref=f588e123]: "Minimum Qualifications:"
            - list [ref=f588e124]:
              - listitem [ref=f588e125]: Bachelor’s degree in Computer Engineering, Electronics, Mechanical Engineering with no previous professional experience; or equivalent experience.
              - listitem [ref=f588e126]: Knowledge of Object-Oriented Software (OOS), Object Oriented Design (OOD), or Object-Oriented Programming (OOP) implementation and design, including Design Patterns and Finite State Machines.
              - listitem [ref=f588e127]: Knowledge of multithreading, including preemptive thread scheduling.
              - listitem [ref=f588e128]: Knowledgeable with communication protocols such as Inter-Integrated Circuit (I2C), Service Provider Interface (SPI), Universal Asynchronous Receiver-Transmitter (UART).
              - listitem [ref=f588e129]: This is a graduate eligible role.
            - paragraph [ref=f588e130]: The intrested and eligible candidates can apply for the role on the following application link.
            - insertion [ref=f588e132]
