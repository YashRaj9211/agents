            - paragraph [ref=f463e118]:
              - strong [ref=f463e119]: Qualification
              - text: ": BE/B.Tech/BSC/BCA/MCA or Related"
            - paragraph [ref=f463e120]:
              - strong [ref=f463e121]: Batch
              - text: ": 2027/2026/2025 or any"
            - heading [level=2] [ref=f463e122]:
              - strong [ref=f463e123]: "Job Description:"
            - paragraph [ref=f463e124]:
              - text: As a Junior Engineer (Intern), you will work as part of the engineering team to build scalable and high-quality software solutions. This internship role (12-month tenure) provides hands-on experience in full-stack development, backend integrations, and modern software engineering practices. The role offers exposure to Java EE-based systems, REST APIs, databases, and emerging AI-enabled development practices.
              - link "Software Engineer Jobs" [ref=f463e125] [cursor=pointer]
            - paragraph [ref=f463e129]:
              - strong [ref=f463e130]: In this role you will…
            - list [ref=f463e131]:
              - listitem [ref=f463e132]: Develop and enhance UI components using Angular/TypeScript or similar frameworks.
              - listitem [ref=f463e133]: Integrate frontend applications with backend RESTful APIs and Java EE services.
              - listitem [ref=f463e134]: Apply Object-Oriented Programming (OOP) concepts in development.
              - listitem [ref=f463e135]: Write clean, efficient, and testable code; debug and resolve issues.
              - listitem [ref=f463e136]: Follow secure coding and data privacy best practices.
              - listitem [ref=f463e137]: Apply basic DevOps practices (CI/CD, build, deployment) and version control standards (Git workflows, pull requests).
              - listitem [ref=f463e138]: Contribute to logging and observability practices (logs, metrics).
              - listitem [ref=f463e139]: Develop Python scripts for automation or integration tasks (preferred).
              - listitem [ref=f463e140]: Use AI-assisted development tools (e.g., Copilot, ChatGPT) to improve productivity.
              - listitem [ref=f463e141]: Participate in team learning, code reviews, and innovation initiatives.
            - paragraph [ref=f463e142]:
              - strong [ref=f463e143]: You’ve got what it takes if you have…
              - link "Engineering Job Search" [ref=f463e144] [cursor=pointer]
            - list [ref=f463e148]:
              - listitem [ref=f463e149]: Bachelor’s degree (completed or pursuing) in Computer Science or a related engineering field.
              - listitem [ref=f463e150]: Strong understanding of Object-Oriented Programming (OOP) concepts.
              - listitem [ref=f463e151]: "Basic knowledge of web technologies: HTML, CSS, JavaScript."
              - listitem [ref=f463e152]: Familiarity with frontend frameworks such as Angular or React.
              - listitem [ref=f463e153]: Understanding of backend concepts and REST APIs.
              - listitem [ref=f463e154]: Good problem-solving and analytical skills.
              - listitem [ref=f463e155]: Strong verbal and written communication skills.
              - listitem [ref=f463e156]: Familiarity with version control tools such as Git.
            - paragraph [ref=f463e157]:
              - strong [ref=f463e158]: Preferred Skills
            - list [ref=f463e159]:
              - listitem [ref=f463e160]: Exposure to Java EE or similar enterprise backend technologies.
              - listitem [ref=f463e161]: Basic knowledge of databases (SQL/NoSQL).
              - listitem [ref=f463e162]: Experience or coursework in full-stack application development.
              - listitem [ref=f463e163]: Understanding of APIs, microservices, and event-driven architecture.
              - listitem [ref=f463e164]: Exposure to cloud platforms (Azure/AWS/GCP) and cloud-native development fundamentals.
              - listitem [ref=f463e165]: Awareness of DevOps tools and practices (Docker, CI/CD pipelines, GitHub Actions, Jenkins).
              - listitem [ref=f463e166]: Exposure to data handling, JSON processing, and API integrations.
              - listitem [ref=f463e167]: Experience with developer productivity tools and IDEs, including those with AI-assisted features.
              - listitem [ref=f463e168]: Understanding of API authentication mechanisms (OAuth2, API Keys, JWT).
            - paragraph [ref=f463e169]:
              - strong [ref=f463e170]: What You’ll Gain
            - list [ref=f463e171]:
              - listitem [ref=f463e172]: 12 months of hands-on industry experience as a Junior Engineer.
              - listitem [ref=f463e173]: Exposure to enterprise-scale systems and integration services.
              - listitem [ref=f463e174]: Mentorship from experienced engineering professionals.
              - listitem [ref=f463e175]: Practical experience in Agile software development environments.
              - listitem [ref=f463e176]: Opportunity to work with modern technologies, including AI-assisted development tools.
            - paragraph
            - heading [level=2] [ref=f463e177]:
              - strong [ref=f463e178]: "How To Apply :"
            - paragraph [ref=f463e179]:
              - text: Interested and eligible candidates can apply for the hiring on the following application Cornerstone careers link, Shortlisted candidates will receive further selection process.
              - link "Off Campus Drive" [ref=f463e180] [cursor=pointer]
