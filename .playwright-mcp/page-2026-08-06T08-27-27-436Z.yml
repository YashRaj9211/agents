            - paragraph [ref=f2525e125]: As a Software Engineer, you will be responsible for developing sophisticated systems and software basis the customer’s business goals, needs and general business environment creating software solutions.
            - paragraph [ref=f2525e126]:
              - strong [ref=f2525e127]: "You will:"
              - text: •Develop, test and integrate code for new or existing software while following source code revision control•Troubleshoot software reliability and performance issues•Review requirements, specifications and designs, developing and implementing tests for product quality and performance assurance•Assist with the development and review of (technical) end user documentation• Drive idea generation for new software products or for the next version of an existing product
