            - paragraph [ref=f2793e109]:
              - strong [ref=f2793e110]: "What You’ll Be Doing:"
            - list [ref=f2793e111]:
              - listitem [ref=f2793e112]: Developing and maintaining software tools and scripts for custom compiler and layout automation.
              - listitem [ref=f2793e113]: Collaborating with cross-functional teams to design and implement new features.
              - listitem [ref=f2793e114]: Writing and maintaining efficient, reusable, and reliable code in Python, Perl, and TCL.
              - listitem [ref=f2793e115]: Conducting code reviews and providing constructive feedback to peers.
              - listitem [ref=f2793e116]: Implementing and executing test-driven development, unit testing, and functional testing practices.
              - listitem [ref=f2793e117]: Utilizing version control systems like Git and PERFORCE to manage codebases efficiently.
            - paragraph [ref=f2793e118]:
              - strong [ref=f2793e119]: "What You’ll Need:"
            - list [ref=f2793e120]:
              - listitem [ref=f2793e121]: Fresh graduate from the class of 2025 in Computer Science, Electrical Engineering, or a related field.
              - listitem [ref=f2793e122]: Not currently enrolled in any M-Tech programs or postgraduate diplomas.
              - listitem [ref=f2793e123]: Not employed in any full-time positions at any company.
              - listitem [ref=f2793e124]: Strong programming skills in Python, Perl, and TCL.
              - listitem [ref=f2793e125]: Familiarity with Custom Compiler/Virtuoso, circuit and layout automation.
              - listitem [ref=f2793e126]: Experience with UNIX/Linux environments.
              - listitem [ref=f2793e127]: Understanding of test-driven development, unit testing, and functional testing.
              - listitem [ref=f2793e128]: Knowledge of version control systems, especially Git and PERFORCE.
              - listitem [ref=f2793e129]: Eagerness to learn, adapt, and contribute innovative solutions.
              - listitem [ref=f2793e130]: Limited internship experience is acceptable.
            - paragraph [ref=f2793e131]:
              - text: Eligible and interested candidates apply on the following synopsys Careers page.
