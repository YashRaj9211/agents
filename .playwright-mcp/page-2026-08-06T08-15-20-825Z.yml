            - paragraph [ref=f1768e77]:
              - text: This initiative is perfect for passionate individuals eager to dive into fintech innovation, develop robust
              - link "software" [ref=f1768e78] [cursor=pointer]:
                - /url: "#"
              - text: solutions, and learn from industry-leading experts in a collaborative and growth-oriented environment. If you belong to the 2024, 2025, or 2026 batches, this is your chance to join a global leader in wealth management technology.
              - link "Engineering & Technology" [ref=f1768e81] [cursor=pointer]
