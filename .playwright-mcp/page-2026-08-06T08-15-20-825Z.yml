            - paragraph [ref=f1768e118]:
              - text: As an Apprentice in the Finance and Insurance sector, you will embark on a comprehensive learning journey designed to develop your foundational knowledge and practical skills in technology on financial services products. This role aims to equip you with hands-on experience in development and support of the products, preparing you for a successful career in the industry.
              - link "Software" [ref=f1768e119] [cursor=pointer]
            - generic [ref=f1768e125]:
              - generic [ref=f1768e126]:
                - generic [ref=f1768e127]: WhatsApp Channel
                - link "Join Now" [ref=f1768e129] [cursor=pointer]:
                  - /url: https://chat.whatsapp.com/LD7u8YPDaP7JDTDrnpwNNP
              - generic [ref=f1768e130]:
                - generic [ref=f1768e131]: Telegram Channel
                - link "Join Now" [ref=f1768e133] [cursor=pointer]:
                  - /url: https://telegram.me/campusdrivejobs
            - paragraph [ref=f1768e134]: You will work closely with experienced professionals to understand the intricacies of financial products, risk management, and regulatory frameworks. The ultimate goal is to enable you to contribute effectively to your team while continuously enhancing your expertise through structured training and real-world application.
            - paragraph [ref=f1768e135]: This apprenticeship serves as a critical stepping stone towards becoming a proficient software professional in finance domain capable of supporting organizational objectives and client needs.
            - insertion [ref=f1768e137]
            - heading "Eligibility Criteria & Qualifications" [level=2] [ref=f1768e139]
            - paragraph [ref=f1768e140]:
              - text: To be eligible for the
              - strong [ref=f1768e141]: BetaNXT Recruitment 2026
              - text: ", candidates must meet the following minimum and preferred qualifications:"
            - heading "Minimum Qualifications:" [level=3] [ref=f1768e142]
            - list [ref=f1768e143]:
              - listitem [ref=f1768e144]: Completion of graduation – Bachelor of Engineering (BE/B.Tech).
              - listitem [ref=f1768e145]: Understanding of coding languages such as C, C++, .Net, Java, Angular, React, TypeScript, and NodeJS is required.
              - listitem [ref=f1768e146]: Basic understanding of financial concepts and a genuine interest in the finance industry.
              - listitem [ref=f1768e147]: Proficiency in English (Written and Verbal).
              - listitem [ref=f1768e148]: Good numerical and analytical skills.
              - listitem [ref=f1768e149]: Ability to commit to the full duration of the apprenticeship program.
            - heading "Preferred Qualifications:" [level=3] [ref=f1768e150]
            - list [ref=f1768e151]:
              - listitem [ref=f1768e152]:
                - text: Familiarity with
                - link "computer" [ref=f1768e153] [cursor=pointer]:
                  - /url: "#"
                - text: applications such as MS Office (Excel, Word, PowerPoint).
              - listitem [ref=f1768e156]: Strong communication and interpersonal skills.
              - listitem [ref=f1768e157]: Demonstrated eagerness to learn and adapt in a dynamic work environment.
            - heading "Key Responsibilities" [level=2] [ref=f1768e158]
            - insertion [ref=f1768e160]
            - paragraph [ref=f1768e162]:
              - text: "During your tenure at BetaNXT, you will be responsible for the following tasks:"
              - link "Engineering & Technology" [ref=f1768e163] [cursor=pointer]
            - list [ref=f1768e167]:
              - listitem [ref=f1768e168]: Participate in training sessions and workshops to build knowledge of software principles, financial products, and industry best practices.
              - listitem [ref=f1768e169]: Work on real-life business solutions and contribute to live projects.
              - listitem [ref=f1768e170]: Assist in the development and support of Financial products.
            - heading "Required Skills" [level=2] [ref=f1768e171]
            - paragraph [ref=f1768e172]:
              - text: Candidates should possess a strong numerical aptitude. Exposure to coding languages such as C, C++, .Net, Java, Angular, React, TypeScript, and NodeJS is essential. Any basic financial knowledge will be considered a significant value add for this role.
              - link "Computer Hardware" [ref=f1768e173] [cursor=pointer]
            - insertion [ref=f1768e178]
            - heading "Why Join BetaNXT?" [level=2] [ref=f1768e180]
            - paragraph [ref=f1768e181]: BetaNXT is at the forefront of the wealth management industry, providing innovative solutions that power the financial world. By joining as an apprentice, you gain exposure to high-scale technology, mentorship from industry veterans, and a clear path toward becoming a full-time software professional in the fintech domain.
            - heading "How to Apply for BetaNXT Off Campus Drive 2026" [level=2] [ref=f1768e182]
            - paragraph [ref=f1768e183]:
              - text: Interested and eligible graduates can register for the BetaNXT Off Campus Drive by clicking on the application link provided below. Ensure your resume highlights your technical skills and any projects related to the coding languages mentioned above.
