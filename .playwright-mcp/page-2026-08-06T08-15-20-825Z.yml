            - paragraph [ref=f1768e67]:
              - text: Are you a budding tech enthusiast looking to kickstart your career in the high-growth world of Fintech? BetaNXT is officially inviting applications for its highly anticipated
              - strong [ref=f1768e68]: BetaNXT Off Campus Drive 2026
              - text: . This is a career-defining opportunity for the role of
              - strong [ref=f1768e69]:
                - text: Apprentice – Software
                - link "Engineer" [ref=f1768e70] [cursor=pointer]:
