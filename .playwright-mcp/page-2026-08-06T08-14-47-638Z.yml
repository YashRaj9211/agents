            - heading "Educational Qualification:" [level=3] [ref=f1744e148]
            - list [ref=f1744e149]:
              - listitem [ref=f1744e150]:
                - text: A full-time Bachelor’s degree in
                - link "Engineering" [ref=f1744e151] [cursor=pointer]:
                  - /url: "#"
                - text: (BE/B.Tech), BSc, BCA, or MCA.
              - listitem [ref=f1744e154]:
                - text: Candidates from
                - link "Computer Science" [ref=f1744e155] [cursor=pointer]:
                  - /url: "#"
                - text: ", Information Technology, or related streams are preferred."
              - listitem [ref=f1744e158]: Relevant professional certifications will be an added advantage.
            - heading "Technical Skill Set:" [level=3] [ref=f1744e159]
            - list [ref=f1744e160]:
              - listitem [ref=f1744e161]:
                - strong [ref=f1744e162]: "Programming Languages:"
                - text: Strong foundational knowledge in C, C++, Java, Python, or .Net.
              - listitem [ref=f1744e163]:
                - strong [ref=f1744e164]: "Databases:"
                - text: Excellent understanding of Relational Databases and SQL.
              - listitem [ref=f1744e165]:
                - strong [ref=f1744e166]: "Development Methodologies:"
                - text: Familiarity with software development methodologies (Agile/Scrum) and release processes.
              - listitem [ref=f1744e167]:
                - strong [ref=f1744e168]: "Modern Practices:"
                - text: Knowledge of Test-Driven Development (TDD) and mastery of modern software engineering tools.
            - heading "Soft Skills:" [level=3] [ref=f1744e169]
            - list [ref=f1744e170]:
              - listitem [ref=f1744e171]: Excellent verbal and written communication skills.
              - listitem [ref=f1744e172]: Strong analytical and problem-solving abilities.
              - listitem [ref=f1744e173]: A proactive attitude toward learning new and emerging technologies.
            - heading "Why Join CBTS?" [level=2] [ref=f1744e174]
            - insertion [ref=f1744e176]
            - paragraph [ref=f1744e178]: "CBTS is a global provider of IT solutions, cloud services, and managed services. Joining CBTS as a fresher provides you with:"
            - list [ref=f1744e179]:
              - listitem [ref=f1744e180]: Exposure to global projects and international clients.
              - listitem [ref=f1744e181]: Mentorship from industry experts.
              - listitem [ref=f1744e182]: A collaborative work culture that encourages innovation.
              - listitem [ref=f1744e183]: Competitive salary packages and career growth opportunities.
            - heading "How to Apply for CBTS Off Campus Drive 2026?" [level=2] [ref=f1744e184]
            - paragraph [ref=f1744e185]:
              - text: "Interested and eligible candidates are encouraged to apply as soon as possible, as applications are reviewed on a rolling basis. Follow the steps below to submit your application:"
              - link "Computer Science" [ref=f1744e186] [cursor=pointer]
            - insertion [ref=f1744e191]
            - list [ref=f1744e193]:
              - listitem [ref=f1744e194]:
                - text: Click on the
                - strong [ref=f1744e195]: Apply Link
                - text: provided below.
              - listitem [ref=f1744e196]: You will be redirected to the official CBTS Careers Portal.
              - listitem [ref=f1744e197]: Fill in your personal details, educational qualifications, and contact information.
              - listitem [ref=f1744e198]: Upload your updated Resume/CV.
              - listitem [ref=f1744e199]: Submit the application form and wait for the HR team to contact you for the next rounds (Online Test/Interview).
            - paragraph [ref=f1744e200]:
              - strong [ref=f1744e201]: "Apply Link:"
              - link [ref=f1744e202] [cursor=pointer]:
