            - paragraph [ref=f1744e111]:
              - text: As an Associate Software Engineer at CBTS, you will be part of a dynamic team responsible for designing, developing, and installing cutting-edge software solutions. The ideal candidate is a passionate coder who can build high-quality, innovative software that complies with global coding standards and technical designs.
              - link "Corporate Training" [ref=f1744e112] [cursor=pointer]
            - heading "Key Responsibilities:" [level=3] [ref=f1744e116]
            - list [ref=f1744e117]:
              - listitem [ref=f1744e118]:
                - strong [ref=f1744e119]: "Software Development:"
                - text: Execute the full software development lifecycle (SDLC) by writing clean, testable, and efficient code.
              - listitem [ref=f1744e120]:
                - strong [ref=f1744e121]: "System Integration:"
                - text: Integrate various software components into a fully functional and scalable software system.
              - listitem [ref=f1744e122]:
                - strong [ref=f1744e123]: "Documentation:"
                - text: Maintain detailed documentation for software functionality, requirements, and specifications.
              - listitem [ref=f1744e124]:
                - strong [ref=f1744e125]: "Feasibility Analysis:"
                - text: Produce technical specifications and determine the operational feasibility of proposed solutions.
              - listitem [ref=f1744e126]:
                - strong [ref=f1744e127]: "Tool Deployment:"
                - text: Tailor and deploy modern software tools, processes, and performance metrics to improve productivity.
            - heading "Eligibility Criteria & Skills Required" [level=2] [ref=f1744e128]
            - insertion [ref=f1744e130]
            - paragraph [ref=f1744e132]:
              - text: "CBTS is looking for candidates who are not just technically sound but also ready to embrace emerging technologies. Here is what you need to qualify:"
              - link "Engineering & Technology" [ref=f1744e133] [cursor=pointer]
            - generic [ref=f1744e139]:
