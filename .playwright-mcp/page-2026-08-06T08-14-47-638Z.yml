                - strong [ref=f1744e203]: Click Here to Apply for CBTS Recruitment 2026
              - link "Science" [ref=f1744e204] [cursor=pointer]
            - paragraph [ref=f1744e208]:
              - emphasis [ref=f1744e209]: "Note: Ensure all details provided are accurate to avoid disqualification during the document verification process."
            - heading "Frequently Asked Questions (FAQs)" [level=2] [ref=f1744e210]
            - paragraph [ref=f1744e211]:
              - strong [ref=f1744e212]: 1. Which batches are eligible for the CBTS Off Campus Drive?
              - text: Candidates from the 2024, 2025, and 2026 batches are eligible to apply.
            - paragraph [ref=f1744e213]:
              - strong [ref=f1744e214]: 2. What is the job location for this role?
              - text: The primary job location for the Associate Software Engineer role is Chennai, India.
            - paragraph [ref=f1744e215]:
              - strong [ref=f1744e216]: 3. Is there any experience required?
              - text: This role is open to Freshers (0 years of experience) as well as candidates with up to 2 years of relevant experience.
              - link "Engineering & Technology" [ref=f1744e217] [cursor=pointer]
            - insertion [ref=f1744e222]
            - paragraph [ref=f1744e224]:
              - strong [ref=f1744e225]: 4. What are the key skills needed?
              - text: Proficiency in programming (Java, Python, or C++) and a good grasp of SQL and Database management are essential.
