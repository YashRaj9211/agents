              - strong [ref=f886e122]: "Job Description:"
            - paragraph [ref=f886e123]: Analyzes, designs, develops, and maintains software solutions for the organization’s products and systems. Collaborates on system integrations of software and hardware to ensure optimal performance and program consistency. Develops, validates, and tests structures, user documentation, and software functionality. Work is reviewed for accuracy and adherence to established processes and guidelines.
            - paragraph [ref=f886e124]:
              - strong [ref=f886e125]: "Essential Duties and Responsibilities:"
              - text: • Collaborates with team members to establish requirements for less complex design projects• Completes all phases of software engineering design projects, including coding, debugging, testing, and deployment• Conducts analysis of processes and systems, delivering results to key stakeholders• Analyzes and interprets results, recommending potential solutions for software and system improvements• Contributes to the development and testing of software solutions for various products, ensuring they meet quality and performance standards• Creates and maintains documentation for projects, including code, design specifications, and test results• Stays up to date with the latest technologies and software engineering methodologies, applying them to projects as needed• Reviews and evaluates changes or upgrades to existing designs or test processes• Exercises sound judgment in selecting appropriate methods and techniques for problem solving and solution delivery
              - strong [ref=f886e126]: "Job Requirements:"
              - text: "• Bachelors Degree in Computer Science, Software Engineering, or related field. Advanced Degree in relevant field is also acceptable• 0+ years of experience in software development or a related field• Equivalency: Equivalent work experience will be considered in lieu of a degree"
              - strong [ref=f886e127]: "Key Skills and Competencies:"
              - text: • Quantitative, analytical, and problem solving skills• Familiarity with programming languages, operating systems, algorithms and software development frameworks• Basic understanding of software development life cycles (e.g., Agile, Scrum)• Ability to work collaboratively in a team environment• Strong written and verbal communication skills
