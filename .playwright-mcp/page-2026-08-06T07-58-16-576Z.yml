            - paragraph
            - heading "Job Description ::" [level=3] [ref=f714e120]
            - paragraph [ref=f714e121]:
              - text: Join our innovative team as an Associate Product Software Engineer, where you’ll have the opportunity to work with cutting-edge technologies to develop, debug, and enhance software programs. Your role will be instrumental in improving the functionality and performance of our software products, contributing to the overall success and satisfaction of our users.
              - link "Civil Engineering" [ref=f714e122] [cursor=pointer]
            - heading "Responsibilities:" [level=4] [ref=f714e126]
            - list [ref=f714e127]:
              - listitem [ref=f714e128]: "Software Development: Assist in developing and maintaining software applications under the guidance of senior team members."
              - listitem [ref=f714e129]: "Testing Support: Assist in writing and executing unit tests to verify the functionality and correctness of software components."
              - listitem [ref=f714e130]: "Bug Tracking: Help identify, log, and track software defects (bugs) through bug tracking systems."
              - listitem [ref=f714e131]: "Code Implementation: Write code following coding standards and best practices provided by the team."
              - listitem [ref=f714e132]: "Collaboration: Work collaboratively with team members and contribute to team discussions and meetings."
              - listitem [ref=f714e133]: "Version Control Usage: Utilize version control systems to manage code changes and participate in code reviews."
              - listitem [ref=f714e134]: "Debugging Assistance: Aid in debugging and troubleshooting software issues to assist senior team members in resolving problems."
              - listitem [ref=f714e135]: "Requirements Understanding: Gain an understanding of project requirements and specifications."
              - listitem [ref=f714e136]: "Quality Assurance: Participate in testing and quality assurance activities to ensure the reliability and quality of software."
              - listitem [ref=f714e137]: "Learning and Skill Development: Continuously learn and improve coding skills, programming languages, and software development tools."
            - heading "Skills:" [level=4] [ref=f714e138]
            - list [ref=f714e139]:
              - listitem [ref=f714e140]: "Software Engineering: The ability to design, develop, and maintain software systems and applications by applying principles and techniques of computer science, engineering, and mathematical analysis. This includes the capacity to understand user requirements, create and test the software, and resolve any software-related issues."
              - listitem [ref=f714e141]: "Software Development: The ability to design, write, test, and implement software programs, applications, and systems. This includes understanding various programming languages, software architecture, and software testing methods. It also involves problem-solving capabilities to fix software issues and improve functionality."
              - listitem [ref=f714e142]: "Programming: The ability to design, write, test, debug, and maintain the instructions, also known as code, that a computer must follow to execute a task. This skill often involves various programming languages such as Python, Java, or C++."
              - listitem [ref=f714e143]: "Problem Solving: The ability to understand a complex situation or issue and devise a solution by defining the problem, identifying potential strategies, and ultimately choosing and implementing the most effective course of action."
              - listitem [ref=f714e144]: "Analysis: The ability to examine complex situations or problems, break them down into smaller parts, and understand how these parts work together."
              - listitem [ref=f714e145]: "Testing: The skill of evaluating a system or process, often in software or product development. It involves the ability to identify problems, measure effectiveness, and ensure quality or functionality."
