            - heading "About Qualcomm" [level=2] [ref=f1050e129]
            - paragraph [ref=f1050e130]:
              - text: Qualcomm is a world leader in wireless technology innovation. We are a company of inventors that created and continue to drive the foundational breakthroughs that make mobile technology and its many benefits possible. Our innovations are at the heart of millions of devices, connecting people, places, and things around the world. From 5G to AI, automotive to IoT, Qualcomm technologies are transforming industries and enriching lives. Joining Qualcomm means becoming part of a legacy of innovation and working alongside some of the brightest minds in the industry.
