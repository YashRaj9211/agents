            - heading "Qualcomm Software Engineer Job Description" [level=2] [ref=f1050e146]
            - paragraph [ref=f1050e147]: As a Software Engineer at Qualcomm, you will be instrumental in designing and developing sophisticated software for Qualcomm’s next-generation mobile chipsets, leveraging cutting-edge technology. We are seeking energetic, creative, and self-driven engineers passionate about pushing the boundaries of technology.
            - paragraph [ref=f1050e148]: Qualcomm is looking for energetic, creative and self-driven engineer to work in ➢ Multimedia Technologies such as Audio and Video codecs, Image Processing, ➢ Wireless Modem Technologies, such as 4G, WiFi, Bluetooth, Self-Organizing Networks. ➢ Platform Level SW, such as, Linux, Android, Windows, Board Support Packages. ➢ IOT Technologies, for Connected Cameras, Smart Assistants, Drones, Virtual Reality, Augmented Reality.
            - insertion [ref=f1050e150]
            - paragraph [ref=f1050e152]:
              - strong [ref=f1050e153]: "Campus Grads will be working on following areas:"
              - link "Engineering & Technology" [ref=f1050e154] [cursor=pointer]
            - paragraph [ref=f1050e158]: • Development of real-time embedded software and device drivers • Mobile SW development for Windows Mobile, Android or Linux • Good understanding of OS concepts, Data structures, etc • C/C++ and object oriented design • Wireless network standards such as CDMA/GSM/UMTS/LTE • Linux/UNIX, Linux Drivers, Linux Kernel Development • Protocols such TCP/UDP/IP/SIP/RTP etc • Multimedia technologies including Audio, Video, Imaging • Excellent analytical and problem solving skills • Ability to collaborate and work in teams. • Good verbal and written communication skill
            - paragraph [ref=f1050e159]:
              - text: "Opportunities include: • SW development for Android, Window Mobile based Embedded Platforms • Multimedia software stack, firmware and driver Development • Wireless Modem and connectivity Software and Firmware Development • Communication protocol stack Software Development • Kernel, BSP and Device Driver Development • Application SW and UI development. • SW Architecture for embedded devices based on Android, Windows. • Design and development based on Object oriented programming."
              - link "Software" [ref=f1050e160] [cursor=pointer]
            - paragraph [ref=f1050e164]:
              - strong [ref=f1050e165]: "Minimum Qualifications:"
              - text: • Bachelor’s degree in Engineering, Information Systems, Computer Science, or related field.
            - paragraph [ref=f1050e166]:
              - strong [ref=f1050e167]: Education
              - text: ": Masters, Bachelors: Computer Science Engineering, Communication Engineering, ECE,"
