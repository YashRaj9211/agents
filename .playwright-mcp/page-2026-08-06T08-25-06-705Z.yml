            - paragraph [ref=f2367e106]:
              - strong [ref=f2367e107]: "Role Description :"
            - paragraph [ref=f2367e108]: The purpose of this role is to design, develop and troubleshoot solutions/ designs/ models/ simulations on various softwares as per clients/ project requirements
            - paragraph [ref=f2367e109]:
              - strong [ref=f2367e110]: Do
            - paragraph [ref=f2367e111]: 1. Design and Develop solutions as per clients specifications
            - list [ref=f2367e112]:
              - listitem [ref=f2367e113]: Work on different softwares like CAD, CAE to develop appropriate models as per the project plan/ customer requirements
              - listitem [ref=f2367e114]: Test the protype and designs produced on the softwares and check all the boundary conditions (impact analysis, stress analysis etc)
              - listitem [ref=f2367e115]:
                - text: Produce specifications and determine operational feasibility by integrating
                - link "software" [ref=f2367e116] [cursor=pointer]:
                  - /url: "#"
                - text: components into a fully functional software system
              - listitem [ref=f2367e119]: Create a prototype as per the engineering drawings & outline CAD model is prepared
              - listitem [ref=f2367e120]: Perform failure effect mode analysis (FMEA) for any new requirements received from the client
              - listitem [ref=f2367e121]: Provide optimized solutions to the client by running simulations in virtual environment
              - listitem [ref=f2367e122]: Ensure software is updated with latest features to make it cost effective for the client
              - listitem [ref=f2367e123]: Enhance applications/ solutions by identifying opportunities for improvement, making recommendations and designing and implementing systems
              - listitem [ref=f2367e124]: Follow industry standard operating procedures for various processes and systems as per the client requirement while modeling a solution on the software
            - paragraph [ref=f2367e125]:
              - text: 2. Provide customer support and problem solving from time to time
              - link "Software" [ref=f2367e126] [cursor=pointer]
            - list [ref=f2367e130]:
              - listitem [ref=f2367e131]: Perform defect fixing raised by the client or software integration team while solving the tickets raised
              - listitem [ref=f2367e132]: Develop software verification plans and quality assurance procedures for the customer
              - listitem [ref=f2367e133]: Troubleshoot, debug and upgrade existing systems on time & with minimum latency and maximum efficiency
              - listitem [ref=f2367e134]: Deploy programs and evaluate user feedback for adequate resolution with customer satisfaction
              - listitem [ref=f2367e135]: Comply with project plans and industry standards
            - paragraph [ref=f2367e136]: 3. Ensure reporting & documentation for the client
            - list [ref=f2367e137]:
              - listitem [ref=f2367e138]: Ensure weekly, monthly status reports for the clients as per requirements
              - listitem [ref=f2367e139]: Maintain documents and create a repository of all design changes, recommendations etc
              - listitem [ref=f2367e140]: Maintain time-sheets for the clients
              - listitem [ref=f2367e141]: Providing written knowledge transfer/ history of the project
            - paragraph [ref=f2367e142]:
              - strong [ref=f2367e143]: "How To Apply :"
              - link "Engineering & Technology" [ref=f2367e144] [cursor=pointer]
