              - paragraph [ref=f37e183]: "Employment Type: Paid Internship"
              - paragraph [ref=f37e184]: "Mode of Work: Hybrid"
              - paragraph [ref=f37e185]: "Duration: 4 Months."
              - paragraph [ref=f37e186]: "About the Role:"
              - paragraph [ref=f37e187]: We are looking for an experienced MERN Stack Developer with strong proficiency in modern JavaScript-based development. The ideal candidate will be responsible for building scalable, high-performance web applications and working across the full development lifecycle—from designing APIs to deploying applications on cloud platforms.
              - paragraph [ref=f37e188]: Key Responsibilities
              - list [ref=f37e189]:
                - listitem [ref=f37e190]: Develop and maintain full-stack web applications using MongoDB, Express.js, React.js, and Node.js.
                - listitem [ref=f37e191]: Build reusable, high-quality front-end components using React and modern UI libraries.
                - listitem [ref=f37e192]: Develop RESTful APIs and backend services with Node.js & Express.
                - listitem [ref=f37e193]: Work with MongoDB and SQL databases for data modeling, queries, and performance optimization.
                - listitem [ref=f37e194]: Integrate third-party services and APIs.
                - listitem [ref=f37e195]: Implement Git/GitHub workflows, branching strategies, and code reviews.
                - listitem [ref=f37e196]: Set up and manage CI/CD pipelines using GitHub Actions.
                - listitem [ref=f37e197]: Deploy and maintain applications on AWS (EC2, S3, Lambda, CloudFront, etc.).
                - listitem [ref=f37e198]: Ensure application performance, security, and scalability.
                - listitem [ref=f37e199]: Debug, troubleshoot, and optimize existing applications.
                - listitem [ref=f37e200]: Collaborate with designers, product owners, and team members for seamless delivery.
              - paragraph [ref=f37e201]: "Required Skills:"
              - list [ref=f37e202]:
                - listitem [ref=f37e203]: Strong proficiency in JavaScript (ES6+).
                - listitem [ref=f37e204]: Hands-on experience with React.js, hooks, and state management (Redux/Zustand).
                - listitem [ref=f37e205]: Strong backend development experience with Node.js & Express.js.
                - listitem [ref=f37e206]: Experience with MongoDB and knowledge of SQL databases.
                - listitem [ref=f37e207]: Excellent understanding of REST APIs and integration patterns.
                - listitem [ref=f37e208]: Experience with GitHub, GitHub Actions, and CI/CD pipelines.
                - listitem [ref=f37e209]: Experience deploying applications on AWS.
                - listitem [ref=f37e210]: Knowledge of application security, optimization, and scalable architecture.
                - listitem [ref=f37e211]: Strong problem-solving skills and debugging abilities.
              - paragraph [ref=f37e212]: "How to Apply:"
              - paragraph [ref=f37e213]: Send your updated resume and work samples to hr.ideaptdigital@gmail.com with the subject line "Application for Web Developer Intern - Kolkata."
