            - paragraph
            - heading "🤩 What Makes This Role Special" [level=4] [ref=f1514e134]
            - list [ref=f1514e135]:
              - listitem [ref=f1514e136]: Contribute to end-to-end testing across web, mobile, and backend systems.
              - listitem [ref=f1514e137]: Build and improve automation frameworks and CI/CD pipelines.
              - listitem [ref=f1514e138]: Collaborate closely with engineers and product managers to ensure smooth, high-quality releases.
              - listitem [ref=f1514e139]: Gain exposure to diverse problem statements across multiple product pods.
              - listitem [ref=f1514e140]: Learn in a fast-paced environment while building a global consumer product.
            - paragraph
