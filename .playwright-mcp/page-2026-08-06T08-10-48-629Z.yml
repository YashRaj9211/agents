              - strong [ref=f1514e117]: Job Description
              - text: ":"
            - paragraph [ref=f1514e118]:
              - text: We’re looking for a Software Engineer in Test to join our engineering team at Headout. You’ll work within one of our product pods, ensuring features are shipped with quality, reliability, and speed. This role is hands-on – you’ll write and execute test cases, build automation, and help troubleshoot production issues. It’s a great opportunity for someone early in their career to learn, grow, and have real impact on a global product.
              - link "Recruitment & Staffing" [ref=f1514e119] [cursor=pointer]
