            - heading "💝 What Skills & Experience You Need" [level=4] [ref=f1514e142]
            - list [ref=f1514e143]:
              - listitem [ref=f1514e144]: 1–3 years of experience in automation testing for web, mobile, or backend systems.
              - listitem [ref=f1514e145]: Proficiency with automated testing tools and frameworks (e.g., Selenium, Playwright, Appium, RestAssured).
              - listitem [ref=f1514e146]: Experience writing clean, modular code for test automation.
              - listitem [ref=f1514e147]: Familiarity with CI/CD pipelines, Git, and Unix systems.
              - listitem [ref=f1514e148]: Solid grounding in computer science fundamentals and OOP concepts.
              - listitem [ref=f1514e149]: Problem-solving mindset and ability to adapt to ambiguity.
              - listitem [ref=f1514e150]: Good understanding of Java.
