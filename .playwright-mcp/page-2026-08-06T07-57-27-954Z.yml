              - text: ": 2027 or 2026 Batch"
            - heading "Job Description :" [level=3] [ref=f505e115]:
              - text: "Job Description :"
              - strong
            - paragraph [ref=f505e116]: We are currently looking for Software Engineering interns to join us in Pune or Bangalore. You will work closely with a senior mentor to gain technical knowledge and experience in your field, and cooperate with a broader international team both locally and globally. You will be part of a cohort of interns and have the opportunity to work on multiple projects within Global Engineering while also receiving learning and curriculum on different technologies. These projects and curriculum may include areas such as Ansible, RHEL, OpenShift, AI, and more. You’ll also have the chance to work with technologies like Python, GitHub, Java, Agile, JavaScript, etc.
            - paragraph [ref=f505e117]:
              - strong [ref=f505e118]: What will you do?
            - list [ref=f505e119]:
              - listitem [ref=f505e120]: Work closely with your mentor to design, develop, and maintain code in Python, Golang or similar programming language
              - listitem [ref=f505e121]: Add new features, debug, identify, and track issues in Red Hat products (RHEL, OpenShift or other)
              - listitem [ref=f505e122]: Collaborate with the wider team members and other departments such as Quality Engineering, Designers, Product Management or Documentation team throughout the product cycle
              - listitem [ref=f505e123]: Network with other talented interns in a workplace where you can be yourself and thrive
            - paragraph [ref=f505e124]:
              - strong [ref=f505e125]: What will you bring?
              - link "Internship application guide" [ref=f505e126] [cursor=pointer]
            - list [ref=f505e130]:
              - listitem [ref=f505e131]: Currently pursuing the final year of a bachelor’s degree in Computer Science, Information Technology, or an equivalent discipline
              - listitem [ref=f505e132]: Working knowledge of written and spoken English
              - listitem [ref=f505e133]: Basic knowledge of and passion for Software Engineering, basic knowledge and willingness to use Python, Golang or similar programming language
              - listitem [ref=f505e134]: Passion, curiosity, and desire to create new things and examine how things work internally
              - listitem [ref=f505e135]: Willingness to learn and proactively work as a part of a wider team
            - paragraph
