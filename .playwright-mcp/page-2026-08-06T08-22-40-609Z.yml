            - heading "Job Description For Infor :" [level=3] [ref=f2166e99]:
              - text: "Job Description For Infor :"
              - strong
            - paragraph [ref=f2166e100]:
              - text: We are looking for
              - strong [ref=f2166e101]: passionate and driven fresh graduates
              - text: to join our
              - strong [ref=f2166e102]: Software Development team
              - text: as Associate Software Engineers. In this role, you will work on building, enhancing, and maintaining enterprise-grade software products while gaining hands-on experience with modern technologies, development practices, and domain knowledge.
            - separator [ref=f2166e103]
            - paragraph [ref=f2166e104]:
              - strong [ref=f2166e105]: Key Responsibilities
            - list [ref=f2166e106]:
              - listitem [ref=f2166e107]:
                - text: Design, develop, test, and maintain
                - strong [ref=f2166e108]: software modules and features
              - listitem [ref=f2166e109]:
                - text: Write
                - strong [ref=f2166e110]: clean, efficient, and well-documented code
                - text: following coding standards
              - listitem [ref=f2166e111]:
                - text: Participate in
                - strong [ref=f2166e112]: code reviews, unit testing, and defect fixing
              - listitem [ref=f2166e113]:
                - text: Work closely with
                - strong [ref=f2166e114]: senior developers, QA, and product teams
              - listitem [ref=f2166e115]: Understand functional and technical requirements of assigned components
              - listitem [ref=f2166e116]:
                - text: Follow established
                - strong [ref=f2166e117]: development processes and Agile practices
              - listitem [ref=f2166e118]:
                - text: Actively participate in
                - strong [ref=f2166e119]: technical training, knowledge sharing, and team discussions
            - paragraph [ref=f2166e120]:
              - strong [ref=f2166e121]: What We’re Looking For
            - list [ref=f2166e122]:
              - listitem [ref=f2166e123]: BE / BTech / MCA / MSc (CS/IT or related discipline)
              - listitem [ref=f2166e124]:
                - text: Strong fundamentals in
                - strong [ref=f2166e125]: programming, OOP concepts, databases and SQL
              - listitem [ref=f2166e126]:
                - text: Exposure to
                - strong [ref=f2166e127]: Java / C / C++ / Python / Web technologies
              - listitem [ref=f2166e128]: Good problem-solving and communication skills
              - listitem [ref=f2166e129]: Passion to learn and grow in software development
              - listitem [ref=f2166e130]: Interest in enterprise applications or ERP systems
            - paragraph
            - heading [level=4] [ref=f2166e131]:
