            - paragraph [ref=f548e102]:
              - strong [ref=f548e103]: "Degree Required:"
              - text: BE/B.Tech/BCA/BSC/MCA or Related
            - heading [level=2] [ref=f548e104]:
              - strong [ref=f548e105]: Job Description
            - paragraph [ref=f548e106]: We are looking for an Associate Software Engineer to join our engineering team at Firstsource. In this role you will build, test, and maintain application components and data services, working closely with senior engineers, business analysts, and product owners. This is a hands-on development role ideal for someone early in their career who is strong in Python, comfortable working with relational databases, and eager to grow their cloud skills on Microsoft Azure.
            - heading "Key Responsibilities" [level=4] [ref=f548e107]
            - list [ref=f548e108]:
              - listitem [ref=f548e109]: Develop, test, and maintain application features and backend services using Python.
              - listitem [ref=f548e110]: Write and optimise SQL queries, stored procedures, and schema changes against MySQL databases.
              - listitem [ref=f548e111]: Build and consume APIs and integrate with internal and third-party services.
              - listitem [ref=f548e112]: Deploy, monitor, and support applications and services on Microsoft Azure.
              - listitem [ref=f548e113]: Debug, troubleshoot, and resolve defects across development, test, and production environments.
              - listitem [ref=f548e114]: Participate in code reviews, follow coding standards, and contribute to clean, well-documented code.
              - listitem [ref=f548e115]: Collaborate with cross-functional teams (product, QA, operations) in an Agile/Scrum setup.
              - listitem [ref=f548e116]: Prepare and maintain technical documentation for the components you build.
            - heading "Required Skills" [level=4] [ref=f548e117]
            - list [ref=f548e118]:
              - listitem [ref=f548e119]:
                - strong [ref=f548e120]: Python
                - text: — solid working knowledge of core Python, scripting, and at least one framework (e.g. Flask, FastAPI, or Django).
              - listitem [ref=f548e121]:
                - strong [ref=f548e122]: MySQL
                - text: — ability to design tables, write efficient queries and joins, and understand indexing and basic query optimisation.
              - listitem [ref=f548e123]:
                - strong [ref=f548e124]: Microsoft Azure
                - text: — foundational knowledge of Azure services (e.g. App Service, Azure SQL/Database, Storage, Functions) and cloud deployment concepts.
              - listitem [ref=f548e125]: Understanding of REST APIs and JSON.
              - listitem [ref=f548e126]: Familiarity with version control (Git).
              - listitem [ref=f548e127]: Good problem-solving skills and attention to detail.
              - listitem [ref=f548e128]: Strong written and verbal communication; ability to work in a team.
            - heading "Good to Have" [level=4] [ref=f548e129]
            - list [ref=f548e130]:
              - listitem [ref=f548e131]: Exposure to CI/CD pipelines (e.g. Azure DevOps, GitHub Actions).
              - listitem [ref=f548e132]: Basic knowledge of containerisation (Docker).
              - listitem [ref=f548e133]: Understanding of Agile/Scrum ways of working.
              - listitem [ref=f548e134]: Familiarity with unit testing frameworks (e.g. pytest).
              - listitem [ref=f548e135]: Any Microsoft Azure certification (e.g. AZ-900) is a plus.
            - heading "Qualifications" [level=4] [ref=f548e136]
            - list [ref=f548e137]:
              - listitem [ref=f548e138]: Bachelor’s degree in Computer Science, Information Technology, Engineering, or a related field.
              - listitem [ref=f548e139]: 0–2 years of relevant software development experience (internships and academic projects count).
            - heading "What We Offer" [level=4] [ref=f548e140]
            - list [ref=f548e141]:
              - listitem [ref=f548e142]: Structured onboarding and mentorship from senior engineers.
              - listitem [ref=f548e143]: Exposure to enterprise-scale projects and modern cloud technology.
              - listitem [ref=f548e144]: Clear career growth path within Firstsource’s technology function.
              - listitem [ref=f548e145]: A collaborative, learning-focused work environment.
            - paragraph [ref=f548e146]: The interested and eligible candidates register on the following Firstsource off campus drive application link.
            - insertion [ref=f548e148]
