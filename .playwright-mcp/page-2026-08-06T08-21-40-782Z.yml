            - heading [level=2] [ref=f2110e103]:
              - strong [ref=f2110e104]: Job Description
              - text: ":"
            - paragraph [ref=f2110e105]: The Cisco IT team is dedicated to empowering Cisco’s business units by managing and optimizing critical developer tools, platforms, and production environments. Our Developer Tools team ensures seamless development and deployment processes, enabling business teams to deliver key outcomes without disruption. The Service Management team vigilantly monitors production systems, maintaining high availability and responsiveness for service requirements.
            - paragraph [ref=f2110e106]: Drive the timely completion of mandatory certifications and apprenticeship projects, building a foundational understanding of Asset Management business operations and service delivery frameworks.
            - paragraph [ref=f2110e107]: Act as a backup Customer Account Manager (CAM) during the second half of the program, providing essential support to assigned accounts and ensuring seamless service continuity.
            - paragraph [ref=f2110e108]:
              - text: Contribute to the development and implementation of automation projects designed to enhance the accuracy, efficiency, and scalability of our delivery processes.Proactively apply technical skills to identify process improvements, helping to streamline workflows and improve overall team performance.
              - link "Internships" [ref=f2110e109] [cursor=pointer]
            - paragraph [ref=f2110e113]:
              - strong [ref=f2110e114]: Preferred Qualifications
            - list [ref=f2110e115]:
              - listitem [ref=f2110e116]: Completed bachelor’s degree in (BCA,B.Tech,BE) or related field.
              - listitem [ref=f2110e117]: You must have graduated in 2025/2026 and should have Provisional Degree Certificate.
              - listitem [ref=f2110e118]: Must be available for a period of 12 months starting Sept 2026
              - listitem [ref=f2110e119]: Basic Knowledge of MS office tools
              - listitem [ref=f2110e120]: Good communication skills, passion& desire to learn,”Can d” attitude, proactive engagement, solutions seeking& a team player.
              - listitem [ref=f2110e121]: Must have enrolled as a”studen” on https://nats.education.gov.in/ and have a valid student enrolment number issued by NATS.
