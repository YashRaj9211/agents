            - paragraph [ref=f1923e115]:
              - text: As an early-career engineer at Nexla, you won’t be stuck on bug fixes for months. You will write core code, debug production systems, and help us build the next generation of intelligent, context-aware connectors that power the GenAI revolution.
              - link "Civil Engineering" [ref=f1923e116] [cursor=pointer]
            - heading "Responsibilities" [level=3] [ref=f1923e120]
            - list [ref=f1923e121]:
              - listitem [ref=f1923e122]:
                - strong [ref=f1923e123]: "Build & Ship (70%):"
                - text: Implement core features like intelligent pagination, schema evolution, and rate-limiting. You’ll own your code from the first line to the final deployment.
              - listitem [ref=f1923e124]:
                - strong [ref=f1923e125]: "Solve “Dirty” Data Problems:"
                - text: Real-world data is messy. You’ll build self-recovery mechanisms and automated retries to keep massive pipelines running without human intervention.
              - listitem [ref=f1923e126]:
                - strong [ref=f1923e127]: "Learn Distributed Systems at Scale:"
                - text: You’ll dive deep into Kafka and distributed runtimes. You won’t just use these tools; you’ll learn how to tune them for maximum performance.
              - listitem [ref=f1923e128]:
                - strong [ref=f1923e129]: "Architectural Growth:"
                - text: Work alongside our CTO and senior leads to understand why we make certain tech choices (e.g., Java vs. Rust) and how to design for multi-tenancy and low latency.
              - listitem [ref=f1923e130]:
                - strong [ref=f1923e131]: "Documentation & Quality:"
                - text: We believe “done” means documented. You’ll write SDK docs and RFCs, ensuring our platform is easy for other developers to use.
            - heading "Qualifications" [level=3] [ref=f1923e132]
            - paragraph [ref=f1923e133]:
              - strong [ref=f1923e134]: "Must-Haves:"
            - generic [ref=f1923e137]:
              - generic [ref=f1923e138]:
                - generic [ref=f1923e139]: WhatsApp Channel
                - link "Join Now" [ref=f1923e141] [cursor=pointer]:
                  - /url: https://chat.whatsapp.com/LD7u8YPDaP7JDTDrnpwNNP
              - generic [ref=f1923e142]:
                - generic [ref=f1923e143]: Telegram Channel
                - link "Join Now" [ref=f1923e145] [cursor=pointer]:
                  - /url: https://telegram.me/campusdrivejobs
            - list [ref=f1923e146]:
              - listitem [ref=f1923e147]: 0-2 years of experience in software engineering (internships count!).
              - listitem [ref=f1923e148]:
                - strong [ref=f1923e149]: "Strong Foundations:"
                - text: You are comfortable with Java, Kotlin, or Scala. You understand the basics of concurrency and how the JVM works.
              - listitem [ref=f1923e150]:
                - strong [ref=f1923e151]: "CS Fundamentals:"
                - text: You know your way around data structures, algorithms, and REST APIs.
              - listitem [ref=f1923e152]:
                - strong [ref=f1923e153]: "The “Builder” Spirit:"
                - text: You have a GitHub repo, a side project, or a technical blog that shows you love to tinker and learn.
              - listitem [ref=f1923e154]:
                - strong [ref=f1923e155]: "Ownership Mindset:"
                - text: You don’t wait for a perfectly groomed ticket. You thrive in ambiguity and are willing to jump into a production issue to help the team.
              - listitem [ref=f1923e156]:
                - strong [ref=f1923e157]: "Global Collaboration Window:"
                - text: Ability to overlap with morning PST (Pacific Standard Time) working hours for syncs, design reviews, and collaboration with our US-based leadership and engineering teams.
            - paragraph [ref=f1923e158]:
              - strong [ref=f1923e159]: "Nice-to-Haves:"
            - list [ref=f1923e160]:
              - listitem [ref=f1923e161]: Exposure to the Modern Data Stack (Snowflake, Databricks, Kafka, or Spark).
              - listitem [ref=f1923e162]: Experience with Docker or Kubernetes.
              - listitem [ref=f1923e163]: A background in competitive programming or contributions to open-source projects.
              - listitem [ref=f1923e164]: Interest in Generative AI and how data feeds LLM agents.
            - heading "Selection Process" [level=2] [ref=f1923e165]
            - paragraph [ref=f1923e166]:
              - text: "The Nexla recruitment process is designed to identify the best technical talent. It consists of the following rounds:"
              - link "Data Management" [ref=f1923e167] [cursor=pointer]
            - insertion [ref=f1923e172]
            - list [ref=f1923e174]:
              - listitem [ref=f1923e175]:
                - strong [ref=f1923e176]: "Profile Screening:"
                - text: Review of resumes and technical portfolios.
              - listitem [ref=f1923e177]:
                - strong [ref=f1923e178]: "Online Test:"
                - text: Assessing coding skills and CS fundamentals.
              - listitem [ref=f1923e179]:
                - strong [ref=f1923e180]: "Technical Interview:"
                - text: Deep dive into engineering concepts and problem-solving.
              - listitem [ref=f1923e181]:
                - strong [ref=f1923e182]: "HR Interview:"
                - text: Cultural fit and behavioral assessment.
