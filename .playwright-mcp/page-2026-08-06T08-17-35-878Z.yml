            - heading "Job Description :" [level=2] [ref=f1883e107]
            - paragraph [ref=f1883e108]:
              - text: We are seeking a technically skilled Software Engineer with at least 1-3 years of experience in Software Development & L3 level Support of product applications. The ideal candidate will be responsible for diagnosing and resolving technical issues, handling Incident Management, code optimize to improve operational efficiency.
              - strong [ref=f1883e109]: Key Responsibilities
              - link "Civil Engineering" [ref=f1883e110] [cursor=pointer]
            - generic [ref=f1883e116]:
