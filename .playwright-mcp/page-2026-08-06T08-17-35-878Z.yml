              - generic [ref=f1883e121]:
                - generic [ref=f1883e122]: Telegram Channel
                - link "Join Now" [ref=f1883e124] [cursor=pointer]:
                  - /url: https://telegram.me/campusdrivejobs
            - list [ref=f1883e125]:
              - listitem [ref=f1883e126]: Application Support & Incident Management
              - listitem [ref=f1883e127]: Act as Level 3 escalation point for complex production issues, providing expert support to L1 and L2 teams.
              - listitem [ref=f1883e128]: Analyz and resolve applications, databases, and report issues across legacy and .NET platforms.
              - listitem [ref=f1883e129]: Conduct Root Cause Analysis (RCA) and implemented permanent solutions to prevent recurrence.
              - listitem [ref=f1883e130]: Manage critical incidents with a focus on minimizing business impact and ensuring SLA compliance.
              - listitem [ref=f1883e131]: Improve system stability by proactively identifying recurring issues and optimizing application behaviour.
              - listitem [ref=f1883e132]: Application Development & MaintenanceMaintain and enhanced legacy VB6 applications, ensuring continued reliability and performance.
              - listitem [ref=f1883e133]: Support development and enhancement of .NET / C# applications, including bug fixes and minor feature additions.
              - listitem [ref=f1883e134]: Debug legacy and modern codebase to resolve defects and optimize business logic.
              - listitem [ref=f1883e135]: Follow best programming practices, including Code quality standards, Peer reviews, Documentation, Definition of Done (DoD)
              - listitem [ref=f1883e136]: Support application upgrades, patches, and minor enhancements in production environments.
              - listitem [ref=f1883e137]: Database & Reporting SupportDevelop, optimize, and troubleshot SQL queries, stored procedures, functions, and views on MS SQL Server.
              - listitem [ref=f1883e138]: Support enterprise reporting solutions using Crystal Reports and SSRS, including Fixing report failures, Performance tuning, Enhancing report reliability
              - listitem [ref=f1883e139]:
                - text: Assist with
                - link "data" [ref=f1883e140] [cursor=pointer]:
                  - /url: "#"
                - text: validation, data corrections, and impact analysis in production systems.
              - listitem [ref=f1883e143]: Partner with business users to ensure reporting accuracy and data consistency.
              - listitem [ref=f1883e144]: Collaboration, Mentoring & Knowledge Management
              - listitem [ref=f1883e145]: Work closely with business users, development teams, and global stakeholders in an international environment.
              - listitem [ref=f1883e146]: Provide technical guidance and mentoring to L1 and L2 support engineers.
              - listitem [ref=f1883e147]: "Create and maintain: Technical documentation, SOPs, Knowledge Base (KB) articles"
              - listitem [ref=f1883e148]: Participate actively in code reviews, solution design, and technical discussions.
            - paragraph [ref=f1883e149]:
              - text: "Demonstrate strong alignment with Scrum values: Commitment, Focus, Openness, Respect, and Courage."
              - strong [ref=f1883e150]: Experience
            - list [ref=f1883e151]:
              - listitem [ref=f1883e152]:
                - text: 1 – 3 years of hands-on experience in developing, maintaining, and supporting
                - link "software" [ref=f1883e153] [cursor=pointer]:
                  - /url: "#"
                - text: solutions using VB6 with MS SQL and .NET Core
              - listitem [ref=f1883e156]: Extensive experience across the full software development lifecycle (SDLC), including requirements analysis, design, coding, testing, deployment, and production support.
              - listitem [ref=f1883e157]: Practical exposure to working in an Agile/Scrum environment, collaborating with cross‑functional teams to deliver stable and high‑quality solutions.
              - listitem [ref=f1883e158]: Good understanding of object-oriented programming (OOP); able to solve technical problems
              - listitem [ref=f1883e159]: Working knowledge of Web application development using .NET Core (6/7/8), C#, Asp.net Core, MVC, Web API, Postman.
              - listitem [ref=f1883e160]: Experience with usage of Azure DevOps
