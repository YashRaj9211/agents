              - strong [ref=f1262e111]: Job Description
            - paragraph [ref=f1262e112]:
              - text: An Associate Software Engineer is an entry-level position responsible for assisting in the development, maintenance, and improvement of software applications. They work closely with senior team members to learn and apply best practices in software development, coding, testing, and problem-solving.
              - link "Civil Engineering" [ref=f1262e113] [cursor=pointer]
            - paragraph [ref=f1262e117]:
              - strong [ref=f1262e118]: Essential Functions
              - text: ":"
            - list [ref=f1262e119]:
              - listitem [ref=f1262e120]: Collaborate with team members to understand and document software requirements.
              - listitem [ref=f1262e121]: Assist in coding, debugging, and testing software components and features.
              - listitem [ref=f1262e122]: Participate in code reviews and provide constructive feedback.
              - listitem [ref=f1262e123]: Troubleshoot and resolve basic software defects and issues.
              - listitem [ref=f1262e124]: Continuously learn and adapt to modern technologies and development practices.
              - listitem [ref=f1262e125]: Contribute to the improvement of coding standards and development processes.
              - listitem [ref=f1262e126]: Document learning and making repositories for teams use.
            - paragraph [ref=f1262e127]:
              - strong [ref=f1262e128]: Qualifications
              - text: ":"
            - list [ref=f1262e129]:
              - listitem [ref=f1262e130]: Bachelor’s degree in computer science or equivalent training and 0-1 years of experience, fresh engineering graduates with great attitude and excellent academic background.
              - listitem [ref=f1262e131]: Fresh engineering graduates with degrees in Computer Science, Information Science, Electronics and any other related branch with minimum 60% aggregate.
              - listitem [ref=f1262e132]: Strong understanding of programming languages such as Java, Python, Swift, JavaScript, or similar.
              - listitem [ref=f1262e133]: Basic knowledge of software development methodologies and practices.
              - listitem [ref=f1262e134]: Strong problem-solving and analytical skills.
              - listitem [ref=f1262e135]: Excellent communication and teamwork skills.
              - listitem [ref=f1262e136]: Prior internship or project experience in software development preferred
              - listitem [ref=f1262e137]: Awareness of Agile principles preferred
