            - heading "Eligibility Criteria:" [level=5] [ref=f2915e108]
            - list [ref=f2915e109]:
              - listitem [ref=f2915e110]: 2024 and 2025 Pass out of B.E/B.Tech students ONLY with 60% or 6 above CGPA
              - listitem [ref=f2915e111]: Must have passed all subjects of graduation (Not just course completion certificate)
              - listitem [ref=f2915e112]: Should have valid Graduation Provisional Certificate
              - listitem [ref=f2915e113]: Should have valid Aadhaar Card
              - listitem [ref=f2915e114]: Should not have applied or registered as an Apprenticeship with any other organization using Student Login of National Apprentice Training Scheme (NATS) portal
              - listitem [ref=f2915e115]: Candidates who are pursuing or completed Apprenticeship with any other organization are not eligible
              - listitem [ref=f2915e116]: Candidates who worked as an employee or working as an employee are not eligible
              - listitem [ref=f2915e117]: Indian citizen ONLY
            - heading "What you’ll do:" [level=5] [ref=f2915e118]
            - list [ref=f2915e119]:
              - listitem [ref=f2915e120]: Coding/Individual to gather and understand the functional reported issues/problems and drive towards solutions.
              - listitem [ref=f2915e121]:
                - text: Follow the
                - link "software" [ref=f2915e122] [cursor=pointer]:
                  - /url: "#"
                - text: development lifecycle.
              - listitem [ref=f2915e125]: Coordinate with all cross-functional teams to analyse all issues.
              - listitem [ref=f2915e126]: Document unit test procedures and participate in the software development process to perform all tests on designs and ensure compliance with all Object-Oriented Programming activities.
              - listitem [ref=f2915e127]: Diagnose all root causes to recommend required actions and assist in defining and classifying all issues and projects to avoid reoccurrence of issues and prepare automation responses if required.
            - heading "Evaluation Process:" [level=5] [ref=f2915e128]
            - list [ref=f2915e129]:
              - listitem [ref=f2915e130]: Apply to the apprentice program (Use “Apply Now” button)
